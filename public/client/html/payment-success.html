<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Paiement réussi | Nature+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #d4edda, #b7e4c7);
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
            animation: fadeUp 0.6s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-success {
            width: 80px;
            height: 80px;
            background: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 40px;
            color: white;
            box-shadow: 0 4px 20px rgba(40, 167, 69, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #155724;
            margin-bottom: 8px;
        }

        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 6px;
            line-height: 1.6;
        }

        .sub {
            font-size: 14px;
            color: #888;
            margin-bottom: 4px;
        }

        .commande-info {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 12px 16px;
            margin: 16px 0;
            border: 1px solid #e8ecf4;
        }

        .commande-info .label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .commande-info .value {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e8e8f0;
            border-top-color: #28a745;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 12px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-primary {
            background: #2d7d46;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: #1a5a33;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: #e8e8f0;
            color: #1a1a2e;
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background: #d5d5e0;
            transform: scale(1.02);
        }

        .error-box {
            background: #f8d7da;
            color: #721c24;
            padding: 16px;
            border-radius: 12px;
            margin: 12px 0;
            border: 1px solid #f5c6cb;
            display: none;
        }

        .error-box.show {
            display: block;
        }

        #loadingSpinner {
            display: none;
        }
        #loadingSpinner.show {
            display: block;
        }

        #successActions {
            display: none;
        }
        #successActions.show {
            display: block;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 24px;
            }
            .icon-success {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }
            .btn-actions {
                flex-direction: column;
            }
            .btn-primary,
            .btn-secondary {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-success">✓</div>
        <h1>✅ Paiement réussi !</h1>
        <p>Votre commande est confirmée et en cours de préparation.</p>
        <p class="sub">Vous recevrez une notification dès que votre commande sera prête.</p>

        <div class="commande-info">
            <div class="label">📋 Commande</div>
            <div class="value" id="commandeId">#---</div>
        </div>

        <div id="errorContainer" class="error-box">
            <strong>⚠️ Problème</strong>
            <p style="margin-top:8px;font-size:14px;" id="errorText">Impossible de mettre à jour le statut.</p>
        </div>

        <div id="loadingSpinner" class="spinner show"></div>

        <div id="successActions">
            <p style="color:#155724;font-weight:600;margin-top:4px;">✅ Mise à jour effectuée !</p>
        </div>

        <div class="btn-actions">
            <a href="/mescommandes" class="btn-primary">
                📋 Voir mes commandes
            </a>
            <a href="/dashboard" class="btn-secondary">
                🏠 Retour à l'accueil
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ payment-success.html (version sans session)');

            const urlParams = new URLSearchParams(window.location.search);
            const reference = urlParams.get('reference');

            const commandeIdEl = document.getElementById('commandeId');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const errorContainer = document.getElementById('errorContainer');
            const errorText = document.getElementById('errorText');
            const successActions = document.getElementById('successActions');

            const PAYMENT_API_URL = 'https://nature-plus-pay.onrender.com';

            async function handlePaymentSuccess() {
                try {
                    let commandeId = null;

                    // 1️⃣ Récupérer le commande_id via la référence
                    if (reference) {
                        const checkRes = await fetch(`${PAYMENT_API_URL}/api/payment/check/${reference}`);
                        if (checkRes.ok) {
                            const checkData = await checkRes.json();
                            if (checkData.success && checkData.data) {
                                commandeId = checkData.data.commande_id ||
                                             checkData.data.metadata?.order_id ||
                                             null;
                            }
                        }
                    }

                    // 2️⃣ Si commande trouvée → mettre à jour le statut
                    if (commandeId) {
                        commandeIdEl.textContent = '#' + commandeId;

                        const updateRes = await fetch(`${PAYMENT_API_URL}/api/payment/update-status`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                commandeId: commandeId,
                                status: 'payee'
                            })
                        });

                        const updateData = await updateRes.json();

                        if (updateRes.ok) {
                            loadingSpinner.classList.remove('show');
                            successActions.classList.add('show');
                        } else {
                            throw new Error(updateData.error || 'Erreur mise à jour');
                        }
                    } else {
                        // Pas de commande trouvée
                        loadingSpinner.classList.remove('show');
                        errorContainer.classList.add('show');
                        errorText.textContent = 'Commande introuvable. Contactez le support.';
                    }

                } catch (error) {
                    console.error('❌ Erreur:', error);
                    loadingSpinner.classList.remove('show');
                    errorContainer.classList.add('show');
                    errorText.textContent = error.message || 'Une erreur est survenue.';
                }
            }

            // Démarrer après 1s
            setTimeout(() => {
                handlePaymentSuccess();
            }, 1000);

        });
    </script>

</body>
</html>
