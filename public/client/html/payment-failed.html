<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⏳ Paiement non finalisé | Nature+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px 32px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            max-width: 480px;
            width: 100%;
            animation: fadeUp 0.5s ease-out;
            border: 1px solid rgba(230, 126, 34, 0.12);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* HEADER */
        .header-warning {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff3e0;
            padding: 12px 18px;
            border-radius: 12px;
            border-left: 5px solid #e67e22;
            margin-bottom: 20px;
        }

        .header-warning .icon {
            font-size: 26px;
        }

        .header-warning .title {
            font-size: 20px;
            font-weight: 700;
            color: #e67e22;
        }

        /* MESSAGE */
        .message {
            font-size: 16px;
            line-height: 1.6;
            color: #3d3d3d;
            margin-bottom: 18px;
            padding: 0 4px;
        }

        .message strong {
            color: #e67e22;
        }

        /* COMMANDE ID */
        .commande-info {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 18px;
            border: 1px solid #e8ecf4;
            text-align: center;
        }

        .commande-info .label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .commande-info .value {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
        }

        /* TIMER */
        .timer-box {
            background: #fef9f0;
            border: 1px dashed #e67e22;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: center;
            margin-bottom: 24px;
        }

        .timer-box .label {
            font-size: 13px;
            color: #888;
            display: block;
            margin-bottom: 2px;
        }

        .timer-box .time {
            font-size: 28px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #e67e22;
            letter-spacing: 2px;
        }

        .timer-box .time.expired {
            color: #dc3545;
        }

        /* BOUTON */
        .btn-dashboard {
            display: block;
            width: 100%;
            padding: 16px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-dashboard:hover {
            background: #d35400;
            transform: scale(1.01);
        }

        .btn-dashboard i {
            margin-right: 8px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 18px 24px;
            }
            .header-warning .title {
                font-size: 17px;
            }
            .message {
                font-size: 15px;
            }
            .timer-box .time {
                font-size: 24px;
            }
            .btn-dashboard {
                font-size: 16px;
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER AVERTISSEMENT -->
        <div class="header-warning">
            <span class="icon">⚠️</span>
            <span class="title">Avertissement !</span>
        </div>

        <!-- MESSAGE -->
        <div class="message">
            Le paiement n’a pas été effectué.<br /><br />
            Veuillez <strong>retourner dans l’application</strong> pour reprendre le processus.<br /><br />
            <strong>🔒 Le lien expire automatiquement après 20 minutes.</strong>
        </div>

        <!-- COMMANDE ID (si dispo) -->
        <div class="commande-info">
            <div class="label">📋 Commande</div>
            <div class="value" id="commandeId">#---</div>
        </div>

        <!-- TIMER -->
        <div class="timer-box">
            <span class="label">⏳ Temps restant</span>
            <span class="time" id="timerDisplay">20:00</span>
        </div>

        <!-- BOUTON RETOUR DASHBOARD -->
        <a href="/dashboard" class="btn-dashboard">
            <i class="fas fa-home"></i> Retour à l’accueil
        </a>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // Récupérer l'ID commande depuis l'URL
            const urlParams = new URLSearchParams(window.location.search);
            const commandeId = urlParams.get('commande_id') || urlParams.get('id') || '---';
            document.getElementById('commandeId').textContent = '#' + commandeId;

            // Timer 20 minutes
            const timerEl = document.getElementById('timerDisplay');
            const expiryTime = Date.now() + 20 * 60 * 1000;

            function updateTimer() {
                const diff = expiryTime - Date.now();
                if (diff <= 0) {
                    timerEl.textContent = '⏳ Expiré';
                    timerEl.classList.add('expired');
                    return;
                }
                const m = String(Math.floor(diff / 60000)).padStart(2, '0');
                const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
                timerEl.textContent = m + ':' + s;
            }

            updateTimer();
            setInterval(updateTimer, 1000);

        });
    </script>

</body>
</html>
