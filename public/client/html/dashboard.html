<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComPlus | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/client/css/dashboard.css">
</head>
<body>

    <!-- ========================================= -->
    <!-- TEXTE EN ARRIÈRE-PLAN                      -->
    <!-- ========================================= -->
    <div class="header-background-text">ComPlus</div>

    <!-- ========================================= -->
    <!-- HEADER GLOBAL                             -->
    <!-- ========================================= -->
    <header class="dashboard-header" id="dashboardHeader">
        <div class="header-center">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-bar" placeholder="Rechercher un produit...">
            </div>
        </div>
        <div class="header-right">
            <a href="/mescommandes" class="header-btn" title="Mes commandes">
                <i class="fas fa-clipboard-list"></i>
                <span class="badge" id="commandeBadge">0</span>
            </a>
            <a href="/notification" class="header-btn" title="Notifications">
                <i class="fas fa-bell"></i>
                <span class="badge" id="notifBadge">0</span>
            </a>
            <a href="/panier" class="header-btn" title="Mon panier">
                <i class="fas fa-shopping-cart"></i>
                <span class="badge" id="cartBadge">0</span>
            </a>
            <a href="/profil" class="header-btn" title="Mon profil">
                <i class="fas fa-user-circle"></i>
            </a>
        </div>
    </header>

    <!-- ========================================= -->
    <!-- MAIN (scrollable)                         -->
    <!-- ========================================= -->
    <main class="dashboard-main" id="dashboardMain">

        <!-- CARROUSEL PRODUITS -->
        <div class="carousel-wrapper">
            <div class="carousel-card" id="carouselCard">

                <div class="carousel-header" id="carouselHeader">
                    <button class="carousel-nav-btn prev" id="prevProduct">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span class="carousel-title" id="productName">Nom du produit</span>
                    <button class="carousel-nav-btn next" id="nextProduct">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <div class="carousel-main">
                    <div class="carousel-image-wrapper" id="productImageWrapper">
                        <div id="productImagePlaceholder" class="image-placeholder">
                            <i class="fas fa-spinner fa-spin"></i>
                            <span>Chargement...</span>
                        </div>
                        <img id="productImage" src="" alt="Produit" style="display:none;">
                    </div>
                </div>

                <!-- ✅ NOUVEAU FOOTER AVEC SCROLL + BADGE NOUVEAU -->
                <div class="carousel-footer" id="carouselFooter">
                    
                    <!-- Badge Nouveau (rouge) -->
                    <span class="badge-new" id="badgeNew" style="display:none;">⭐ Nouveau</span>

                    <!-- Stock -->
                    <span class="product-stock" id="productStock">📦 En stock</span>

                    <!-- Prix : ancien barré + nouveau en vert -->
                    <div class="product-price-wrapper">
                        <span class="product-price-old" id="productPriceOld"></span>
                        <span class="product-price" id="productPrice">0 FCFA</span>
                    </div>

                    <!-- Boutons -->
                    <button class="btn-add-cart" id="addToCartBtn">
                        <i class="fas fa-plus-circle"></i> Ajouter
                    </button>
                    <button class="btn-view-detail" id="viewDetailBtn">
                        <i class="fas fa-eye"></i> Voir
                    </button>

                    <!-- Indicateur -->
                    <span class="carousel-indicator-inline">
                        <span id="currentIndex">1</span> / <span id="totalProducts">1</span>
                    </span>

                    <!-- ✅ INFOS SUPPÉLÉMENTAIRES (scrollable) -->
                    <div class="product-infos-scroll" id="productInfosScroll">
                        <div class="product-infos-wrapper" id="productInfosWrapper">
                            <!-- Injecté par JS -->
                        </div>
                    </div>

                </div>

            </div>
        </div>

        <!-- SEPARATION 8px -->
        <div class="separator-8px"></div>

        <!-- CARTE COMPLUS / CONNECT -->
        <div id="dynamicCard">
            <!-- Injecté par JS -->
        </div>

        <!-- ESPACE -->
        <div class="spacer-10px"></div>

    </main>

    <!-- ========================================= -->
    <!-- ✅ CARTE NOUVEAUTÉS & PROMOTIONS (remplace boutiques) -->
    <!-- ========================================= -->
    <div class="new-promo-card" id="newPromoCard">
        <div class="new-promo-content" onclick="window.location.href='/new'">
            <div class="new-promo-top">
                <span class="new-promo-icon">🔥</span>
                <h2>Nouveautés &amp; Promotions</h2>
            </div>
            <p>Découvrez nos derniers produits et offres exclusives</p>
            <div class="new-promo-arrow">
                Voir les nouveautés <i class="fas fa-arrow-right"></i>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script src="/client/js/dashboard.js"></script>
</body>
</html>
