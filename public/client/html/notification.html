<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔔 Notifications | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/client/css/notification.css">
</head>
<body>

    <!-- ============================================================= -->
    <!-- HEADER                                                        -->
    <!-- ============================================================= -->
    <header class="notif-header">
        <button class="back-btn" onclick="window.location.href='/dashboard'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="notif-title">
            <i class="fas fa-bell"></i> Notifications
        </span>
        <span class="badge-count" id="notifBadge">0</span>
        <button class="btn-sync active" id="syncBtn" title="Synchronisation active">
            <i class="fas fa-sync-alt"></i>
            <span class="sync-status active" id="syncStatus">●</span>
        </button>
    </header>

    <!-- ============================================================= -->
    <!-- CONTENU                                                        -->
    <!-- ============================================================= -->
    <main class="notif-main" id="notifMain">

        <!-- SKELETON LOADER -->
        <div id="skeletonLoader" class="skeleton-loader">
            <div class="skeleton-item">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-body">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line"></div>
                </div>
            </div>
            <div class="skeleton-item">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-body">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line"></div>
                </div>
            </div>
            <div class="skeleton-item">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-body">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line"></div>
                </div>
            </div>
            <div class="skeleton-item">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-body">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line"></div>
                </div>
            </div>
            <div class="skeleton-item">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-body">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line"></div>
                </div>
            </div>
        </div>

        <!-- LISTE DES NOTIFICATIONS -->
        <div id="notifList"></div>

    </main>

    <!-- ============================================================= -->
    <!-- OVERLAY CONFIRMATION                                          -->
    <!-- ============================================================= -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <div class="confirm-icon">🗑️</div>
            <h3>Supprimer la notification</h3>
            <p>Êtes-vous sûr de vouloir supprimer cette notification ?</p>
            <div class="confirm-actions">
                <button class="confirm-btn cancel" id="confirmCancel">Annuler</button>
                <button class="confirm-btn ok danger" id="confirmOk">Supprimer</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script src="/client/js/notification.js"></script>
</body>
</html>
