<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/client/css/notification.css">
</head>
<body>

    <!-- ============================================================= -->
    <!-- HEADER AVEC 2 RECTANGLES ARRONDIS                              -->
    <!-- ============================================================= -->

    <header class="notif-header-wrapper">

        <!-- RECTANGLE 1 : HEADER (vert) -->
        <div class="notif-header">
            <button class="back-btn" onclick="window.location.href='/dashboard'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <span class="notif-title">🔔 Notifications</span>
            <span class="badge-count" id="notifBadge">0</span>
            <button class="btn-sync" id="syncBtn" title="Synchronisation en temps réel">
                <i class="fas fa-sync-alt"></i>
                <span class="sync-status" id="syncStatus">●</span>
            </button>
            <button class="btn-read-all" id="readAllBtn">
                <i class="fas fa-check-double"></i> Tout lu
            </button>
        </div>

        <!-- RECTANGLE 2 : FILTRES (blanc, scrollable) -->
        <div class="notif-filter-bar">
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">📋 Toutes</button>
                <button class="filter-btn" data-filter="commande">📦 Commandes</button>
                <button class="filter-btn" data-filter="paiement">💳 Paiements</button>
                <button class="filter-btn" data-filter="admin">📢 Admin</button>
                <button class="filter-btn" data-filter="seller">🛍️ Boutiques</button>
                <button class="filter-btn" data-filter="systeme">⚙️ Système</button>
            </div>
            <!-- Filtre "Déjà lu" -->
            <div class="filter-read-toggle">
                <label class="toggle-label">
                    <input type="checkbox" id="showReadToggle" />
                    <span class="toggle-slider"></span>
                    <span class="toggle-text">Afficher les lues</span>
                </label>
            </div>
        </div>

    </header>

    <!-- ============================================================= -->
    <!-- CONTENU                                                        -->
    <!-- ============================================================= -->

    <main class="notif-main" id="notifMain">
        <!-- SKELETON LOADER -->
        <div id="skeletonLoader" class="skeleton-loader">
            <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
        </div>

        <!-- NOTIFICATIONS -->
        <div id="notifList"></div>
    </main>

    <!-- ============================================================= -->
    <!-- FOOTER MESSAGE FIXE AVEC SÉLECTEUR ADMIN/SELLER                -->
    <!-- ============================================================= -->

    <footer class="notif-footer" id="notifFooter">
        <div class="footer-container">

            <!-- Sélecteur Admin / Boutique -->
            <div class="dest-selector">
                <button class="dest-btn active" data-target="admin" id="destAdminBtn">
                    <i class="fas fa-user-shield"></i> Admin
                </button>
                <button class="dest-btn" data-target="seller" id="destSellerBtn">
                    <i class="fas fa-store"></i> Boutique
                </button>
            </div>

            <!-- Sélecteur boutique (caché par défaut) -->
            <div class="shop-selector" id="shopSelector" style="display:none;">
                <select id="shopSelect">
                    <option value="">Choisir une boutique...</option>
                </select>
            </div>

            <!-- Message + Envoyer -->
            <div class="message-wrapper">
                <div class="message-input-container">
                    <textarea 
                        id="messageInput" 
                        class="message-input" 
                        rows="1"
                        placeholder="Envoyer un message..."
                    ></textarea>
                </div>
                <button class="btn-send-message" id="sendMessageBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>

            <div id="sendMessageResult" class="send-message-result"></div>
        </div>
    </footer>

    <!-- ============================================================= -->
    <!-- OVERLAY CONFIRMATION (suppression)                             -->
    <!-- ============================================================= -->

    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <div class="confirm-icon">🗑️</div>
            <h3>Supprimer la notification</h3>
            <p>Êtes-vous sûr de vouloir supprimer cette notification ?</p>
            <div class="confirm-actions">
                <button class="confirm-btn cancel" id="confirmCancel">Annuler</button>
                <button class="confirm-btn ok danger" id="confirmOk">Supprimer</button>
            </div>
        </div>
    </div>

    <!-- ============================================================= -->
    <!-- SCRIPTS                                                        -->
    <!-- ============================================================= -->

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script src="/client/js/notification.js"></script>

</body>
</html>
