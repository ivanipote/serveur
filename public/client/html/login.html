<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Client | Nature+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/client/css/login.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <button onclick="window.location.href='/'"><i class="fas fa-arrow-left"></i></button>
        <div class="header-email-container">
            <input type="email" id="emailInput" class="header-email" placeholder="Email" autocomplete="email" />
            <button type="button" id="editEmailBtn" class="edit-email-btn" style="display:none;">
                <i class="fas fa-pencil-alt"></i>
            </button>
            <span id="emailStatus" class="email-status"></span>
        </div>
    </header>

    <!-- ZONE FLOUÉE -->
    <div id="blurArea" class="blur-area">

        <!-- TEXTE -->
        <div class="header-title">
            <h1>Entrer votre code secret</h1>
        </div>

        <!-- CHAMP CODE -->
        <div class="input-container">
            <div class="input-wrapper">
                <input type="password" id="codeInput" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="_ _ _ _" readonly />
                <button type="button" id="clearBtn" class="clear-btn">
                    <i class="fas fa-times-circle"></i>
                </button>
                <button type="button" id="togglePassword" class="toggle-btn">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <!-- PAVÉ NUMÉRIQUE -->
        <div class="pave-container">
            <div class="pave pave-round">
                <button class="num-btn" data-value="1">1</button>
                <button class="num-btn" data-value="2">2</button>
                <button class="num-btn" data-value="3">3</button>
                <button class="num-btn" data-value="4">4</button>
                <button class="num-btn" data-value="5">5</button>
                <button class="num-btn" data-value="6">6</button>
                <button class="num-btn" data-value="7">7</button>
                <button class="num-btn" data-value="8">8</button>
                <button class="num-btn" data-value="9">9</button>
                <button class="num-btn btn-zero" data-value="0">0</button>
            </div>
        </div>

        <p class="register-link">
            Pas encore inscrit ? <a href="/client/html/register.html">Créer un compte</a>
        </p>

    </div>

    <script src="/client/js/login.js"></script>
</body>
</html>
