<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>💬 Discussion | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* =============================================================
           STYLES COMPLETS (intégrés)
           ============================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
        }

        /* ===== HEADER ===== */
        .discussion-header {
            background: #17A464;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 2px 10px rgba(23, 164, 100, 0.2);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .discussion-header .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .discussion-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.05);
        }

        .discussion-header .header-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .discussion-header .header-info .shop-name {
            font-size: 16px;
            font-weight: 700;
        }

        .discussion-header .header-info .user-name {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
        }

        .discussion-header .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            flex-shrink: 0;
        }

        /* ===== MAIN ===== */
        .discussion-main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .discussion-main::-webkit-scrollbar {
            width: 4px;
        }
        .discussion-main::-webkit-scrollbar-thumb {
            background: #d0d0da;
            border-radius: 10px;
        }

        /* ===== DATE SEPARATOR ===== */
        .date-separator {
            text-align: center;
            font-size: 11px;
            color: #9CA3AF;
            padding: 8px 0;
            position: relative;
        }

        .date-separator span {
            background: #f0f2f5;
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-block;
        }

        /* ===== MESSAGES ===== */
        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            align-self: flex-end;
            background: #17A464;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: white;
            color: #1a1a2e;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .message .msg-time {
            font-size: 10px;
            opacity: 0.7;
            display: block;
            margin-top: 4px;
            text-align: right;
        }

        .message.sent .msg-time {
            color: rgba(255, 255, 255, 0.8);
        }

        .message.received .msg-time {
            color: #9CA3AF;
        }

        .message .msg-sender {
            font-size: 11px;
            font-weight: 600;
            display: block;
            margin-bottom: 2px;
        }

        .message.sent .msg-sender {
            color: rgba(255, 255, 255, 0.85);
        }

        .message.received .msg-sender {
            color: #17A464;
        }

        /* ===== LOADING / EMPTY ===== */
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .loading-state i {
            font-size: 28px;
            margin-bottom: 8px;
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 48px;
            color: #ddd;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== FOOTER ===== */
        .discussion-footer {
            background: white;
            padding: 10px 16px 14px 16px;
            border-top: 1px solid #f0f2f5;
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .discussion-footer .message-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e8ecf4;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .discussion-footer .message-input:focus {
            border-color: #17A464;
        }

        .discussion-footer .btn-send {
            background: #17A464;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .discussion-footer .btn-send:hover {
            background: #0E7A49;
            transform: scale(1.04);
        }

        .discussion-footer .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ========================================== */
        /* RESPONSIVE */
        /* ========================================== */

        @media (max-width: 768px) {
            .discussion-header {
                padding: 10px 14px;
                gap: 10px;
                border-radius: 0 0 16px 16px;
            }
            .discussion-header .back-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .discussion-header .header-info .shop-name {
                font-size: 14px;
            }
            .discussion-header .header-info .user-name {
                font-size: 11px;
            }
            .discussion-main {
                padding: 12px;
                gap: 6px;
            }
            .message {
                max-width: 85%;
                font-size: 13px;
                padding: 8px 14px;
            }
            .discussion-footer {
                padding: 8px 12px 12px 12px;
                gap: 6px;
            }
            .discussion-footer .message-input {
                font-size: 13px;
                padding: 8px 14px;
            }
            .discussion-footer .btn-send {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .discussion-header {
                padding: 8px 10px;
                gap: 8px;
                border-radius: 0 0 14px 14px;
            }
            .discussion-header .back-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .discussion-header .header-info .shop-name {
                font-size: 13px;
            }
            .discussion-header .header-info .user-name {
                font-size: 10px;
            }
            .discussion-main {
                padding: 8px;
                gap: 4px;
            }
            .message {
                max-width: 90%;
                font-size: 12px;
                padding: 6px 12px;
                border-radius: 12px;
            }
            .message .msg-time {
                font-size: 9px;
            }
            .discussion-footer {
                padding: 6px 8px 10px 8px;
                gap: 4px;
            }
            .discussion-footer .message-input {
                font-size: 12px;
                padding: 6px 12px;
            }
            .discussion-footer .btn-send {
                width: 34px;
                height: 34px;
                font-size: 13px;
            }
            .date-separator {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="discussion-header">
        <button class="back-btn" onclick="window.location.href='/dashboard'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="header-info">
            <span class="shop-name">🌿 ComPlus</span>
            <span class="user-name">👤 Support Nature+</span>
        </div>
        <span class="status-dot"></span>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="discussion-main" id="discussionMain">
        <!-- Le contenu sera injecté par JS -->
        <div class="loading-state">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Chargement des messages...</p>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="discussion-footer">
        <input type="text" class="message-input" id="messageInput" placeholder="Écrire un message..." />
        <button class="btn-send" id="sendBtn">
            <i class="fas fa-paper-plane"></i>
        </button>
    </footer>

    <!-- ============================================================= -->
    <!-- SCRIPTS                                                        -->
    <!-- ============================================================= -->
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ Discussion (optimisée) chargée');

            // ==========================================
            // RÉFÉRENCES
            // ==========================================

            const main = document.getElementById('discussionMain');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');

            let userId = null;
            let messages = [];
            let isSyncing = false;
            let socket = null;
            let isSocketConnected = false;
            let lastLoadedDate = ''; // pour éviter les duplicatas

            // ==========================================
            // VÉRIFICATION CONNEXION
            // ==========================================

            async function checkAuth() {
                try {
                    const res = await fetch('/api/client/me');
                    const data = await res.json();
                    if (data.success) {
                        userId = data.user.id;
                        localStorage.setItem('userId', data.user.id);
                        console.log('👤 Utilisateur connecté:', data.user);
                        return true;
                    } else {
                        window.location.href = '/login';
                        return false;
                    }
                } catch (error) {
                    console.error('❌ Erreur vérification auth:', error);
                    window.location.href = '/login';
                    return false;
                }
            }

            // ==========================================
            // CHARGER LES MESSAGES (initial)
            // ==========================================

            async function loadMessages(initial = true) {
                if (isSyncing) return;
                isSyncing = true;

                try {
                    const res = await fetch('/api/notifications');
                    const data = await res.json();

                    if (res.ok && data.notifications) {
                        // Filtrer : on garde admin et client_message
                        const filtered = data.notifications.filter(n =>
                            n.type === 'admin' || n.type === 'client_message'
                        );

                        if (initial) {
                            // Premier chargement : on remplace tout
                            messages = filtered.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                            renderMessages();
                        } else {
                            // Mise à jour : on ajoute les nouveaux messages
                            const existingIds = new Set(messages.map(m => m.id));
                            const newMessages = filtered.filter(m => !existingIds.has(m.id));

                            if (newMessages.length > 0) {
                                // Ajouter les nouveaux messages dans l'ordre
                                newMessages.forEach(msg => {
                                    messages.push(msg);
                                });
                                // Re-trier
                                messages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                                // Ajouter uniquement les nouveaux messages à l'affichage
                                newMessages.forEach(msg => {
                                    addMessageToView(msg);
                                });
                                // Mettre à jour le séparateur de date si nécessaire
                                updateDateSeparators();
                                // Scroller en bas
                                main.scrollTop = main.scrollHeight;
                            }
                        }
                    } else {
                        if (initial) {
                            messages = [];
                            renderEmpty('Aucun message');
                        }
                    }
                } catch (error) {
                    console.error('❌ Erreur chargement:', error);
                    if (initial) {
                        renderEmpty('Erreur de chargement');
                    }
                } finally {
                    isSyncing = false;
                }
            }

            // ==========================================
            // AFFICHER LES MESSAGES (initial)
            // ==========================================

            function renderMessages() {
                if (messages.length === 0) {
                    renderEmpty('Aucun message pour le moment');
                    return;
                }

                let html = '';
                let currentDate = '';

                messages.forEach((msg) => {
                    const date = new Date(msg.created_at);
                    const dateStr = date.toLocaleDateString('fr-FR');

                    if (dateStr !== currentDate) {
                        currentDate = dateStr;
                        html += `<div class="date-separator"><span>${currentDate}</span></div>`;
                    }

                    html += buildMessageHtml(msg);
                });

                main.innerHTML = html;
                main.scrollTop = main.scrollHeight;
            }

            // ==========================================
            // CONSTRUIRE UN MESSAGE HTML
            // ==========================================

            function buildMessageHtml(msg) {
                const date = new Date(msg.created_at);
                const time = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                const isSentByUser = msg.type === 'client_message';
                const sender = isSentByUser ? '👤 Vous' : '🛒 Support';

                return `
                    <div class="message ${isSentByUser ? 'sent' : 'received'}">
                        <span class="msg-sender">${sender}</span>
                        ${msg.content || msg.title || ''}
                        <span class="msg-time">${time}</span>
                    </div>
                `;
            }

            // ==========================================
            // AJOUTER UN SEUL MESSAGE À LA VUE
            // ==========================================

            function addMessageToView(msg) {
                // Vérifier si le message existe déjà dans le DOM
                const existing = main.querySelector(`[data-msg-id="${msg.id}"]`);
                if (existing) return;

                // Créer un conteneur pour le message
                const div = document.createElement('div');
                div.setAttribute('data-msg-id', msg.id);
                div.innerHTML = buildMessageHtml(msg);

                // Trouver où insérer (en gardant l'ordre chronologique)
                // On cherche le dernier message avec une date inférieure ou égale
                const msgDate = new Date(msg.created_at);
                let inserted = false;

                const children = main.children;
                for (let i = children.length - 1; i >= 0; i--) {
                    const child = children[i];
                    if (child.classList.contains('message')) {
                        const childId = child.dataset.msgId;
                        if (childId) {
                            const childMsg = messages.find(m => m.id == childId);
                            if (childMsg && new Date(childMsg.created_at) <= msgDate) {
                                // Insérer après ce message
                                child.after(div);
                                inserted = true;
                                break;
                            }
                        }
                    }
                }

                if (!inserted) {
                    // Si aucun message trouvé, insérer en bas (juste avant le dernier séparateur ou en fin)
                    const lastChild = children[children.length - 1];
                    if (lastChild) {
                        lastChild.before(div);
                    } else {
                        main.appendChild(div);
                    }
                }

                // Mettre à jour les séparateurs de date
                updateDateSeparators();
            }

            // ==========================================
            // METTRE À JOUR LES SÉPARATEURS DE DATE
            // ==========================================

            function updateDateSeparators() {
                // Supprimer tous les séparateurs existants
                const separators = main.querySelectorAll('.date-separator');
                separators.forEach(el => el.remove());

                // Reconstruire les séparateurs en fonction des messages
                let currentDate = '';
                const messageElements = main.querySelectorAll('.message');
                messageElements.forEach(el => {
                    const id = el.dataset.msgId;
                    if (id) {
                        const msg = messages.find(m => m.id == id);
                        if (msg) {
                            const date = new Date(msg.created_at);
                            const dateStr = date.toLocaleDateString('fr-FR');
                            if (dateStr !== currentDate) {
                                currentDate = dateStr;
                                const sep = document.createElement('div');
                                sep.className = 'date-separator';
                                sep.innerHTML = `<span>${currentDate}</span>`;
                                el.before(sep);
                            }
                        }
                    }
                });
            }

            // ==========================================
            // AFFICHER VIDE
            // ==========================================

            function renderEmpty(message) {
                main.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>${message}</p>
                    </div>
                `;
            }

            // ==========================================
            // ENVOYER UN MESSAGE
            // ==========================================

            async function sendMessage() {
                const text = messageInput.value.trim();
                if (!text || !userId) return;

                sendBtn.disabled = true;
                sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

                try {
                    const res = await fetch('/api/client/message/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: text })
                    });

                    const data = await res.json();

                    if (res.ok && data.success) {
                        // Ajouter le message localement (optimiste)
                        const now = new Date();
                        const msgObj = {
                            id: data.notification_id || Date.now(),
                            type: 'client_message',
                            content: text,
                            created_at: now.toISOString(),
                            is_read: true
                        };
                        // Vérifier si le message n'existe pas déjà
                        const exists = messages.some(m => m.id === msgObj.id);
                        if (!exists) {
                            messages.push(msgObj);
                            addMessageToView(msgObj);
                            main.scrollTop = main.scrollHeight;
                        }

                        messageInput.value = '';
                        messageInput.focus();
                    } else {
                        alert('❌ ' + (data.error || 'Erreur d\'envoi'));
                    }
                } catch (error) {
                    console.error('❌ Erreur envoi:', error);
                    alert('❌ Erreur de connexion');
                } finally {
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                }
            }

            // ==========================================
            // SOCKET.IO - ÉCOUTER LES NOUVEAUX MESSAGES
            // ==========================================

            function connectSocketIO() {
                if (socket) {
                    socket.disconnect();
                    socket = null;
                }

                try {
                    const userIdLocal = localStorage.getItem('userId') || '1';

                    socket = io({
                        auth: {
                            userId: parseInt(userIdLocal),
                            isAdmin: false
                        }
                    });

                    socket.on('connect', function() {
                        console.log('✅ Socket.IO discussion connecté');
                        isSocketConnected = true;
                    });

                    socket.on('disconnect', function() {
                        console.log('❌ Socket.IO discussion déconnecté');
                        isSocketConnected = false;
                        setTimeout(() => {
                            if (!isSocketConnected) {
                                connectSocketIO();
                            }
                        }, 3000);
                    });

                    socket.on('notification', function(data) {
                        console.log('🔔 Nouvelle notification (discussion):', data);
                        // Vérifier si c'est un message (admin ou client_message)
                        if (data.type === 'admin' || data.type === 'client_message') {
                            // Ajouter uniquement le nouveau message sans recharger tout
                            const exists = messages.some(m => m.id === data.id);
                            if (!exists) {
                                // Ajouter l'objet au tableau
                                const msgObj = {
                                    id: data.id,
                                    type: data.type,
                                    content: data.content || data.title || '',
                                    created_at: data.created_at || new Date().toISOString(),
                                    is_read: data.is_read || false
                                };
                                messages.push(msgObj);
                                // Trier par date
                                messages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                                // Ajouter à la vue
                                addMessageToView(msgObj);
                                // Scroller en bas
                                main.scrollTop = main.scrollHeight;
                            }
                        } else {
                            // Autre type de notification : on recharge silencieusement
                            loadMessages(false);
                        }
                    });

                } catch (error) {
                    console.error('❌ Erreur Socket.IO:', error);
                    setTimeout(() => connectSocketIO(), 5000);
                }
            }

            // ==========================================
            // ÉVÉNEMENTS
            // ==========================================

            sendBtn.addEventListener('click', sendMessage);

            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // ==========================================
            // INITIALISATION
            // ==========================================

            (async function init() {
                try {
                    const isAuth = await checkAuth();
                    if (!isAuth) return;

                    await loadMessages(true);
                    connectSocketIO();

                    // Sync en arrière-plan toutes les 15s (pour récupérer les messages manquants)
                    setInterval(() => {
                        if (!isSyncing) {
                            loadMessages(false);
                        }
                    }, 15000);

                    console.log('✅ Discussion réelle optimisée initialisée');
                } catch (error) {
                    console.error('❌ Erreur initialisation:', error);
                }
            })();

        });
    </script>

</body>
</html>
