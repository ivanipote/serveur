<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔄 Mises à jour | Nature+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* =============================================================
           UPDATES - STYLES
           ============================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            outline: none !important;
        }

        :root {
            --bg-app: #F5F6F9;
            --surface: #FFFFFF;
            --surface-alt: #FAFBFC;
            --border: #E6E8EF;
            --border-strong: #D8DBE4;
            --ink-900: #10141F;
            --ink-700: #3A4152;
            --ink-500: #6B7280;
            --ink-400: #9CA3AF;
            --sidebar-1: #0A0E1A;
            --sidebar-line: rgba(255,255,255,0.07);
            --sidebar-text: rgba(226,230,242,0.62);
            --sidebar-text-hi: #F3F5FA;
            --brand: #17A464;
            --brand-dark: #0E7A49;
            --brand-tint: #E6F7EE;
            --brand-line: #BFEBD3;
            --blue: #2563EB;
            --blue-tint: #EAF1FF;
            --amber: #B45309;
            --amber-tint: #FFF3DF;
            --red: #C0342A;
            --red-tint: #FCEBEA;
            --green: #17A464;
            --green-tint: #E6F7EE;
            --violet: #7C3AED;
            --violet-tint: #F1EBFE;
            --slate: #475467;
            --slate-tint: #EEF1F5;
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg-app);
            color: var(--ink-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* =============================================================
           ADMIN HEADER
           ============================================================= */

        .admin-header {
            background: var(--sidebar-1);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid var(--sidebar-line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-header .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-header .header-left .logo {
            color: var(--sidebar-text-hi);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .admin-header .header-left .logo span {
            color: #34D399;
        }

        .admin-header .header-center {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .admin-header .header-center .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            color: var(--sidebar-text);
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
        }

        .admin-header .header-center .header-badge:hover {
            background: rgba(255,255,255,0.1);
            color: var(--sidebar-text-hi);
        }

        .admin-header .header-center .header-badge.active {
            background: rgba(23,164,100,0.15);
            color: var(--sidebar-text-hi);
            border-color: rgba(23,164,100,0.25);
        }

        .admin-header .header-center .header-badge i {
            font-size: 14px;
        }

        .admin-header .header-center .header-badge .badge-dot {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--red);
            color: white;
            margin-left: 2px;
        }

        .admin-header .header-center .header-badge .badge-dot.zero {
            background: rgba(255,255,255,0.1);
            color: var(--sidebar-text);
        }

        .admin-header .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-header .header-right .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            color: var(--sidebar-text);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--sidebar-line);
        }

        .admin-header .header-right .btn-back:hover {
            background: rgba(255,255,255,0.1);
            color: var(--sidebar-text-hi);
        }

        .admin-header .header-right .btn-back i {
            font-size: 14px;
        }

        .admin-header .header-right .admin-name {
            color: var(--sidebar-text);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
        }

        /* =============================================================
           PAGE CONTENT
           ============================================================= */

        .page-container {
            padding: 24px 30px 40px 30px;
            max-width: 1200px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-header .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--ink-900);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header .page-title i {
            color: var(--ink-400);
            font-size: 22px;
        }

        .page-header .btn-refresh {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .page-header .btn-refresh:hover {
            background: var(--brand-dark);
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(23,164,100,0.25);
        }

        .page-header .btn-refresh:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .page-header .btn-refresh i.fa-spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* =============================================================
           STATS CARD
           ============================================================= */

        .stats-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(16,20,31,0.05);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .stats-card .stats-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink-900);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-card .stats-title i {
            color: var(--brand);
        }

        .stats-card .stats-content {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .stats-card .stats-content .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink-700);
        }

        .stats-card .stats-content .stat-item .stat-value {
            font-family: var(--font-mono);
            font-size: 16px;
            font-weight: 700;
            color: var(--brand-dark);
        }

        .stats-card .stats-content .stat-item .stat-value.latest {
            color: var(--blue);
            font-size: 13px;
        }

        .stats-card .stats-content .stat-item .stat-value.failed {
            color: var(--red);
        }

        .stats-card .stats-content .stat-item .stat-icon {
            font-size: 16px;
        }

        /* =============================================================
           DEPLOY LIST
           ============================================================= */

        .deploy-list {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(16,20,31,0.05);
        }

        .deploy-list .list-header {
            padding: 14px 20px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .deploy-list .list-header .list-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink-700);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .deploy-list .list-header .list-title i {
            color: var(--brand);
        }

        .deploy-list .list-header .list-count {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-500);
        }

        /* =============================================================
           TABLEAU
           ============================================================= */

        .table-wrapper {
            overflow-x: auto;
            padding: 0;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 700px;
        }

        .table-wrapper th {
            background: var(--surface-alt);
            padding: 10px 16px;
            text-align: left;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--ink-500);
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .table-wrapper td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--surface-alt);
            color: var(--ink-700);
            vertical-align: middle;
        }

        .table-wrapper tr:last-child td {
            border-bottom: none;
        }

        .table-wrapper tr:hover td {
            background: var(--surface-alt);
        }

        /* ===== STATUS BADGES ===== */
        .status-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .status-badge.success {
            background: var(--green-tint);
            color: var(--brand-dark);
            border-color: var(--brand-line);
        }

        .status-badge.failed {
            background: var(--red-tint);
            color: var(--red);
            border-color: #F3C6C2;
        }

        .status-badge.pending {
            background: var(--amber-tint);
            color: var(--amber);
            border-color: #F5DBAA;
        }

        .status-badge.in_progress {
            background: var(--blue-tint);
            color: var(--blue);
            border-color: #C7D9FB;
        }

        .status-badge.canceled {
            background: var(--slate-tint);
            color: var(--slate);
            border-color: #D8DBE4;
        }

        /* ===== SHA BADGE ===== */
        .sha-badge {
            font-family: var(--font-mono);
            font-size: 12px;
            background: var(--surface-alt);
            padding: 2px 10px;
            border-radius: 12px;
            color: var(--ink-500);
            border: 1px solid var(--border);
            display: inline-block;
        }

        /* ===== TRIGGER BADGE ===== */
        .trigger-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        .trigger-badge.auto {
            background: var(--blue-tint);
            color: var(--blue);
        }

        .trigger-badge.manual {
            background: var(--amber-tint);
            color: var(--amber);
        }

        .trigger-badge.deploy_hook {
            background: var(--violet-tint);
            color: var(--violet);
        }

        .trigger-badge.api {
            background: var(--green-tint);
            color: var(--brand-dark);
        }

        /* =============================================================
           EMPTY
           ============================================================= */

        .empty-msg {
            text-align: center;
            padding: 40px 20px;
            color: var(--ink-400);
            font-size: 14px;
        }

        .empty-msg i {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            color: var(--border-strong);
        }

        /* =============================================================
           TOAST
           ============================================================= */

        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            padding: 13px 22px;
            border-radius: 11px;
            color: white;
            font-weight: 600;
            font-size: 13.5px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            pointer-events: auto;
            max-width: 400px;
            animation: slideInRight 0.25s ease;
        }

        .toast.success { background: var(--brand-dark); }
        .toast.error { background: var(--red); }
        .toast.info { background: var(--ink-900); }
        .toast.warning { background: var(--amber); }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(16px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* =============================================================
           RESPONSIVE
           ============================================================= */

        @media (max-width: 768px) {
            .admin-header {
                padding: 8px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .admin-header .header-left {
                justify-content: center;
            }
            .admin-header .header-center {
                justify-content: center;
                gap: 4px;
            }
            .admin-header .header-center .header-badge {
                font-size: 12px;
                padding: 4px 10px;
            }
            .admin-header .header-center .header-badge .badge-dot {
                font-size: 9px;
                min-width: 16px;
                height: 16px;
            }
            .admin-header .header-right {
                justify-content: center;
            }

            .page-container {
                padding: 16px;
            }

            .page-header .page-title {
                font-size: 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .page-header .btn-refresh {
                width: 100%;
                justify-content: center;
            }

            .stats-card {
                padding: 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .stats-card .stats-content {
                gap: 12px;
            }

            .stats-card .stats-content .stat-item {
                font-size: 13px;
            }

            .stats-card .stats-content .stat-item .stat-value {
                font-size: 14px;
            }

            .table-wrapper table {
                min-width: 500px;
                font-size: 12px;
            }

            .table-wrapper th,
            .table-wrapper td {
                padding: 8px 12px;
            }
        }

        @media (max-width: 480px) {
            .admin-header {
                padding: 6px 10px;
                gap: 6px;
            }
            .admin-header .header-left .logo {
                font-size: 15px;
            }
            .admin-header .header-center .header-badge {
                font-size: 10px;
                padding: 3px 8px;
                gap: 4px;
            }
            .admin-header .header-center .header-badge i {
                font-size: 11px;
            }
            .admin-header .header-center .header-badge .badge-dot {
                font-size: 8px;
                min-width: 14px;
                height: 14px;
                padding: 0 4px;
            }
            .admin-header .header-right .btn-back {
                font-size: 11px;
                padding: 4px 10px;
            }

            .page-container {
                padding: 10px;
            }

            .page-header .page-title {
                font-size: 17px;
            }

            .stats-card {
                padding: 12px;
            }

            .stats-card .stats-content .stat-item {
                font-size: 12px;
            }

            .stats-card .stats-content .stat-item .stat-value {
                font-size: 13px;
            }

            .table-wrapper table {
                min-width: 400px;
                font-size: 11px;
            }

            .table-wrapper th,
            .table-wrapper td {
                padding: 6px 8px;
            }

            .sha-badge {
                font-size: 10px;
                padding: 1px 6px;
            }

            .status-badge {
                font-size: 10px;
                padding: 2px 8px;
            }

            .trigger-badge {
                font-size: 10px;
                padding: 1px 8px;
            }

            .toast-container {
                bottom: 16px;
                right: 16px;
                left: 16px;
            }

            .toast {
                max-width: 100%;
                font-size: 13px;
                padding: 12px 16px;
            }
        }

        /* ========================================== */
        /* SUPPRIMER L'EFFET BLEU DE SURVOL / CLIC    */
        /* ========================================== */

        * {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        button, a, .btn, .clickable {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        input, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
        }
    </style>
</head>
<body>

    <!-- ============================================================= -->
    <!-- HEADER COMMUN                                                  -->
    <!-- ============================================================= -->
    <header class="admin-header">
        <div class="header-left">
            <span class="logo">🌿 Nature<span>+</span></span>
        </div>
        <div class="header-center">
            <a href="/admin/comm.html" class="header-badge">
                <i class="fas fa-truck"></i> Commandes
                <span class="badge-dot" id="headerBadgeCommandes">0</span>
            </a>
            <a href="/admin/wave.html" class="header-badge">
                <i class="fas fa-water"></i> Wave
                <span class="badge-dot" id="headerBadgeWave">0</span>
            </a>
            <a href="/admin/paiements.html" class="header-badge">
                <i class="fas fa-credit-card"></i> Paiements
                <span class="badge-dot" id="headerBadgePayments">0</span>
            </a>
        </div>
        <div class="header-right">
            <span class="admin-name" id="adminName">Admin</span>
            <a href="/admin/dashboard" class="btn-back" title="Retour au Dashboard">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
        </div>
    </header>

    <!-- ============================================================= -->
    <!-- CONTENU DE LA PAGE                                             -->
    <!-- ============================================================= -->
    <div class="page-container">

        <div class="page-header">
            <div class="page-title">
                <i class="fas fa-rocket"></i> Déploiements
            </div>
            <button class="btn-refresh" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> Rafraîchir
            </button>
        </div>

        <!-- ===== STATS ===== -->
        <div class="stats-card" id="statsCard">
            <div class="stats-title">
                <i class="fas fa-chart-bar"></i> Statistiques
            </div>
            <div class="stats-content">
                <div class="stat-item">
                    <span class="stat-icon">📦</span>
                    <span>Total :</span>
                    <span class="stat-value" id="statTotal">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">✅</span>
                    <span>Succès :</span>
                    <span class="stat-value" id="statSuccess">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">❌</span>
                    <span>Échecs :</span>
                    <span class="stat-value" id="statFailed">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">🕐</span>
                    <span>Dernier déploiement :</span>
                    <span class="stat-value latest" id="statLatest">-</span>
                </div>
            </div>
        </div>

        <!-- ===== TABLEAU DES DÉPLOIEMENTS ===== -->
        <div class="deploy-list" id="deployList">
            <div class="list-header">
                <span class="list-title">
                    <i class="fas fa-history"></i> Historique des déploiements
                </span>
                <span class="list-count" id="listCount">0 déploiements</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Statut</th>
                            <th>SHA</th>
                            <th>Message</th>
                            <th>Durée</th>
                            <th>Déclencheur</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="deployBody">
                        <tr>
                            <td colspan="6" class="empty-msg">
                                <i class="fas fa-spinner fa-spin"></i>
                                <p>Chargement des déploiements...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ============================================================= -->
    <!-- SCRIPTS                                                        -->
    <!-- ============================================================= -->
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ updates.js chargé');

            // ==========================================
            // RÉFÉRENCES
            // ==========================================

            const deployBody = document.getElementById('deployBody');
            const listCount = document.getElementById('listCount');
            const statTotal = document.getElementById('statTotal');
            const statSuccess = document.getElementById('statSuccess');
            const statFailed = document.getElementById('statFailed');
            const statLatest = document.getElementById('statLatest');
            const refreshBtn = document.getElementById('refreshBtn');

            let isRefreshing = false;

            // ==========================================
            // NOM ADMIN
            // ==========================================

            const adminName = localStorage.getItem('adminName') || 'Admin';
            document.getElementById('adminName').textContent = adminName;

            // ==========================================
            // TOAST
            // ==========================================

            function showToast(message, type = 'info') {
                const colors = {
                    success: '#0E7A49',
                    error: '#C0342A',
                    info: '#10141F',
                    warning: '#B45309'
                };

                let container = document.querySelector('.toast-container');
                if (!container) {
                    container = document.createElement('div');
                    container.className = 'toast-container';
                    document.body.appendChild(container);
                }

                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.textContent = message;
                toast.style.cssText = `
                    background: ${colors[type] || '#10141F'};
                    color: white;
                    padding: 13px 22px;
                    border-radius: 11px;
                    font-weight: 600;
                    font-size: 13.5px;
                    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                    animation: slideInRight 0.25s ease;
                    max-width: 400px;
                    pointer-events: auto;
                `;

                container.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(16px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            }

            // ==========================================
            // CHARGER LES DÉPLOIEMENTS
            // ==========================================

            async function loadDeploys() {
                try {
                    const res = await fetch('/api/admin/deploys');
                    const data = await res.json();

                    if (res.ok && data.success) {
                        renderDeploys(data.deploys || []);
                    } else {
                        renderEmpty(data.error || 'Erreur de chargement');
                    }
                } catch (error) {
                    console.error('Erreur chargement déploiements:', error);
                    renderEmpty('Erreur de connexion');
                }
            }

            // ==========================================
            // AFFICHER LES DÉPLOIEMENTS
            // ==========================================

            function renderDeploys(deploys) {
                if (!deploys || deploys.length === 0) {
                    renderEmpty('Aucun déploiement trouvé.');
                    return;
                }

                // Calculer les stats
                const total = deploys.length;
                const successCount = deploys.filter(d => d.status === 'success' || d.status === 'live').length;
                const failedCount = deploys.filter(d => d.status === 'failed' || d.status === 'build_failed').length;

                listCount.textContent = total + ' déploiement' + (total > 1 ? 's' : '');
                statTotal.textContent = total;
                statSuccess.textContent = successCount;
                statFailed.textContent = failedCount;

                // Dernier déploiement
                if (deploys.length > 0) {
                    const latest = deploys[0];
                    const date = new Date(latest.created_at);
                    statLatest.textContent = date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                }

                // Afficher le tableau
                let html = '';
                deploys.forEach(d => {
                    const statusLabels = {
                        'success': { label: '✅ Succès', class: 'success' },
                        'live': { label: '✅ Live', class: 'success' },
                        'failed': { label: '❌ Échec', class: 'failed' },
                        'build_failed': { label: '❌ Build échoué', class: 'failed' },
                        'pending': { label: '⏳ En attente', class: 'pending' },
                        'in_progress': { label: '🔨 En cours', class: 'in_progress' },
                        'canceled': { label: '⏹️ Annulé', class: 'canceled' }
                    };
                    const statusInfo = statusLabels[d.status] || { label: d.status, class: 'pending' };

                    const triggerLabels = {
                        'auto': { label: 'Auto', class: 'auto' },
                        'manual': { label: 'Manuel', class: 'manual' },
                        'deploy_hook': { label: 'Hook', class: 'deploy_hook' },
                        'api': { label: 'API', class: 'api' }
                    };
                    const triggerInfo = triggerLabels[d.trigger] || { label: d.trigger || 'Manual', class: 'manual' };

                    const date = new Date(d.created_at);
                    const dateStr = date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

                    html += `
                        <tr>
                            <td><span class="status-badge ${statusInfo.class}">${statusInfo.label}</span></td>
                            <td><span class="sha-badge">${d.sha}</span></td>
                            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${d.message}</td>
                            <td>${d.duration}</td>
                            <td><span class="trigger-badge ${triggerInfo.class}">${triggerInfo.label}</span></td>
                            <td style="font-size:12px;color:var(--ink-400);">${dateStr}</td>
                        </tr>
                    `;
                });

                deployBody.innerHTML = html;
            }

            // ==========================================
            // AFFICHER VIDE
            // ==========================================

            function renderEmpty(message) {
                deployBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-msg">
                            <i class="fas fa-inbox"></i>
                            <p>${message}</p>
                        </td>
                    </tr>
                `;
                listCount.textContent = '0 déploiement';
                statTotal.textContent = '0';
                statSuccess.textContent = '0';
                statFailed.textContent = '0';
                statLatest.textContent = '-';
            }

            // ==========================================
            // RAFRAÎCHIR
            // ==========================================

            async function refreshDeploys() {
                if (isRefreshing) return;
                isRefreshing = true;
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Chargement...';

                try {
                    await loadDeploys();
                    showToast('✅ Déploiements actualisés', 'success');
                } catch (error) {
                    showToast('❌ Erreur lors du rafraîchissement', 'error');
                }

                isRefreshing = false;
                refreshBtn.disabled = false;
                refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Rafraîchir';
            }

            // ==========================================
            // SOCKET.IO - BADGES
            // ==========================================

            let socket = null;

            function connectSocketIO() {
                if (socket) {
                    socket.disconnect();
                    socket = null;
                }

                try {
                    const adminId = localStorage.getItem('adminId') || '1';

                    socket = io({
                        auth: {
                            userId: parseInt(adminId),
                            isAdmin: true
                        },
                        transports: ['websocket', 'polling'],
                        timeout: 5000,
                        reconnection: true,
                        reconnectionAttempts: 20,
                        reconnectionDelay: 500
                    });

                    socket.on('connect', function() {
                        console.log('✅ Socket.IO admin (updates) connecté');
                    });

                    socket.on('disconnect', function() {
                        console.log('❌ Socket.IO admin (updates) déconnecté');
                        setTimeout(() => {
                            if (!socket?.connected) connectSocketIO();
                        }, 3000);
                    });

                } catch (error) {
                    console.error('❌ Erreur connexion Socket.IO:', error);
                    setTimeout(() => connectSocketIO(), 5000);
                }
            }

            // ==========================================
            // ÉVÉNEMENTS
            // ==========================================

            refreshBtn.addEventListener('click', refreshDeploys);

            // ==========================================
            // INITIALISATION
            // ==========================================

            // Charger les badges (admin-common)
            if (typeof updateBadges === 'function') {
                updateBadges();
            }

            loadDeploys();
            connectSocketIO();

            // Rafraîchir toutes les 60 secondes
            setInterval(() => {
                loadDeploys();
            }, 60000);

            console.log('✅ updates.html initialisé');

        });
    </script>

</body>
</html>
