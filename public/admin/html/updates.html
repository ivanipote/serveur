<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔄 Mises à jour | Nature+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* =============================================================
           UPDATES - STYLES
           ============================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            outline: none !important;
        }

        :root {
            --bg-app: #F5F6F9;
            --surface: #FFFFFF;
            --surface-alt: #FAFBFC;
            --border: #E6E8EF;
            --border-strong: #D8DBE4;
            --ink-900: #10141F;
            --ink-700: #3A4152;
            --ink-500: #6B7280;
            --ink-400: #9CA3AF;
            --sidebar-1: #0A0E1A;
            --sidebar-line: rgba(255,255,255,0.07);
            --sidebar-text: rgba(226,230,242,0.62);
            --sidebar-text-hi: #F3F5FA;
            --brand: #17A464;
            --brand-dark: #0E7A49;
            --brand-tint: #E6F7EE;
            --brand-line: #BFEBD3;
            --blue: #2563EB;
            --blue-tint: #EAF1FF;
            --amber: #B45309;
            --amber-tint: #FFF3DF;
            --red: #C0342A;
            --red-tint: #FCEBEA;
            --green: #17A464;
            --green-tint: #E6F7EE;
            --violet: #7C3AED;
            --violet-tint: #F1EBFE;
            --slate: #475467;
            --slate-tint: #EEF1F5;
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg-app);
            color: var(--ink-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* =============================================================
           ADMIN HEADER
           ============================================================= */

        .admin-header {
            background: var(--sidebar-1);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid var(--sidebar-line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-header .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-header .header-left .logo {
            color: var(--sidebar-text-hi);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .admin-header .header-left .logo span {
            color: #34D399;
        }

        .admin-header .header-center {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .admin-header .header-center .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            color: var(--sidebar-text);
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
        }

        .admin-header .header-center .header-badge:hover {
            background: rgba(255,255,255,0.1);
            color: var(--sidebar-text-hi);
        }

        .admin-header .header-center .header-badge.active {
            background: rgba(23,164,100,0.15);
            color: var(--sidebar-text-hi);
            border-color: rgba(23,164,100,0.25);
        }

        .admin-header .header-center .header-badge i {
            font-size: 14px;
        }

        .admin-header .header-center .header-badge .badge-dot {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--red);
            color: white;
            margin-left: 2px;
        }

        .admin-header .header-center .header-badge .badge-dot.zero {
            background: rgba(255,255,255,0.1);
            color: var(--sidebar-text);
        }

        .admin-header .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-header .header-right .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            color: var(--sidebar-text);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--sidebar-line);
        }

        .admin-header .header-right .btn-back:hover {
            background: rgba(255,255,255,0.1);
            color: var(--sidebar-text-hi);
        }

        .admin-header .header-right .btn-back i {
            font-size: 14px;
        }

        .admin-header .header-right .admin-name {
            color: var(--sidebar-text);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
        }

        /* =============================================================
           PAGE CONTENT
           ============================================================= */

        .page-container {
            padding: 24px 30px 40px 30px;
            max-width: 1000px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-header .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--ink-900);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header .page-title i {
            color: var(--ink-400);
            font-size: 22px;
        }

        .page-header .btn-check-update {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .page-header .btn-check-update:hover {
            background: var(--brand-dark);
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(23,164,100,0.25);
        }

        .page-header .btn-check-update:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .page-header .btn-check-update i.fa-spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* =============================================================
           STATS CARD
           ============================================================= */

        .stats-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(16,20,31,0.05);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .stats-card .stats-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink-900);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-card .stats-title i {
            color: var(--brand);
        }

        .stats-card .stats-content {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .stats-card .stats-content .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink-700);
        }

        .stats-card .stats-content .stat-item .stat-value {
            font-family: var(--font-mono);
            font-size: 16px;
            font-weight: 700;
            color: var(--brand-dark);
        }

        .stats-card .stats-content .stat-item .stat-value.latest {
            color: var(--blue);
            font-size: 13px;
        }

        .stats-card .stats-content .stat-item .stat-icon {
            font-size: 16px;
        }

        /* =============================================================
           COMMIT LIST
           ============================================================= */

        .commit-list {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(16,20,31,0.05);
        }

        .commit-list .list-header {
            padding: 14px 20px;
            background: var(--surface-alt);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .commit-list .list-header .list-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink-700);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .commit-list .list-header .list-title i {
            color: var(--brand);
        }

        .commit-list .list-header .list-count {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-500);
        }

        .commit-list .commit-item {
            padding: 14px 20px;
            border-bottom: 1px solid var(--surface-alt);
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transition: background 0.2s;
        }

        .commit-list .commit-item:last-child {
            border-bottom: none;
        }

        .commit-list .commit-item:hover {
            background: var(--surface-alt);
        }

        .commit-list .commit-item .commit-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--blue-tint);
            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .commit-list .commit-item .commit-icon.new {
            background: var(--brand-tint);
            color: var(--brand-dark);
        }

        .commit-list .commit-item .commit-info {
            flex: 1;
            min-width: 0;
        }

        .commit-list .commit-item .commit-info .commit-message {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-900);
            line-height: 1.4;
        }

        .commit-list .commit-item .commit-info .commit-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
            font-size: 12px;
            color: var(--ink-400);
        }

        .commit-list .commit-item .commit-info .commit-meta .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .commit-list .commit-item .commit-info .commit-meta .meta-item i {
            font-size: 11px;
        }

        .commit-list .commit-item .commit-info .commit-meta .meta-item .sha {
            font-family: var(--font-mono);
            background: var(--surface-alt);
            padding: 1px 8px;
            border-radius: 12px;
            font-size: 11px;
            color: var(--ink-500);
        }

        .commit-list .commit-item .commit-link {
            color: var(--blue);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .commit-list .commit-item .commit-link:hover {
            text-decoration: underline;
        }

        .commit-list .empty-msg {
            text-align: center;
            padding: 40px 20px;
            color: var(--ink-400);
            font-size: 14px;
        }

        .commit-list .empty-msg i {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            color: var(--border-strong);
        }

        /* =============================================================
           TOAST
           ============================================================= */

        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            padding: 13px 22px;
            border-radius: 11px;
            color: white;
            font-weight: 600;
            font-size: 13.5px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            pointer-events: auto;
            max-width: 400px;
            animation: slideInRight 0.25s ease;
        }

        .toast.success { background: var(--brand-dark); }
        .toast.error { background: var(--red); }
        .toast.info { background: var(--ink-900); }
        .toast.warning { background: var(--amber); }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(16px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* =============================================================
           RESPONSIVE
           ============================================================= */

        @media (max-width: 768px) {
            .admin-header {
                padding: 8px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .admin-header .header-left {
                justify-content: center;
            }
            .admin-header .header-center {
                justify-content: center;
                gap: 4px;
            }
            .admin-header .header-center .header-badge {
                font-size: 12px;
                padding: 4px 10px;
            }
            .admin-header .header-center .header-badge .badge-dot {
                font-size: 9px;
                min-width: 16px;
                height: 16px;
            }
            .admin-header .header-right {
                justify-content: center;
            }

            .page-container {
                padding: 16px;
            }

            .page-header .page-title {
                font-size: 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .page-header .btn-check-update {
                width: 100%;
                justify-content: center;
            }

            .stats-card {
                padding: 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .stats-card .stats-content {
                gap: 12px;
            }

            .stats-card .stats-content .stat-item {
                font-size: 13px;
            }

            .stats-card .stats-content .stat-item .stat-value {
                font-size: 14px;
            }

            .commit-list .commit-item {
                flex-wrap: wrap;
                padding: 12px 16px;
            }

            .commit-list .commit-item .commit-link {
                width: 100%;
                margin-left: 50px;
            }
        }

        @media (max-width: 480px) {
            .admin-header {
                padding: 6px 10px;
                gap: 6px;
            }
            .admin-header .header-left .logo {
                font-size: 15px;
            }
            .admin-header .header-center .header-badge {
                font-size: 10px;
                padding: 3px 8px;
                gap: 4px;
            }
            .admin-header .header-center .header-badge i {
                font-size: 11px;
            }
            .admin-header .header-center .header-badge .badge-dot {
                font-size: 8px;
                min-width: 14px;
                height: 14px;
                padding: 0 4px;
            }
            .admin-header .header-right .btn-back {
                font-size: 11px;
                padding: 4px 10px;
            }

            .page-container {
                padding: 10px;
            }

            .page-header .page-title {
                font-size: 17px;
            }

            .stats-card {
                padding: 12px;
            }

            .stats-card .stats-content .stat-item {
                font-size: 12px;
            }

            .stats-card .stats-content .stat-item .stat-value {
                font-size: 13px;
            }

            .commit-list .commit-item {
                padding: 10px 12px;
                gap: 10px;
            }

            .commit-list .commit-item .commit-icon {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }

            .commit-list .commit-item .commit-info .commit-message {
                font-size: 13px;
            }

            .commit-list .commit-item .commit-info .commit-meta {
                font-size: 11px;
                gap: 8px;
            }

            .commit-list .commit-item .commit-link {
                font-size: 12px;
                margin-left: 40px;
            }

            .toast-container {
                bottom: 16px;
                right: 16px;
                left: 16px;
            }

            .toast {
                max-width: 100%;
                font-size: 13px;
                padding: 12px 16px;
            }
        }

        /* ========================================== */
        /* SUPPRIMER L'EFFET BLEU DE SURVOL / CLIC    */
        /* ========================================== */

        * {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        button, a, .btn, .clickable {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        input, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
        }
    </style>
</head>
<body>

    <!-- ============================================================= -->
    <!-- HEADER COMMUN                                                  -->
    <!-- ============================================================= -->
    <header class="admin-header">
        <div class="header-left">
            <span class="logo">🌿 Nature<span>+</span></span>
        </div>
        <div class="header-center">
            <a href="/admin/comm.html" class="header-badge">
                <i class="fas fa-truck"></i> Commandes
                <span class="badge-dot" id="headerBadgeCommandes">0</span>
            </a>
            <a href="/admin/wave.html" class="header-badge">
                <i class="fas fa-water"></i> Wave
                <span class="badge-dot" id="headerBadgeWave">0</span>
            </a>
            <a href="/admin/paiements.html" class="header-badge">
                <i class="fas fa-credit-card"></i> Paiements
                <span class="badge-dot" id="headerBadgePayments">0</span>
            </a>
        </div>
        <div class="header-right">
            <span class="admin-name" id="adminName">Admin</span>
            <a href="/admin/dashboard" class="btn-back" title="Retour au Dashboard">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
        </div>
    </header>

    <!-- ============================================================= -->
    <!-- CONTENU DE LA PAGE                                             -->
    <!-- ============================================================= -->
    <div class="page-container">

        <div class="page-header">
            <div class="page-title">
                <i class="fas fa-sync-alt"></i> Mises à jour
            </div>
            <button class="btn-check-update" id="checkUpdateBtn">
                <i class="fas fa-cloud-download-alt"></i> Vérifier les mises à jour
            </button>
        </div>

        <!-- ===== STATS ===== -->
        <div class="stats-card" id="statsCard">
            <div class="stats-title">
                <i class="fas fa-info-circle"></i> État du système
            </div>
            <div class="stats-content">
                <div class="stat-item">
                    <span class="stat-icon">📦</span>
                    <span>Versions :</span>
                    <span class="stat-value" id="statTotal">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">🕐</span>
                    <span>Dernière mise à jour :</span>
                    <span class="stat-value latest" id="statLatest">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">📌</span>
                    <span>Dernier SHA :</span>
                    <span class="stat-value latest" id="statSha">-</span>
                </div>
            </div>
        </div>

        <!-- ===== LISTE DES COMMITS ===== -->
        <div class="commit-list" id="commitList">
            <div class="list-header">
                <span class="list-title">
                    <i class="fas fa-code-branch"></i> Historique des mises à jour
                </span>
                <span class="list-count" id="listCount">0 commits</span>
            </div>
            <div id="commitItems">
                <div class="empty-msg">
                    <i class="fas fa-inbox"></i>
                    <p>Chargement de l'historique...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- ============================================================= -->
    <!-- SCRIPTS                                                        -->
    <!-- ============================================================= -->
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ updates.js chargé');

            // ==========================================
            // RÉFÉRENCES
            // ==========================================

            const commitItems = document.getElementById('commitItems');
            const listCount = document.getElementById('listCount');
            const statTotal = document.getElementById('statTotal');
            const statLatest = document.getElementById('statLatest');
            const statSha = document.getElementById('statSha');
            const checkBtn = document.getElementById('checkUpdateBtn');

            let updates = [];
            let isChecking = false;

            // ==========================================
            // NOM ADMIN
            // ==========================================

            const adminName = localStorage.getItem('adminName') || 'Admin';
            document.getElementById('adminName').textContent = adminName;

            // ==========================================
            // TOAST
            // ==========================================

            function showToast(message, type = 'info') {
                const colors = {
                    success: '#0E7A49',
                    error: '#C0342A',
                    info: '#10141F',
                    warning: '#B45309'
                };

                let container = document.querySelector('.toast-container');
                if (!container) {
                    container = document.createElement('div');
                    container.className = 'toast-container';
                    document.body.appendChild(container);
                }

                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.textContent = message;
                toast.style.cssText = `
                    background: ${colors[type] || '#10141F'};
                    color: white;
                    padding: 13px 22px;
                    border-radius: 11px;
                    font-weight: 600;
                    font-size: 13.5px;
                    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                    animation: slideInRight 0.25s ease;
                    max-width: 400px;
                    pointer-events: auto;
                `;

                container.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(16px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            }

            // ==========================================
            // CHARGER LES UPDATES
            // ==========================================

            async function loadUpdates() {
                try {
                    const res = await fetch('/api/admin/updates');
                    const data = await res.json();

                    if (res.ok && data.success) {
                        updates = data.updates || [];
                        renderUpdates(updates);
                    } else {
                        updates = [];
                        renderEmpty('Aucune mise à jour enregistrée.');
                    }
                } catch (error) {
                    console.error('Erreur chargement updates:', error);
                    renderEmpty('Erreur de chargement.');
                }
            }

            // ==========================================
            // AFFICHER LES UPDATES
            // ==========================================

            function renderUpdates(updatesData) {
                if (!updatesData || updatesData.length === 0) {
                    renderEmpty('Aucune mise à jour enregistrée.');
                    return;
                }

                // Trier par date (plus récent en premier)
                const sorted = [...updatesData].sort((a, b) => {
                    return new Date(b.created_at) - new Date(a.created_at);
                });

                listCount.textContent = sorted.length + ' commit' + (sorted.length > 1 ? 's' : '');
                statTotal.textContent = sorted.length;

                // Dernière mise à jour
                if (sorted.length > 0) {
                    const latest = sorted[0];
                    const date = new Date(latest.created_at);
                    statLatest.textContent = date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    statSha.textContent = latest.commit_sha ? latest.commit_sha.substring(0, 7) : '-';
                }

                let html = '';
                sorted.forEach((u, index) => {
                    const isNew = index === 0;
                    const date = new Date(u.created_at);
                    const dateStr = date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    const sha = u.commit_sha ? u.commit_sha.substring(0, 7) : '-';
                    const message = u.commit_message || 'Mise à jour';
                    const url = u.commit_url || '#';

                    html += `
                        <div class="commit-item">
                            <div class="commit-icon ${isNew ? 'new' : ''}">
                                <i class="fas ${isNew ? 'fa-star' : 'fa-code-commit'}"></i>
                            </div>
                            <div class="commit-info">
                                <div class="commit-message">${message}</div>
                                <div class="commit-meta">
                                    <span class="meta-item"><i class="fas fa-hashtag"></i> <span class="sha">${sha}</span></span>
                                    <span class="meta-item"><i class="fas fa-calendar"></i> ${dateStr}</span>
                                    ${u.author ? `<span class="meta-item"><i class="fas fa-user"></i> ${u.author}</span>` : ''}
                                </div>
                            </div>
                            ${url !== '#' ? `<a href="${url}" target="_blank" class="commit-link"><i class="fas fa-external-link-alt"></i> Voir</a>` : ''}
                        </div>
                    `;
                });

                commitItems.innerHTML = html;
            }

            // ==========================================
            // AFFICHER VIDE
            // ==========================================

            function renderEmpty(message) {
                commitItems.innerHTML = `
                    <div class="empty-msg">
                        <i class="fas fa-inbox"></i>
                        <p>${message}</p>
                    </div>
                `;
                listCount.textContent = '0 commit';
                statTotal.textContent = '0';
                statLatest.textContent = '-';
                statSha.textContent = '-';
            }

            // ==========================================
            // VÉRIFIER LES MISES À JOUR
            // ==========================================

            async function checkUpdates() {
                if (isChecking) return;
                isChecking = true;
                checkBtn.disabled = true;
                checkBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Vérification...';

                try {
                    const res = await fetch('/api/admin/check-updates');
                    const data = await res.json();

                    if (res.ok) {
                        if (data.isNew) {
                            showToast(`✅ Nouvelle mise à jour détectée : ${data.commit.message}`, 'success');
                            // Recharger la liste
                            await loadUpdates();
                        } else {
                            showToast('ℹ️ Aucune nouvelle mise à jour disponible.', 'info');
                        }
                    } else {
                        showToast('❌ ' + (data.error || 'Erreur lors de la vérification.'), 'error');
                    }
                } catch (error) {
                    console.error('Erreur check-updates:', error);
                    showToast('❌ Erreur de connexion au serveur.', 'error');
                }

                isChecking = false;
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fas fa-cloud-download-alt"></i> Vérifier les mises à jour';
            }

            // ==========================================
            // SOCKET.IO - BADGES
            // ==========================================

            let socket = null;

            function connectSocketIO() {
                if (socket) {
                    socket.disconnect();
                    socket = null;
                }

                try {
                    const adminId = localStorage.getItem('adminId') || '1';

                    socket = io({
                        auth: {
                            userId: parseInt(adminId),
                            isAdmin: true
                        },
                        transports: ['websocket', 'polling'],
                        timeout: 5000,
                        reconnection: true,
                        reconnectionAttempts: 20,
                        reconnectionDelay: 500
                    });

                    socket.on('connect', function() {
                        console.log('✅ Socket.IO admin (updates) connecté');
                    });

                    socket.on('disconnect', function() {
                        console.log('❌ Socket.IO admin (updates) déconnecté');
                        setTimeout(() => {
                            if (!socket?.connected) connectSocketIO();
                        }, 3000);
                    });

                } catch (error) {
                    console.error('❌ Erreur connexion Socket.IO:', error);
                    setTimeout(() => connectSocketIO(), 5000);
                }
            }

            // ==========================================
            // ÉVÉNEMENTS
            // ==========================================

            checkBtn.addEventListener('click', checkUpdates);

            // ==========================================
            // INITIALISATION
            // ==========================================

            // Charger les badges (admin-common)
            if (typeof updateBadges === 'function') {
                updateBadges();
            }

            loadUpdates();
            connectSocketIO();

            // Rafraîchir toutes les 60 secondes
            setInterval(() => {
                loadUpdates();
            }, 60000);

            console.log('✅ updates.html initialisé');

        });
    </script>

</body>
</html>
