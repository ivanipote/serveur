<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📨 Messages | Nature+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* =============================================================
           MESSAGE - STYLES 50/50
           ============================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        :root {
            --bg-app: #F5F6F9;
            --surface: #FFFFFF;
            --surface-alt: #FAFBFC;
            --border: #E6E8EF;
            --border-strong: #D8DBE4;
            --ink-900: #10141F;
            --ink-700: #3A4152;
            --ink-500: #6B7280;
            --ink-400: #9CA3AF;
            --sidebar-1: #0A0E1A;
            --sidebar-line: rgba(255,255,255,0.07);
            --sidebar-text: rgba(226,230,242,0.62);
            --sidebar-text-hi: #F3F5FA;
            --brand: #17A464;
            --brand-dark: #0E7A49;
            --brand-tint: #E6F7EE;
            --brand-line: #BFEBD3;
            --blue: #2563EB;
            --blue-tint: #EAF1FF;
            --red: #C0342A;
            --red-tint: #FCEBEA;
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg-app);
            color: var(--ink-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* =============================================================
           HEADER COMMUN
           ============================================================= */

        .admin-header {
            background: var(--sidebar-1);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid var(--sidebar-line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-header .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-header .header-left .logo {
            color: var(--sidebar-text-hi);
            font-size: 18px;
            font-weight: 700;
        }

        .admin-header .header-left .logo span {
            color: #34D399;
        }

        .admin-header .header-center {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .admin-header .header-center .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            color: var(--sidebar-text);
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .admin-header .header-center .header-badge:hover {
            background: rgba(255,255,255,0.1);
            color: var(--sidebar-text-hi);
        }

        .admin-header .header-center .header-badge i {
            font-size: 14px;
        }

        .admin-header .header-center .header-badge .badge-dot {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--red);
            color: white;
            margin-left: 2px;
        }

        .admin-header .header-center .header-badge .badge-dot.zero {
            background: rgba(255,255,255,0.1);
            color: var(--sidebar-text);
        }

        .admin-header .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-header .header-right .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            color: var(--sidebar-text);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--sidebar-line);
            transition: all 0.2s;
        }

        .admin-header .header-right .btn-back:hover {
            background: rgba(255,255,255,0.1);
            color: var(--sidebar-text-hi);
        }

        .admin-header .header-right .btn-back i {
            font-size: 14px;
        }

        .admin-header .header-right .admin-name {
            color: var(--sidebar-text);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
        }

        /* =============================================================
           PAGE - 50/50
           ============================================================= */

        .page-container {
            flex: 1;
            display: flex;
            height: calc(100vh - 76px);
            overflow: hidden;
        }

        /* ===== COLONNE GAUCHE (50%) ===== */
        .col-messages {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--surface);
            overflow: hidden;
        }

        .col-messages .col-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            background: var(--surface-alt);
        }

        .col-messages .col-header h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink-900);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .col-messages .col-header h2 i {
            color: var(--ink-400);
        }

        .col-messages .col-header .badge-msg {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 999px;
            background: var(--brand);
            color: white;
        }

        .col-messages .messages-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        .col-messages .messages-list::-webkit-scrollbar {
            width: 4px;
        }

        .col-messages .messages-list::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 10px;
        }

        /* ===== CARTE MESSAGE ===== */
        .msg-card {
            background: var(--surface-alt);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1.5px solid var(--border);
            transition: all 0.3s ease;
        }

        .msg-card:hover {
            border-color: var(--brand);
            box-shadow: 0 4px 16px rgba(23,164,100,0.08);
        }

        .msg-card .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .msg-card .msg-header .from {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink-900);
        }

        .msg-card .msg-header .from i {
            color: var(--ink-400);
            font-size: 12px;
        }

        .msg-card .msg-header .date {
            font-size: 11px;
            color: var(--ink-400);
            font-family: var(--font-mono);
        }

        .msg-card .msg-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--blue);
            margin-bottom: 2px;
        }

        .msg-card .msg-content {
            font-size: 13.5px;
            color: var(--ink-700);
            line-height: 1.5;
            word-wrap: break-word;
        }

        .msg-card .msg-actions {
            margin-top: 8px;
            display: flex;
            gap: 6px;
        }

        .msg-card .msg-actions .btn-action {
            padding: 4px 12px;
            border: none;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .msg-card .msg-actions .btn-action.read {
            background: var(--blue-tint);
            color: var(--blue);
        }

        .msg-card .msg-actions .btn-action.read:hover {
            background: #C7D9FB;
        }

        .msg-card .msg-actions .btn-action.delete {
            background: var(--red-tint);
            color: var(--red);
        }

        .msg-card .msg-actions .btn-action.delete:hover {
            background: #F3C6C2;
        }

        .msg-card.unread {
            background: #FFF8F0;
            border-color: #F5DBAA;
        }

        .msg-card.unread .msg-title {
            color: var(--amber);
        }

        .msg-card .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .msg-card .status-dot.unread {
            background: #F87171;
        }

        .msg-card .status-dot.read {
            background: #34D399;
        }

        .empty-msg {
            text-align: center;
            color: var(--ink-400);
            padding: 40px 20px;
            font-size: 14px;
        }

        .empty-msg i {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            color: var(--border-strong);
        }

        /* ===== COLONNE DROITE (50%) ===== */
        .col-send {
            width: 50%;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: 16px;
            margin: 12px 12px 12px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .col-send .col-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            background: var(--surface-alt);
        }

        .col-send .col-header h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--ink-900);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .col-send .col-header h2 i {
            color: var(--brand);
        }

        .col-send .col-header .btn-toggle {
            display: flex;
            gap: 6px;
        }

        .col-send .col-header .btn-toggle button {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--surface);
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-500);
            cursor: pointer;
            transition: all 0.2s;
        }

        .col-send .col-header .btn-toggle button:hover {
            border-color: var(--brand);
            color: var(--brand-dark);
        }

        .col-send .col-header .btn-toggle button.active {
            background: var(--brand);
            color: white;
            border-color: var(--brand);
        }

        /* ===== CONTENU DE LA COLONNE DROITE ===== */
        .col-send .col-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .col-send .col-body .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 16px;
        }

        .col-send .col-body .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-700);
        }

        .col-send .col-body .form-group label .required {
            color: var(--red);
        }

        .col-send .col-body .form-group select,
        .col-send .col-body .form-group input,
        .col-send .col-body .form-group textarea {
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: var(--font-ui);
            background: var(--surface-alt);
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            color: var(--ink-900);
            width: 100%;
        }

        .col-send .col-body .form-group select:focus,
        .col-send .col-body .form-group input:focus,
        .col-send .col-body .form-group textarea:focus {
            border-color: var(--brand);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(23,164,100,0.08);
        }

        .col-send .col-body .form-group select[multiple] {
            height: auto;
            min-height: 100px;
            padding: 8px;
        }

        .col-send .col-body .form-group select[multiple] option {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .col-send .col-body .form-group select[multiple] option:checked {
            background: var(--brand);
            color: white;
        }

        .col-send .col-body .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .col-send .col-body .form-hint {
            font-size: 12px;
            color: var(--ink-400);
        }

        .btn-send {
            padding: 12px 32px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .btn-send:hover:not(:disabled) {
            background: var(--brand-dark);
            transform: scale(1.01);
            box-shadow: 0 8px 30px rgba(23,164,100,0.25);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .form-message {
            margin-top: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            border: 1px solid transparent;
        }

        .form-message.success {
            display: block;
            background: var(--green-tint);
            color: var(--brand-dark);
            border-color: var(--brand-line);
        }

        .form-message.error {
            display: block;
            background: var(--red-tint);
            color: var(--red);
            border-color: #F3C6C2;
        }

        /* ===== VUE HISTORIQUE ===== */
        .history-list {
            display: none;
        }

        .history-list.active {
            display: block;
        }

        .history-list .history-card {
            background: var(--surface-alt);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1.5px solid var(--border);
            transition: all 0.3s ease;
        }

        .history-list .history-card:hover {
            border-color: var(--brand-line);
        }

        .history-list .history-card .h-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .history-list .history-card .h-header .h-to {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-900);
        }

        .history-list .history-card .h-header .h-to i {
            color: var(--ink-400);
            font-size: 12px;
        }

        .history-list .history-card .h-header .h-date {
            font-size: 11px;
            color: var(--ink-400);
            font-family: var(--font-mono);
        }

        .history-list .history-card .h-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--blue);
            margin-bottom: 2px;
        }

        .history-list .history-card .h-content {
            font-size: 13.5px;
            color: var(--ink-700);
            line-height: 1.5;
            word-wrap: break-word;
        }

        .send-view {
            display: block;
        }

        .send-view.hidden {
            display: none;
        }

        /* =============================================================
           RESPONSIVE
           ============================================================= */

        @media (max-width: 992px) {
            .page-container {
                flex-direction: column;
                height: auto;
            }
            .col-messages {
                width: 100%;
                max-height: 400px;
                border-right: none;
                border-bottom: 1px solid var(--border);
                border-radius: 12px 12px 0 0 !important;
            }
            .col-send {
                width: 100%;
                border-radius: 0 0 12px 12px !important;
                margin: 0 0 12px 0;
            }
        }

        @media (max-width: 768px) {
            .admin-header {
                padding: 8px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .admin-header .header-left {
                justify-content: center;
            }
            .admin-header .header-center {
                justify-content: center;
                gap: 4px;
            }
            .admin-header .header-center .header-badge {
                font-size: 12px;
                padding: 4px 10px;
            }
            .admin-header .header-center .header-badge .badge-dot {
                font-size: 9px;
                min-width: 16px;
                height: 16px;
            }
            .admin-header .header-right {
                justify-content: center;
            }
            .col-messages {
                max-height: 350px;
            }
            .col-send .col-body {
                padding: 16px;
            }
            .btn-send {
                font-size: 14px;
                padding: 10px 20px;
            }
        }

        @media (max-width: 480px) {
            .admin-header {
                padding: 6px 10px;
                gap: 6px;
            }
            .admin-header .header-left .logo {
                font-size: 15px;
            }
            .admin-header .header-center .header-badge {
                font-size: 10px;
                padding: 3px 8px;
                gap: 4px;
            }
            .admin-header .header-center .header-badge i {
                font-size: 11px;
            }
            .admin-header .header-center .header-badge .badge-dot {
                font-size: 8px;
                min-width: 14px;
                height: 14px;
                padding: 0 4px;
            }
            .admin-header .header-right .btn-back {
                font-size: 11px;
                padding: 4px 10px;
            }
            .col-messages {
                max-height: 280px;
            }
            .col-send .col-body {
                padding: 12px;
            }
            .msg-card {
                border-radius: 12px !important;
                padding: 10px 12px;
            }
            .msg-card .msg-header .from {
                font-size: 13px;
            }
            .msg-card .msg-content {
                font-size: 13px;
            }
            .col-send .col-body .form-group select,
            .col-send .col-body .form-group input,
            .col-send .col-body .form-group textarea {
                font-size: 13px;
                padding: 8px 12px;
            }
            .col-send .col-header .btn-toggle button {
                font-size: 11px;
                padding: 4px 10px;
            }
        }

        * {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }
        button, a, .btn, .clickable {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }
        input, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
        }
    </style>
</head>
<body>

    <!-- ============================================================= -->
    <!-- HEADER COMMUN                                                  -->
    <!-- ============================================================= -->
    <header class="admin-header">
        <div class="header-left">
            <span class="logo">🌿 Nature<span>+</span></span>
        </div>
        <div class="header-center">
            <a href="/admin/comm.html" class="header-badge">
                <i class="fas fa-truck"></i> Commandes
                <span class="badge-dot" id="headerBadgeCommandes">0</span>
            </a>
            <a href="/admin/wave.html" class="header-badge">
                <i class="fas fa-water"></i> Wave
                <span class="badge-dot" id="headerBadgeWave">0</span>
            </a>
            <a href="/admin/paiements.html" class="header-badge">
                <i class="fas fa-credit-card"></i> Paiements
                <span class="badge-dot" id="headerBadgePayments">0</span>
            </a>
        </div>
        <div class="header-right">
            <span class="admin-name" id="adminName">Admin</span>
            <a href="/admin/dashboard" class="btn-back" title="Retour">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
        </div>
    </header>

    <!-- ============================================================= -->
    <!-- PAGE 50/50                                                     -->
    <!-- ============================================================= -->
    <div class="page-container">

        <!-- COLONNE GAUCHE : Messages reçus -->
        <div class="col-messages">
            <div class="col-header">
                <h2><i class="fas fa-inbox"></i> Messages reçus</h2>
                <span class="badge-msg" id="msgCount">0</span>
            </div>
            <div class="messages-list" id="messagesList">
                <div class="empty-msg">
                    <i class="fas fa-inbox"></i>
                    Aucun message reçu
                </div>
            </div>
        </div>

        <!-- COLONNE DROITE : Envoyer un message / Historique -->
        <div class="col-send">
            <div class="col-header">
                <h2 id="colRightTitle"><i class="fas fa-paper-plane"></i> Envoyer un message</h2>
                <div class="btn-toggle">
                    <button class="active" id="btnSendView" title="Envoyer un message">
                        <i class="fas fa-paper-plane"></i> Envoyer
                    </button>
                    <button id="btnHistoryView" title="Voir l'historique">
                        <i class="fas fa-clock"></i> Historique
                    </button>
                </div>
            </div>

            <div class="col-body">

                <!-- VUE : ENVOYER UN MESSAGE -->
                <div class="send-view" id="sendView">
                    <form id="sendMessageForm">
                        <div class="form-group">
                            <label>
                                Destinataire(s) <span class="required">*</span>
                            </label>
                            <select id="messageUsers" multiple required>
                                <option value="all">📢 Tous les clients</option>
                            </select>
                            <div class="form-hint">Maintenez Ctrl (ou Cmd) pour sélectionner plusieurs</div>
                        </div>

                        <div class="form-group">
                            <label>
                                Titre <span class="required">*</span>
                            </label>
                            <input type="text" id="messageTitle" placeholder="Ex: Offre spéciale" required />
                        </div>

                        <div class="form-group">
                            <label>
                                Contenu <span class="required">*</span>
                            </label>
                            <textarea id="messageContent" rows="4" placeholder="Votre message..." required></textarea>
                        </div>

                        <button type="submit" class="btn-send" id="sendBtn">
                            <i class="fas fa-paper-plane"></i> Envoyer
                        </button>

                        <div id="sendFormMessage" class="form-message"></div>
                    </form>
                </div>

                <!-- VUE : HISTORIQUE DES MESSAGES ENVOYÉS -->
                <div class="history-list" id="historyView">
                    <!-- Les messages historiques seront injectés ici -->
                    <div class="empty-msg" id="historyEmpty">
                        <i class="fas fa-clock"></i>
                        Aucun message envoyé
                    </div>
                    <div id="historyList"></div>
                </div>

            </div>
        </div>

    </div>

    <!-- ============================================================= -->
    <!-- SCRIPTS                                                        -->
    <!-- ============================================================= -->
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script src="/admin/js/admin-common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ message.html chargé');

            // ==========================================
            // RÉFÉRENCES
            // ==========================================

            const messagesList = document.getElementById('messagesList');
            const msgCount = document.getElementById('msgCount');

            const messageUsers = document.getElementById('messageUsers');
            const messageTitle = document.getElementById('messageTitle');
            const messageContent = document.getElementById('messageContent');
            const sendBtn = document.getElementById('sendBtn');
            const sendFormMessage = document.getElementById('sendFormMessage');

            const colRightTitle = document.getElementById('colRightTitle');
            const btnSendView = document.getElementById('btnSendView');
            const btnHistoryView = document.getElementById('btnHistoryView');
            const sendView = document.getElementById('sendView');
            const historyView = document.getElementById('historyView');
            const historyList = document.getElementById('historyList');
            const historyEmpty = document.getElementById('historyEmpty');

            let allMessages = [];
            let allSentMessages = [];

            // ==========================================
            // NOM ADMIN
            // ==========================================

            const adminName = localStorage.getItem('adminName') || 'Admin';
            document.getElementById('adminName').textContent = adminName;

            // ==========================================
            // TOGGLE VUES
            // ==========================================

            btnSendView.addEventListener('click', function() {
                btnSendView.classList.add('active');
                btnHistoryView.classList.remove('active');
                sendView.classList.remove('hidden');
                historyView.classList.remove('active');
                colRightTitle.innerHTML = '<i class="fas fa-paper-plane"></i> Envoyer un message';
            });

            btnHistoryView.addEventListener('click', function() {
                btnHistoryView.classList.add('active');
                btnSendView.classList.remove('active');
                sendView.classList.add('hidden');
                historyView.classList.add('active');
                colRightTitle.innerHTML = '<i class="fas fa-clock"></i> Historique des envois';
                loadHistory();
            });

            // ==========================================
            // CHARGER LES MESSAGES REÇUS
            // ==========================================

            async function loadMessages() {
                try {
                    const res = await fetch('/api/notifications');
                    const data = await res.json();

                    if (res.ok && data.notifications) {
                        allMessages = data.notifications.filter(n => n.type === 'client_message');
                        msgCount.textContent = allMessages.length;
                        renderMessages(allMessages);
                    } else {
                        messagesList.innerHTML = `
                            <div class="empty-msg">
                                <i class="fas fa-inbox"></i>
                                Aucun message reçu
                            </div>
                        `;
                        msgCount.textContent = '0';
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    messagesList.innerHTML = `
                        <div class="empty-msg">
                            <i class="fas fa-exclamation-circle"></i>
                            Erreur de chargement
                        </div>
                    `;
                }
            }

            // ==========================================
            // AFFICHER LES MESSAGES REÇUS
            // ==========================================

            function renderMessages(messages) {
                if (messages.length === 0) {
                    messagesList.innerHTML = `
                        <div class="empty-msg">
                            <i class="fas fa-inbox"></i>
                            Aucun message reçu
                        </div>
                    `;
                    return;
                }

                const dateOptions = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };

                messagesList.innerHTML = messages.map(m => {
                    const isUnread = m.is_read === 0 || m.is_read === false;
                    const from = m.title ? m.title.replace('📩 ', '') : 'Client';

                    return `
                        <div class="msg-card ${isUnread ? 'unread' : ''}">
                            <div class="msg-header">
                                <span class="from">
                                    <span class="status-dot ${isUnread ? 'unread' : 'read'}"></span>
                                    <i class="fas fa-user"></i> ${from}
                                </span>
                                <span class="date">${new Date(m.created_at).toLocaleDateString('fr-FR', dateOptions)}</span>
                            </div>
                            <div class="msg-title">${m.title || 'Message'}</div>
                            <div class="msg-content">${m.content || 'Aucun contenu'}</div>
                            <div class="msg-actions">
                                ${isUnread ? `
                                    <button class="btn-action read" onclick="markAsRead(${m.id})">
                                        <i class="fas fa-check"></i> Marquer lu
                                    </button>
                                ` : ''}
                                <button class="btn-action delete" onclick="deleteMessage(${m.id})">
                                    <i class="fas fa-trash-alt"></i> Supprimer
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // ==========================================
            // CHARGER L'HISTORIQUE DES ENVOIS
            // ==========================================

            async function loadHistory() {
                try {
                    const res = await fetch('/api/notifications');
                    const data = await res.json();

                    if (res.ok && data.notifications) {
                        // Messages envoyés par l'admin (type 'admin')
                        allSentMessages = data.notifications.filter(n => n.type === 'admin');
                        renderHistory(allSentMessages);
                    } else {
                        historyList.innerHTML = '';
                        historyEmpty.style.display = 'block';
                    }
                } catch (error) {
                    console.error('Erreur historique:', error);
                    historyList.innerHTML = '';
                    historyEmpty.style.display = 'block';
                    historyEmpty.innerHTML = `
                        <i class="fas fa-exclamation-circle"></i>
                        Erreur de chargement
                    `;
                }
            }

            // ==========================================
            // AFFICHER L'HISTORIQUE
            // ==========================================

            function renderHistory(messages) {
                if (messages.length === 0) {
                    historyList.innerHTML = '';
                    historyEmpty.style.display = 'block';
                    return;
                }

                historyEmpty.style.display = 'none';
                const dateOptions = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };

                historyList.innerHTML = messages.map(m => `
                    <div class="history-card">
                        <div class="h-header">
                            <span class="h-to"><i class="fas fa-users"></i> Destinataires: tous</span>
                            <span class="h-date">${new Date(m.created_at).toLocaleDateString('fr-FR', dateOptions)}</span>
                        </div>
                        <div class="h-title">${m.title || 'Sans titre'}</div>
                        <div class="h-content">${m.content || 'Aucun contenu'}</div>
                    </div>
                `).join('');
            }

            // ==========================================
            // MARQUER COMME LU
            // ==========================================

            window.markAsRead = async function(id) {
                try {
                    const res = await fetch(`/api/notifications/read/${id}`, { method: 'PUT' });
                    if (res.ok) {
                        loadMessages();
                        if (window.updateBadges) window.updateBadges();
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                }
            };

            // ==========================================
            // SUPPRIMER UN MESSAGE
            // ==========================================

            window.deleteMessage = async function(id) {
                if (!confirm('🗑️ Supprimer ce message ?')) return;
                try {
                    const res = await fetch(`/api/notifications/delete/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        loadMessages();
                        if (window.updateBadges) window.updateBadges();
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                }
            };

            // ==========================================
            // CHARGER LES UTILISATEURS
            // ==========================================

            async function loadUsers() {
                try {
                    const res = await fetch('/api/admin/clients');
                    const data = await res.json();

                    if (res.ok) {
                        messageUsers.innerHTML = '<option value="all">📢 Tous les clients</option>';
                        data.forEach(u => {
                            const opt = document.createElement('option');
                            opt.value = u.id;
                            opt.textContent = `${u.name} (${u.email})`;
                            messageUsers.appendChild(opt);
                        });
                    }
                } catch (error) {
                    console.error('Erreur chargement users:', error);
                }
            }

            // ==========================================
            // ENVOYER UN MESSAGE
            // ==========================================

            document.getElementById('sendMessageForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const title = messageTitle.value.trim();
                const content = messageContent.value.trim();
                const selectedOptions = messageUsers.selectedOptions;
                const userIds = Array.from(selectedOptions).map(opt => opt.value);

                if (!title || !content) {
                    sendFormMessage.className = 'form-message error';
                    sendFormMessage.textContent = '⚠️ Titre et contenu requis';
                    sendFormMessage.style.display = 'block';
                    return;
                }

                if (userIds.length === 0) {
                    sendFormMessage.className = 'form-message error';
                    sendFormMessage.textContent = '⚠️ Sélectionnez au moins un destinataire';
                    sendFormMessage.style.display = 'block';
                    return;
                }

                sendBtn.disabled = true;
                sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi...';
                sendFormMessage.className = 'form-message';
                sendFormMessage.style.display = 'none';

                let successCount = 0;
                let errorCount = 0;

                for (const userId of userIds) {
                    try {
                        const res = await fetch('/api/admin/notification/send', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                userId: userId === 'all' ? 'all' : parseInt(userId),
                                title: title,
                                content: content
                            })
                        });

                        if (res.ok) {
                            successCount++;
                        } else {
                            errorCount++;
                        }
                    } catch (err) {
                        errorCount++;
                    }
                }

                if (errorCount === 0) {
                    sendFormMessage.className = 'form-message success';
                    sendFormMessage.textContent = `✅ ${successCount} message(s) envoyé(s) !`;
                    sendFormMessage.style.display = 'block';
                    messageTitle.value = '';
                    messageContent.value = '';
                    // Recharger l'historique si ouvert
                    if (historyView.classList.contains('active')) {
                        loadHistory();
                    }
                } else {
                    sendFormMessage.className = 'form-message error';
                    sendFormMessage.textContent = `⚠️ ${successCount} envoyé(s), ${errorCount} échec(s)`;
                    sendFormMessage.style.display = 'block';
                }

                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Envoyer';
            });

            // ==========================================
            // INITIALISATION
            // ==========================================

            loadMessages();
            loadUsers();

            // Rafraîchir toutes les 30 secondes
            setInterval(() => {
                loadMessages();
                if (historyView.classList.contains('active')) {
                    loadHistory();
                }
            }, 30000);

            console.log('✅ message.html initialisé');

        });
    </script>

</body>
</html>
