<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>➕ Ajouter un produit | Nature+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/admin-common.css">
    <style>
        /* =============================================================
           ADD-PRODUIT - STYLES DÉDIÉS
           ============================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            outline: none !important;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F5F6F9;
            color: #10141F;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* =============================================================
           HEADER COMMUN (intégré)
           ============================================================= */

        .admin-header {
            background: #0A0E1A;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-header .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-header .header-left .logo {
            color: #F3F5FA;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .admin-header .header-left .logo span {
            color: #34D399;
        }

        .admin-header .header-center {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .admin-header .header-center .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            color: rgba(226, 230, 242, 0.62);
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
        }

        .admin-header .header-center .header-badge:hover {
            background: rgba(255,255,255,0.1);
            color: #F3F5FA;
        }

        .admin-header .header-center .header-badge.active {
            background: rgba(23, 164, 100, 0.15);
            color: #F3F5FA;
            border-color: rgba(23, 164, 100, 0.25);
        }

        .admin-header .header-center .header-badge i {
            font-size: 14px;
        }

        .admin-header .header-center .header-badge .badge-dot {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #C0342A;
            color: white;
            margin-left: 2px;
        }

        .admin-header .header-center .header-badge .badge-dot.zero {
            background: rgba(255,255,255,0.1);
            color: rgba(226, 230, 242, 0.62);
        }

        .admin-header .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-header .header-right .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            color: rgba(226, 230, 242, 0.62);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.07);
        }

        .admin-header .header-right .btn-back:hover {
            background: rgba(255,255,255,0.1);
            color: #F3F5FA;
        }

        .admin-header .header-right .btn-back i {
            font-size: 14px;
        }

        .admin-header .header-right .admin-name {
            color: rgba(226, 230, 242, 0.62);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
        }

        /* =============================================================
           PAGE CONTENT
           ============================================================= */

        .page-container {
            padding: 24px 30px 40px 30px;
            max-width: 900px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }

        .page-container .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-container .page-header .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #10141F;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-container .page-header .page-title i {
            color: #9CA3AF;
            font-size: 22px;
        }

        /* =============================================================
           FORM CARD
           ============================================================= */

        .form-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 28px 32px;
            border: 1px solid #E6E8EF;
            box-shadow: 0 1px 2px rgba(16,20,31,0.05);
        }

        .form-card .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 18px;
        }

        .form-card .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-card .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #3A4152;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-card .form-group label .required {
            color: #C0342A;
            font-weight: 700;
        }

        .form-card .form-group input,
        .form-card .form-group textarea {
            padding: 10px 14px;
            border: 1.5px solid #E6E8EF;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: #FAFBFC;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            color: #10141F;
            width: 100%;
        }

        .form-card .form-group input:focus,
        .form-card .form-group textarea:focus {
            border-color: #17A464;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(23, 164, 100, 0.08);
        }

        .form-card .form-group input::placeholder,
        .form-card .form-group textarea::placeholder {
            color: #9CA3AF;
        }

        .form-card .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-card .form-group input[type="file"] {
            padding: 8px 10px;
            background: #FAFBFC;
            cursor: pointer;
        }

        .form-card .form-group input[type="file"]::file-selector-button {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            background: #E6E8EF;
            color: #3A4152;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .form-card .form-group input[type="file"]::file-selector-button:hover {
            background: #D8DBE4;
        }

        /* ===== IMAGE PREVIEW ===== */
        .form-card .image-preview-container {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .form-card .image-preview-container .preview-box {
            width: 120px;
            height: 120px;
            border-radius: 10px;
            border: 2px dashed #E6E8EF;
            background: #FAFBFC;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: border-color 0.2s;
        }

        .form-card .image-preview-container .preview-box.has-image {
            border-color: #17A464;
            border-style: solid;
        }

        .form-card .image-preview-container .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-card .image-preview-container .preview-box .placeholder {
            color: #9CA3AF;
            font-size: 12px;
            text-align: center;
            padding: 8px;
        }

        .form-card .image-preview-container .preview-box .placeholder i {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }

        .form-card .image-preview-container .preview-box .remove-image {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #C0342A;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .form-card .image-preview-container .preview-box .remove-image:hover {
            transform: scale(1.1);
        }

        .form-card .image-preview-container .preview-box.has-image .remove-image {
            display: flex;
        }

        /* ===== SUBMIT BUTTON ===== */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #17A464;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #0E7A49;
            transform: scale(1.01);
            box-shadow: 0 8px 30px rgba(23, 164, 100, 0.25);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== FORM MESSAGE ===== */
        .form-message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            border: 1px solid transparent;
        }

        .form-message.success {
            display: block;
            background: #E6F7EE;
            color: #0E7A49;
            border-color: #BFEBD3;
        }

        .form-message.error {
            display: block;
            background: #FCEBEA;
            color: #C0342A;
            border-color: #F3C6C2;
        }

        .form-message.info {
            display: block;
            background: #EAF1FF;
            color: #2563EB;
            border-color: #C7D9FB;
        }

        /* =============================================================
           RESPONSIVE
           ============================================================= */

        @media (max-width: 768px) {
            .admin-header {
                padding: 8px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .admin-header .header-left {
                justify-content: center;
            }
            .admin-header .header-center {
                justify-content: center;
                gap: 4px;
            }
            .admin-header .header-center .header-badge {
                font-size: 12px;
                padding: 4px 10px;
            }
            .admin-header .header-right {
                justify-content: center;
            }
            .page-container {
                padding: 16px;
            }
            .page-container .page-header .page-title {
                font-size: 20px;
            }
            .form-card {
                padding: 20px 18px;
            }
            .form-card .form-row {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .form-card .image-preview-container .preview-box {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .admin-header {
                padding: 6px 10px;
                gap: 6px;
            }
            .admin-header .header-left .logo {
                font-size: 15px;
            }
            .admin-header .header-center .header-badge {
                font-size: 10px;
                padding: 3px 8px;
                gap: 4px;
            }
            .admin-header .header-center .header-badge i {
                font-size: 11px;
            }
            .admin-header .header-center .header-badge .badge-dot {
                font-size: 8px;
                min-width: 14px;
                height: 14px;
                padding: 0 4px;
            }
            .admin-header .header-right .btn-back {
                font-size: 11px;
                padding: 4px 10px;
            }
            .page-container {
                padding: 10px;
            }
            .page-container .page-header .page-title {
                font-size: 17px;
            }
            .form-card {
                padding: 14px 12px;
                border-radius: 12px;
            }
            .form-card .form-group label {
                font-size: 12px;
            }
            .form-card .form-group input,
            .form-card .form-group textarea {
                font-size: 13px;
                padding: 8px 12px;
            }
            .form-card .image-preview-container .preview-box {
                width: 80px;
                height: 80px;
            }
            .btn-submit {
                font-size: 14px;
                padding: 12px;
            }
        }

        /* ========================================== */
        /* SUPPRIMER L'EFFET BLEU DE SURVOL / CLIC    */
        /* ========================================== */

        * {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        button, a, .btn, .clickable {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        input, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
        }
    </style>
</head>
<body>

    <!-- ============================================================= -->
    <!-- HEADER COMMUN                                                  -->
    <!-- ============================================================= -->
    <header class="admin-header">
        <div class="header-left">
            <span class="logo">🌿 Nature<span>+</span></span>
        </div>
        <div class="header-center">
            <a href="/admin/comm.html" class="header-badge">
                <i class="fas fa-truck"></i> Commandes
                <span class="badge-dot" id="headerBadgeCommandes">0</span>
            </a>
            <a href="/admin/wave.html" class="header-badge">
                <i class="fas fa-water"></i> Wave
                <span class="badge-dot" id="headerBadgeWave">0</span>
            </a>
            <a href="/admin/paiements.html" class="header-badge">
                <i class="fas fa-credit-card"></i> Paiements
                <span class="badge-dot" id="headerBadgePayments">0</span>
            </a>
        </div>
        <div class="header-right">
            <span class="admin-name" id="adminName">Admin</span>
            <a href="/admin/dashboard" class="btn-back" title="Retour au Dashboard">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
        </div>
    </header>

    <!-- ============================================================= -->
    <!-- CONTENU DE LA PAGE                                             -->
    <!-- ============================================================= -->
    <div class="page-container">

        <div class="page-header">
            <div class="page-title">
                <i class="fas fa-plus-circle"></i> Ajouter un produit
            </div>
        </div>

        <!-- ===== FORMULAIRE ===== -->
        <form id="addProductForm" class="form-card" enctype="multipart/form-data">

            <!-- Ligne 1 : Nom + Prix -->
            <div class="form-row">
                <div class="form-group">
                    <label>
                        Nom du produit <span class="required">*</span>
                    </label>
                    <input type="text" id="productName" placeholder="Ex: Jus de gingembre" required />
                </div>
                <div class="form-group">
                    <label>
                        Prix (FCFA) <span class="required">*</span>
                    </label>
                    <input type="number" id="productPrice" placeholder="Ex: 500" required min="1" />
                </div>
            </div>

            <!-- Ligne 2 : Stock + Description -->
            <div class="form-row">
                <div class="form-group">
                    <label>Quantité en stock</label>
                    <input type="number" id="productQuantity" placeholder="Ex: 50" value="0" min="0" />
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="productDescription" placeholder="Brève description du produit..." rows="2"></textarea>
                </div>
            </div>

            <!-- Ligne 3 : Images -->
            <div class="form-row">
                <div class="form-group">
                    <label>
                        Image 1 <span class="required">*</span>
                    </label>
                    <input type="file" id="productImage1" accept="image/*" required />
                    <div class="image-preview-container">
                        <div class="preview-box" id="preview1">
                            <div class="placeholder">
                                <i class="fas fa-image"></i>
                                Aperçu
                            </div>
                            <button type="button" class="remove-image" id="remove1" title="Supprimer">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Image 2</label>
                    <input type="file" id="productImage2" accept="image/*" />
                    <div class="image-preview-container">
                        <div class="preview-box" id="preview2">
                            <div class="placeholder">
                                <i class="fas fa-image"></i>
                                Aperçu
                            </div>
                            <button type="button" class="remove-image" id="remove2" title="Supprimer">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-plus-circle"></i> Ajouter le produit
            </button>

            <!-- Message -->
            <div id="formMessage" class="form-message"></div>

        </form>

    </div>

    <!-- ============================================================= -->
    <!-- SCRIPTS                                                        -->
    <!-- ============================================================= -->
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script src="/admin/js/admin-common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ add-produit.js chargé');

            // ==========================================
            // RÉFÉRENCES
            // ==========================================

            const form = document.getElementById('addProductForm');
            const submitBtn = document.getElementById('submitBtn');
            const message = document.getElementById('formMessage');

            const nameInput = document.getElementById('productName');
            const priceInput = document.getElementById('productPrice');
            const quantityInput = document.getElementById('productQuantity');
            const descInput = document.getElementById('productDescription');
            const image1Input = document.getElementById('productImage1');
            const image2Input = document.getElementById('productImage2');

            const preview1 = document.getElementById('preview1');
            const preview2 = document.getElementById('preview2');
            const remove1 = document.getElementById('remove1');
            const remove2 = document.getElementById('remove2');

            let image1Data = null;
            let image2Data = null;

            // ==========================================
            // APERÇU DES IMAGES
            // ==========================================

            function handleImagePreview(input, previewBox, removeBtn, imageDataObj) {
                const file = input.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;

                    // Nettoyer l'aperçu
                    previewBox.innerHTML = '';
                    previewBox.appendChild(img);
                    previewBox.classList.add('has-image');
                    imageDataObj.data = e.target.result;
                    imageDataObj.file = file;
                };
                reader.readAsDataURL(file);
            }

            image1Input.addEventListener('change', function() {
                handleImagePreview(this, preview1, remove1, { data: image1Data, file: null });
            });

            image2Input.addEventListener('change', function() {
                handleImagePreview(this, preview2, remove2, { data: image2Data, file: null });
            });

            function clearPreview(previewBox, input) {
                previewBox.innerHTML = `
                    <div class="placeholder">
                        <i class="fas fa-image"></i>
                        Aperçu
                    </div>
                `;
                previewBox.classList.remove('has-image');
                input.value = '';
            }

            remove1.addEventListener('click', function(e) {
                e.stopPropagation();
                clearPreview(preview1, image1Input);
                image1Data = null;
            });

            remove2.addEventListener('click', function(e) {
                e.stopPropagation();
                clearPreview(preview2, image2Input);
                image2Data = null;
            });

            // ==========================================
            // AFFICHER UN MESSAGE
            // ==========================================

            function showMessage(text, type) {
                message.textContent = text;
                message.className = 'form-message ' + type;
            }

            function hideMessage() {
                message.className = 'form-message';
                message.textContent = '';
            }

            // ==========================================
            // SOUMISSION DU FORMULAIRE
            // ==========================================

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideMessage();

                const name = nameInput.value.trim();
                const price = parseInt(priceInput.value);
                const quantity = parseInt(quantityInput.value) || 0;
                const description = descInput.value.trim();
                const image1 = image1Input.files[0];

                // ✅ Validation
                if (!name) {
                    showMessage('⚠️ Veuillez entrer un nom de produit.', 'error');
                    nameInput.focus();
                    return;
                }

                if (!price || price <= 0) {
                    showMessage('⚠️ Veuillez entrer un prix valide.', 'error');
                    priceInput.focus();
                    return;
                }

                if (!image1) {
                    showMessage('⚠️ Veuillez sélectionner une image 1.', 'error');
                    image1Input.focus();
                    return;
                }

                // ✅ Désactiver le bouton
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi en cours...';

                // ✅ Construire FormData
                const formData = new FormData();
                formData.append('name', name);
                formData.append('price', price);
                formData.append('quantity', quantity);
                formData.append('description', description);
                formData.append('image1', image1);

                if (image2Input.files[0]) {
                    formData.append('image2', image2Input.files[0]);
                }

                try {
                    const res = await fetch('/api/admin/products', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await res.json();

                    if (res.ok) {
                        showMessage('✅ Produit ajouté avec succès !', 'success');

                        // ✅ Réinitialiser le formulaire
                        form.reset();
                        clearPreview(preview1, image1Input);
                        clearPreview(preview2, image2Input);
                        image1Data = null;
                        image2Data = null;

                        // ✅ Rediriger après 2 secondes
                        setTimeout(() => {
                            window.location.href = '/admin/dashboard';
                        }, 2000);
                    } else {
                        showMessage('❌ ' + (data.error || 'Erreur lors de l\'ajout du produit.'), 'error');
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    showMessage('❌ Erreur de connexion au serveur.', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-plus-circle"></i> Ajouter le produit';
                }
            });

            // ==========================================
            // NOM ADMIN
            // ==========================================

            const adminName = localStorage.getItem('adminName') || 'Admin';
            document.getElementById('adminName').textContent = adminName;

            console.log('✅ add-produit.html initialisé');

        });
    </script>

</body>
</html>
