<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>➕ Ajouter / Modifier un produit | Nature+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/admin-common.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            outline: none !important;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F5F6F9;
            color: #10141F;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .admin-header {
            background: #0A0E1A;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-header .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-header .header-left .logo {
            color: #F3F5FA;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .admin-header .header-left .logo span {
            color: #34D399;
        }

        .admin-header .header-center {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .admin-header .header-center .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            color: rgba(226, 230, 242, 0.62);
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
        }

        .admin-header .header-center .header-badge:hover {
            background: rgba(255,255,255,0.1);
            color: #F3F5FA;
        }

        .admin-header .header-center .header-badge i {
            font-size: 14px;
        }

        .admin-header .header-center .header-badge .badge-dot {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #C0342A;
            color: white;
            margin-left: 2px;
        }

        .admin-header .header-center .header-badge .badge-dot.zero {
            background: rgba(255,255,255,0.1);
            color: rgba(226, 230, 242, 0.62);
        }

        .admin-header .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-header .header-right .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            color: rgba(226, 230, 242, 0.62);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.07);
        }

        .admin-header .header-right .btn-back:hover {
            background: rgba(255,255,255,0.1);
            color: #F3F5FA;
        }

        .admin-header .header-right .btn-back i {
            font-size: 14px;
        }

        .admin-header .header-right .admin-name {
            color: rgba(226, 230, 242, 0.62);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
        }

        .page-container {
            padding: 24px 30px 40px 30px;
            max-width: 1000px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-header .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #10141F;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header .page-title i {
            color: #9CA3AF;
            font-size: 22px;
        }

        .form-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 28px 32px;
            border: 1px solid #E6E8EF;
            box-shadow: 0 1px 2px rgba(16,20,31,0.05);
        }

        .form-card .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 18px;
        }

        .form-card .form-row.three {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .form-card .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-card .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #3A4152;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-card .form-group label .required {
            color: #C0342A;
            font-weight: 700;
        }

        .form-card .form-group label .hint {
            font-weight: 400;
            color: #9CA3AF;
            font-size: 11px;
        }

        .form-card .form-group input,
        .form-card .form-group textarea,
        .form-card .form-group select {
            padding: 10px 14px;
            border: 1.5px solid #E6E8EF;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: #FAFBFC;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            color: #10141F;
            width: 100%;
        }

        .form-card .form-group input:focus,
        .form-card .form-group textarea:focus,
        .form-card .form-group select:focus {
            border-color: #17A464;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(23, 164, 100, 0.08);
        }

        .form-card .form-group input::placeholder,
        .form-card .form-group textarea::placeholder {
            color: #9CA3AF;
        }

        .form-card .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-card .form-group input[type="file"] {
            padding: 8px 10px;
            background: #FAFBFC;
            cursor: pointer;
        }

        .form-card .form-group input[type="file"]::file-selector-button {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            background: #E6E8EF;
            color: #3A4152;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .form-card .form-group input[type="file"]::file-selector-button:hover {
            background: #D8DBE4;
        }

        .form-card .image-preview-container {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .form-card .image-preview-container .preview-box {
            width: 120px;
            height: 120px;
            border-radius: 10px;
            border: 2px dashed #E6E8EF;
            background: #FAFBFC;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: border-color 0.2s;
        }

        .form-card .image-preview-container .preview-box.has-image {
            border-color: #17A464;
            border-style: solid;
        }

        .form-card .image-preview-container .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-card .image-preview-container .preview-box .placeholder {
            color: #9CA3AF;
            font-size: 12px;
            text-align: center;
            padding: 8px;
        }

        .form-card .image-preview-container .preview-box .placeholder i {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }

        .form-card .image-preview-container .preview-box .remove-image {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #C0342A;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .form-card .image-preview-container .preview-box.has-image .remove-image {
            display: flex;
        }

        .form-card .toggle-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }

        .form-card .toggle-group label {
            font-size: 14px;
            font-weight: 500;
            color: #3A4152;
            cursor: pointer;
        }

        .form-card .toggle-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #17A464;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #17A464;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #0E7A49;
            transform: scale(1.01);
            box-shadow: 0 8px 30px rgba(23, 164, 100, 0.25);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit.edit-mode {
            background: #2563EB;
        }

        .btn-submit.edit-mode:hover {
            background: #1D4ED8;
        }

        .form-message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            border: 1px solid transparent;
        }

        .form-message.success {
            display: block;
            background: #E6F7EE;
            color: #0E7A49;
            border-color: #BFEBD3;
        }

        .form-message.error {
            display: block;
            background: #FCEBEA;
            color: #C0342A;
            border-color: #F3C6C2;
        }

        .form-message.info {
            display: block;
            background: #EAF1FF;
            color: #2563EB;
            border-color: #C7D9FB;
        }

        /* =============================================================
           SECTION DIVIDER
           ============================================================= */
        .section-divider {
            border: none;
            border-top: 2px solid #E6E8EF;
            margin: 22px 0 18px 0;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #10141F;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #17A464;
            font-size: 16px;
        }

        /* =============================================================
           RESPONSIVE
           ============================================================= */

        @media (max-width: 992px) {
            .form-card .form-row.three {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .admin-header {
                padding: 8px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .admin-header .header-left {
                justify-content: center;
            }
            .admin-header .header-center {
                justify-content: center;
                gap: 4px;
            }
            .admin-header .header-center .header-badge {
                font-size: 12px;
                padding: 4px 10px;
            }
            .admin-header .header-right {
                justify-content: center;
            }
            .page-container {
                padding: 16px;
            }
            .page-container .page-header .page-title {
                font-size: 20px;
            }
            .form-card {
                padding: 20px 18px;
            }
            .form-card .form-row {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .form-card .form-row.three {
                grid-template-columns: 1fr;
            }
            .form-card .image-preview-container .preview-box {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .admin-header {
                padding: 6px 10px;
                gap: 6px;
            }
            .admin-header .header-left .logo {
                font-size: 15px;
            }
            .admin-header .header-center .header-badge {
                font-size: 10px;
                padding: 3px 8px;
                gap: 4px;
            }
            .admin-header .header-center .header-badge i {
                font-size: 11px;
            }
            .admin-header .header-center .header-badge .badge-dot {
                font-size: 8px;
                min-width: 14px;
                height: 14px;
                padding: 0 4px;
            }
            .admin-header .header-right .btn-back {
                font-size: 11px;
                padding: 4px 10px;
            }
            .page-container {
                padding: 10px;
            }
            .page-container .page-header .page-title {
                font-size: 17px;
            }
            .form-card {
                padding: 14px 12px;
                border-radius: 12px;
            }
            .form-card .form-group label {
                font-size: 12px;
            }
            .form-card .form-group input,
            .form-card .form-group textarea,
            .form-card .form-group select {
                font-size: 13px;
                padding: 8px 12px;
            }
            .form-card .image-preview-container .preview-box {
                width: 80px;
                height: 80px;
            }
            .btn-submit {
                font-size: 14px;
                padding: 12px;
            }
            .section-title {
                font-size: 14px;
            }
        }

        * {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        button, a, .btn, .clickable {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        input, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <div class="header-left">
            <span class="logo">🌿 Nature<span>+</span></span>
        </div>
        <div class="header-center">
            <a href="/admin/comm.html" class="header-badge">
                <i class="fas fa-truck"></i> Commandes
                <span class="badge-dot" id="headerBadgeCommandes">0</span>
            </a>
            <a href="/admin/wave.html" class="header-badge">
                <i class="fas fa-water"></i> Wave
                <span class="badge-dot" id="headerBadgeWave">0</span>
            </a>
            <a href="/admin/paiements.html" class="header-badge">
                <i class="fas fa-credit-card"></i> Paiements
                <span class="badge-dot" id="headerBadgePayments">0</span>
            </a>
        </div>
        <div class="header-right">
            <span class="admin-name" id="adminName">Admin</span>
            <a href="/admin/dashboard" class="btn-back" title="Retour">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
        </div>
    </header>

    <div class="page-container">

        <div class="page-header">
            <div class="page-title">
                <i class="fas fa-plus-circle" id="pageIcon"></i>
                <span id="pageTitle">Ajouter un produit</span>
            </div>
        </div>

        <form id="addProductForm" class="form-card" enctype="multipart/form-data">

            <!-- ============================================================= -->
            <!-- SECTION 1 : INFORMATIONS GÉNÉRALES                            -->
            <!-- ============================================================= -->
            <hr class="section-divider">
            <div class="section-title"><i class="fas fa-info-circle"></i> Informations générales</div>

            <div class="form-row">
                <div class="form-group">
                    <label>Nom du produit <span class="required">*</span></label>
                    <input type="text" id="productName" placeholder="Ex: Jus de gingembre" required />
                </div>
                <div class="form-group">
                    <label>Prix (FCFA) <span class="required">*</span></label>
                    <input type="number" id="productPrice" placeholder="Ex: 500" required min="1" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Quantité en stock</label>
                    <input type="number" id="productQuantity" placeholder="Ex: 50" value="0" min="0" />
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <input type="text" id="productCategorie" placeholder="Ex: Boisson, Aliment, Cosmétique..." />
                </div>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="productDescription" placeholder="Brève description du produit..." rows="2"></textarea>
            </div>

            <!-- ============================================================= -->
            <!-- SECTION 2 : IMAGES                                            -->
            <!-- ============================================================= -->
            <hr class="section-divider">
            <div class="section-title"><i class="fas fa-image"></i> Images</div>

            <div class="form-row">
                <div class="form-group">
                    <label>Image 1 <span class="required">*</span></label>
                    <input type="file" id="productImage1" accept="image/*" />
                    <div class="image-preview-container">
                        <div class="preview-box" id="preview1">
                            <div class="placeholder">
                                <i class="fas fa-image"></i>
                                Aperçu
                            </div>
                            <button type="button" class="remove-image" id="remove1" title="Supprimer">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Image 2</label>
                    <input type="file" id="productImage2" accept="image/*" />
                    <div class="image-preview-container">
                        <div class="preview-box" id="preview2">
                            <div class="placeholder">
                                <i class="fas fa-image"></i>
                                Aperçu
                            </div>
                            <button type="button" class="remove-image" id="remove2" title="Supprimer">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ============================================================= -->
            <!-- SECTION 3 : NOUVEAU & PROMOTION                               -->
            <!-- ============================================================= -->
            <hr class="section-divider">
            <div class="section-title"><i class="fas fa-tag"></i> Nouveau &amp; Promotion</div>

            <div class="form-row">
                <div class="form-group">
                    <div class="toggle-group">
                        <input type="checkbox" id="productIsNew" />
                        <label for="productIsNew">⭐ Marquer comme <strong>Nouveau</strong></label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Prix promotionnel</label>
                    <input type="number" id="productPromoPrice" placeholder="Ex: 400" min="0" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date de fin de promotion</label>
                    <input type="date" id="productPromoEndDate" />
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <div style="font-size:12px;color:#9CA3AF;padding:6px 0;">
                        <i class="fas fa-info-circle"></i> Laissez vide pour une durée indéterminée
                    </div>
                </div>
            </div>

            <!-- ============================================================= -->
            <!-- SECTION 4 : INFORMATIONS CLIENT (flex1-8)                    -->
            <!-- ============================================================= -->
            <hr class="section-divider">
            <div class="section-title"><i class="fas fa-users"></i> Informations pour le client</div>

            <div class="form-row">
                <div class="form-group">
                    <label>📏 Taille <span class="hint">(ex: 500ml, 1kg)</span></label>
                    <input type="text" id="productFlex1" placeholder="Ex: 500ml, 1kg, 100g" />
                </div>
                <div class="form-group">
                    <label>📅 Date d'arrivage</label>
                    <input type="text" id="productFlex2" placeholder="Ex: Septembre 2026, Nouvelle récolte" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>🌍 Origine</label>
                    <input type="text" id="productFlex3" placeholder="Ex: Côte d'Ivoire, France, Bio" />
                </div>
                <div class="form-group">
                    <label>📋 Composition / Ingrédients</label>
                    <input type="text" id="productFlex4" placeholder="Ex: Gingembre, eau, sucre de canne" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>💡 Conseils d'utilisation</label>
                    <input type="text" id="productFlex5" placeholder="Ex: À consommer frais, agiter avant..." />
                </div>
                <div class="form-group">
                    <label>❄️ Conservation</label>
                    <input type="text" id="productFlex6" placeholder="Ex: À conserver au frais, 2 semaines" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>📝 Notes supplémentaires</label>
                    <input type="text" id="productFlex7" placeholder="Ex: Certifié bio, sans conservateurs" />
                </div>
                <div class="form-group">
                    <label>🔒 Réservé</label>
                    <input type="text" id="productFlex8" placeholder="Réservé pour usage futur" />
                </div>
            </div>

            <!-- ============================================================= -->
            <!-- SECTION 5 : FOURNISSEUR & PÉREMPTION                         -->
            <!-- ============================================================= -->
            <hr class="section-divider">
            <div class="section-title"><i class="fas fa-truck"></i> Fournisseur &amp; Péremption</div>

            <div class="form-row">
                <div class="form-group">
                    <label>Fournisseur</label>
                    <input type="text" id="productFournisseur" placeholder="Ex: Nature Plus, Producteur local" />
                </div>
                <div class="form-group">
                    <label>Date de péremption</label>
                    <input type="date" id="productDatePeremption" />
                </div>
            </div>

            <!-- ============================================================= -->
            <!-- SUBMIT                                                       -->
            <!-- ============================================================= -->
            <input type="hidden" id="productId" value="" />

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-plus-circle"></i> <span id="submitText">Ajouter le produit</span>
            </button>

            <div id="formMessage" class="form-message"></div>

        </form>

    </div>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script src="/admin/js/admin-common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ add-produit.js chargé');

            // ==========================================
            // RÉFÉRENCES
            // ==========================================

            const form = document.getElementById('addProductForm');
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const pageTitle = document.getElementById('pageTitle');
            const pageIcon = document.getElementById('pageIcon');
            const message = document.getElementById('formMessage');
            const productIdHidden = document.getElementById('productId');

            const nameInput = document.getElementById('productName');
            const priceInput = document.getElementById('productPrice');
            const quantityInput = document.getElementById('productQuantity');
            const descInput = document.getElementById('productDescription');
            const categorieInput = document.getElementById('productCategorie');

            const image1Input = document.getElementById('productImage1');
            const image2Input = document.getElementById('productImage2');
            const preview1 = document.getElementById('preview1');
            const preview2 = document.getElementById('preview2');
            const remove1 = document.getElementById('remove1');
            const remove2 = document.getElementById('remove2');

            const isNewCheck = document.getElementById('productIsNew');
            const promoPriceInput = document.getElementById('productPromoPrice');
            const promoEndDateInput = document.getElementById('productPromoEndDate');

            const flex1 = document.getElementById('productFlex1');
            const flex2 = document.getElementById('productFlex2');
            const flex3 = document.getElementById('productFlex3');
            const flex4 = document.getElementById('productFlex4');
            const flex5 = document.getElementById('productFlex5');
            const flex6 = document.getElementById('productFlex6');
            const flex7 = document.getElementById('productFlex7');
            const flex8 = document.getElementById('productFlex8');

            const fournisseurInput = document.getElementById('productFournisseur');
            const datePeremptionInput = document.getElementById('productDatePeremption');

            let image1Data = null;
            let image2Data = null;
            let isEditMode = false;
            let existingImage1 = '';
            let existingImage2 = '';

            // ==========================================
            // DÉTECTION DU MODE ÉDITION
            // ==========================================

            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('id');

            if (editId) {
                isEditMode = true;
                productIdHidden.value = editId;
                pageTitle.textContent = 'Modifier un produit';
                pageIcon.className = 'fas fa-edit';
                submitText.textContent = 'Mettre à jour le produit';
                submitBtn.classList.add('edit-mode');
                loadProduct(editId);
            }

            // ==========================================
            // CHARGER LE PRODUIT POUR ÉDITION
            // ==========================================

            async function loadProduct(id) {
                try {
                    const res = await fetch('/api/admin/products');
                    const data = await res.json();

                    if (!res.ok) throw new Error('Erreur chargement');

                    const product = data.find(p => p.id == id);
                    if (!product) {
                        showMessage('❌ Produit non trouvé.', 'error');
                        return;
                    }

                    // Remplir les champs
                    nameInput.value = product.name || '';
                    priceInput.value = product.price || '';
                    quantityInput.value = product.quantity || 0;
                    descInput.value = product.description || '';
                    categorieInput.value = product.categorie || '';

                    isNewCheck.checked = product.is_new === true;
                    promoPriceInput.value = product.promo_price || '';
                    promoEndDateInput.value = product.promo_end_date || '';

                    flex1.value = product.flex1 || '';
                    flex2.value = product.flex2 || '';
                    flex3.value = product.flex3 || '';
                    flex4.value = product.flex4 || '';
                    flex5.value = product.flex5 || '';
                    flex6.value = product.flex6 || '';
                    flex7.value = product.flex7 || '';
                    flex8.value = product.flex8 || '';

                    fournisseurInput.value = product.fournisseur || '';
                    datePeremptionInput.value = product.date_peremption || '';

                    // Images existantes
                    existingImage1 = product.image1 || '';
                    existingImage2 = product.image2 || '';

                    if (existingImage1) {
                        preview1.innerHTML = `<img src="${existingImage1}" alt="Image 1" />`;
                        preview1.classList.add('has-image');
                        image1Data = { data: existingImage1, file: null };
                    }

                    if (existingImage2) {
                        preview2.innerHTML = `<img src="${existingImage2}" alt="Image 2" />`;
                        preview2.classList.add('has-image');
                        image2Data = { data: existingImage2, file: null };
                    }

                    showMessage('✅ Produit chargé pour modification.', 'info');

                } catch (error) {
                    console.error('Erreur:', error);
                    showMessage('❌ Erreur de chargement du produit.', 'error');
                }
            }

            // ==========================================
            // APERÇU DES IMAGES
            // ==========================================

            function handleImagePreview(input, previewBox, removeBtn, imageDataObj) {
                const file = input.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    previewBox.innerHTML = '';
                    previewBox.appendChild(img);
                    previewBox.classList.add('has-image');
                    imageDataObj.data = e.target.result;
                    imageDataObj.file = file;
                };
                reader.readAsDataURL(file);
            }

            image1Input.addEventListener('change', function() {
                handleImagePreview(this, preview1, remove1, { data: image1Data, file: null });
            });

            image2Input.addEventListener('change', function() {
                handleImagePreview(this, preview2, remove2, { data: image2Data, file: null });
            });

            function clearPreview(previewBox, input) {
                previewBox.innerHTML = `
                    <div class="placeholder">
                        <i class="fas fa-image"></i>
                        Aperçu
                    </div>
                `;
                previewBox.classList.remove('has-image');
                input.value = '';
            }

            remove1.addEventListener('click', function(e) {
                e.stopPropagation();
                clearPreview(preview1, image1Input);
                image1Data = null;
                existingImage1 = '';
            });

            remove2.addEventListener('click', function(e) {
                e.stopPropagation();
                clearPreview(preview2, image2Input);
                image2Data = null;
                existingImage2 = '';
            });

            // ==========================================
            // AFFICHER UN MESSAGE
            // ==========================================

            function showMessage(text, type) {
                message.textContent = text;
                message.className = 'form-message ' + type;
            }

            function hideMessage() {
                message.className = 'form-message';
                message.textContent = '';
            }

            // ==========================================
            // SOUMISSION DU FORMULAIRE
            // ==========================================

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideMessage();

                const name = nameInput.value.trim();
                const price = parseInt(priceInput.value);
                const quantity = parseInt(quantityInput.value) || 0;
                const description = descInput.value.trim();
                const categorie = categorieInput.value.trim();

                const isNew = isNewCheck.checked;
                const promoPrice = promoPriceInput.value ? parseInt(promoPriceInput.value) : null;
                const promoEndDate = promoEndDateInput.value || null;

                const f1 = flex1.value.trim();
                const f2 = flex2.value.trim();
                const f3 = flex3.value.trim();
                const f4 = flex4.value.trim();
                const f5 = flex5.value.trim();
                const f6 = flex6.value.trim();
                const f7 = flex7.value.trim();
                const f8 = flex8.value.trim();

                const fournisseur = fournisseurInput.value.trim();
                const datePeremption = datePeremptionInput.value || null;

                // ✅ Validation
                if (!name) {
                    showMessage('⚠️ Veuillez entrer un nom de produit.', 'error');
                    nameInput.focus();
                    return;
                }

                if (!price || price <= 0) {
                    showMessage('⚠️ Veuillez entrer un prix valide.', 'error');
                    priceInput.focus();
                    return;
                }

                const image1 = image1Input.files[0];
                const image2 = image2Input.files[0];

                // ✅ Vérifier qu'au moins une image est présente (nouvelle ou existante)
                if (!image1 && !existingImage1) {
                    showMessage('⚠️ Veuillez sélectionner une image 1.', 'error');
                    image1Input.focus();
                    return;
                }

                // ✅ Désactiver le bouton
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + (isEditMode ? 'Mise à jour...' : 'Envoi en cours...');

                // ✅ Construire FormData
                const formData = new FormData();
                formData.append('name', name);
                formData.append('price', price);
                formData.append('quantity', quantity);
                formData.append('description', description);
                formData.append('categorie', categorie);

                formData.append('is_new', isNew ? 'true' : 'false');
                if (promoPrice) formData.append('promo_price', promoPrice);
                if (promoEndDate) formData.append('promo_end_date', promoEndDate);

                formData.append('flex1', f1);
                formData.append('flex2', f2);
                formData.append('flex3', f3);
                formData.append('flex4', f4);
                formData.append('flex5', f5);
                formData.append('flex6', f6);
                formData.append('flex7', f7);
                formData.append('flex8', f8);

                if (fournisseur) formData.append('fournisseur', fournisseur);
                if (datePeremption) formData.append('date_peremption', datePeremption);

                // Images
                if (image1) formData.append('image1', image1);
                if (image2) formData.append('image2', image2);

                const url = isEditMode ? `/api/admin/products/${editId}` : '/api/admin/products';
                const method = isEditMode ? 'PUT' : 'POST';

                try {
                    const res = await fetch(url, {
                        method: method,
                        body: formData
                    });

                    const data = await res.json();

                    if (res.ok) {
                        showMessage(isEditMode ? '✅ Produit modifié avec succès !' : '✅ Produit ajouté avec succès !', 'success');

                        setTimeout(() => {
                            window.location.href = '/admin/dashboard';
                        }, 1500);
                    } else {
                        showMessage('❌ ' + (data.error || 'Erreur lors de l\'opération.'), 'error');
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    showMessage('❌ Erreur de connexion au serveur.', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-plus-circle"></i> ' + (isEditMode ? 'Mettre à jour' : 'Ajouter le produit');
                }
            });

            // ==========================================
            // NOM ADMIN
            // ==========================================

            const adminName = localStorage.getItem('adminName') || 'Admin';
            document.getElementById('adminName').textContent = adminName;

            console.log('✅ add-produit.html initialisé' + (isEditMode ? ' (mode édition)' : ''));
        });
    </script>

</body>
</html>
