<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Admin | Nature+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/register.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-header">
                <h1>🚀 <span>Inscription Admin</span></h1>
                <p class="subtitle">Créez votre compte administrateur</p>
            </div>

            <form id="registerForm" class="auth-form">

                <div class="form-group">
                    <label for="merchantName">Nom du marchand</label>
                    <input type="text" id="merchantName" placeholder="Ma Boutique" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="admin@natureplus.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="contact">Contact (WhatsApp)</label>
                    <input type="text" id="contact" placeholder="+225 05 00 00 00 00">
                </div>

                <div class="form-group">
                    <label for="logo">Logo (URL)</label>
                    <input type="url" id="logo" placeholder="https://exemple.com/logo.png">
                </div>

                <button type="submit" class="btn-primary">S'inscrire</button>

                <div id="message" class="message"></div>

            </form>

            <p class="auth-footer">
                Déjà inscrit ? <a href="/admin/html/login.html">Se connecter</a>
            </p>

        </div>
    </div>

    <script src="/admin/js/register.js"></script>
</body>
</html>
