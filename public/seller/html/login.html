<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connexion Vendeur | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/seller/css/login.css">
</head>
<body>

    <!-- HEADER -->
    <header class="login-header">
        <button class="back-btn" onclick="window.location.href='/register'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="header-title">🛒 ComPlus Vendeur</span>
    </header>

    <!-- ZONE CENTRALE -->
    <main class="login-main">

        <!-- CADRE TÉLÉPHONE -->
        <div class="form-card">
            <div class="form-group">
                <label for="phoneInput">
                    <i class="fas fa-phone"></i> Numéro de téléphone
                </label>
                <div class="input-wrapper">
                    <span class="input-prefix">+225</span>
                    <input type="tel" id="phoneInput" class="phone-input"
                           placeholder="05 03 58 83 36" maxlength="10" inputmode="numeric" />
                    <span id="phoneStatus" class="input-status"></span>
                </div>
            </div>
        </div>

        <!-- CADRE CODE SECRET -->
        <div class="form-card">
            <div class="form-group">
                <label for="passwordInput">
                    <i class="fas fa-lock"></i> Code secret (4 chiffres)
                </label>
                <div class="input-wrapper password-wrapper">
                    <input type="password" id="passwordInput"
                           placeholder="••••" maxlength="4" inputmode="numeric" />
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                    <span id="passwordStatus" class="input-status"></span>
                </div>
            </div>
        </div>

        <!-- MESSAGE D'ERREUR -->
        <div id="message" class="message"></div>

    </main>

    <!-- PAVÉ NUMÉRIQUE -->
    <div class="pave-container">
        <div class="pave pave-round">
            <button class="num-btn" data-value="1">1</button>
            <button class="num-btn" data-value="2">2</button>
            <button class="num-btn" data-value="3">3</button>
            <button class="num-btn" data-value="4">4</button>
            <button class="num-btn" data-value="5">5</button>
            <button class="num-btn" data-value="6">6</button>
            <button class="num-btn" data-value="7">7</button>
            <button class="num-btn" data-value="8">8</button>
            <button class="num-btn" data-value="9">9</button>
            <button class="num-btn btn-zero" data-value="0">0</button>
            <button class="num-btn btn-clear" id="clearBtn">
                <i class="fas fa-delete-left"></i>
            </button>
        </div>
    </div>

    <script src="/seller/js/login.js"></script>
</body>
</html>
