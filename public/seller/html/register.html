<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Vendeur | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/seller/css/register.css">
</head>
<body>

    <!-- ========================================= -->
    <!-- CONTENEUR PRINCIPAL                       -->
    <!-- ========================================= -->
    <div class="register-container">

        <!-- ===== TEXTE DE BIENVENUE ===== -->
        <div class="welcome-section">
            <div class="welcome-icon">🛒</div>
            <h1>Bienvenue sur <span>ComPlus</span></h1>
            <p>Créez votre boutique, affichez vos produits pour obtenir plus de visibilité.</p>
            <p class="sub">Créez un compte pour commencer...</p>
        </div>

        <!-- ========================================= -->
        <!-- CADRE 1 : TÉLÉPHONE                       -->
        <!-- ========================================= -->
        <div class="form-card">
            <div class="form-group">
                <label for="phoneInput">
                    <i class="fas fa-phone"></i> Numéro de téléphone
                </label>
                <div class="input-wrapper">
                    <span class="input-prefix">+225</span>
                    <input type="tel" id="phoneInput" class="phone-input" 
                           placeholder="05 03 58 83 36" maxlength="10" inputmode="numeric" />
                    <span id="phoneStatus" class="input-status"></span>
                </div>
                <div class="input-hint">10 chiffres (ex: 0503588336)</div>
            </div>
        </div>

        <!-- ========================================= -->
        <!-- CADRE 2 : NOM COMPLET                     -->
        <!-- ========================================= -->
        <div class="form-card">
            <div class="form-group">
                <label for="nameInput">
                    <i class="fas fa-user"></i> Nom complet
                </label>
                <div class="input-wrapper">
                    <input type="text" id="nameInput" placeholder="Jean Dupont" autocomplete="name" />
                    <span id="nameStatus" class="input-status"></span>
                </div>
            </div>
        </div>

        <!-- ========================================= -->
        <!-- CADRE 3 : EMAIL (optionnel)               -->
        <!-- ========================================= -->
        <div class="form-card">
            <div class="form-group">
                <label for="emailInput">
                    <i class="fas fa-envelope"></i> Email <span class="optional">(optionnel)</span>
                </label>
                <div class="input-wrapper">
                    <input type="email" id="emailInput" placeholder="exemple@email.com" autocomplete="email" />
                    <span id="emailStatus" class="input-status"></span>
                </div>
            </div>
        </div>

        <!-- ========================================= -->
        <!-- CADRE 4 : CODE SECRET (4 chiffres)        -->
        <!-- ========================================= -->
        <div class="form-card">
            <div class="form-group">
                <label for="passwordInput">
                    <i class="fas fa-lock"></i> Code secret
                </label>
                <div class="input-wrapper">
                    <input type="password" id="passwordInput" 
                           placeholder="••••" maxlength="4" inputmode="numeric" />
                    <span id="passwordStatus" class="input-status"></span>
                </div>
                <div class="input-hint">4 chiffres</div>
            </div>
        </div>

        <!-- ========================================= -->
        <!-- CADRE 5 : CONFIRMATION CODE               -->
        <!-- ========================================= -->
        <div class="form-card">
            <div class="form-group">
                <label for="confirmInput">
                    <i class="fas fa-check-circle"></i> Confirmer le code
                </label>
                <div class="input-wrapper">
                    <input type="password" id="confirmInput" 
                           placeholder="••••" maxlength="4" inputmode="numeric" />
                    <span id="confirmStatus" class="input-status"></span>
                </div>
            </div>
        </div>

        <!-- ===== BOUTON CRÉER ===== -->
        <button type="submit" class="btn-register" id="registerBtn" disabled>
            <i class="fas fa-user-plus"></i> Créer mon compte
        </button>

        <!-- ===== MESSAGE ===== -->
        <div id="message" class="message"></div>

        <!-- ===== LIEN LOGIN ===== -->
        <p class="login-link">
            Déjà inscrit ? <a href="/login">Se connecter</a>
        </p>

    </div>

    <script src="/seller/js/register.js"></script>
</body>
</html>
