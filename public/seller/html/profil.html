<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon profil | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
        }

        /* ===== HEADER ===== */
        .profil-header {
            background: #17A464;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 2px 10px rgba(23, 164, 100, 0.2);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .profil-header .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .profil-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.05);
        }

        .profil-header .header-title {
            flex: 1;
            font-size: 18px;
            font-weight: 700;
            color: white;
            text-align: center;
        }

        .profil-header .save-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .profil-header .save-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.02);
        }

        .profil-header .save-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== MAIN ===== */
        .profil-main {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 20px 20px;
        }

        .profil-main::-webkit-scrollbar {
            width: 4px;
        }

        .profil-main::-webkit-scrollbar-thumb {
            background: #d0d0da;
            border-radius: 10px;
        }

        /* ===== AVATAR ===== */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar-wrapper {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(23, 164, 100, 0.2);
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-wrapper .avatar-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.05);
        }

        /* ===== CARD ===== */
        .profile-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 18px 20px 20px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 12px;
        }

        .profile-card .card-title {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-card .card-title i {
            color: #17A464;
        }

        .info-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .icon {
            width: 32px;
            color: #17A464;
            font-size: 16px;
            flex-shrink: 0;
        }

        .info-row .label {
            font-size: 13px;
            font-weight: 500;
            color: #6B7280;
            width: 100px;
            flex-shrink: 0;
        }

        .info-row .value {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            word-break: break-word;
        }

        .info-row .value input {
            width: 100%;
            padding: 6px 10px;
            border: 2px solid #e8ecf4;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            background: rgba(255, 255, 255, 0.5);
            outline: none;
            transition: all 0.3s;
        }

        .info-row .value input:focus {
            border-color: #17A464;
            background: white;
            box-shadow: 0 0 0 4px rgba(23, 164, 100, 0.06);
        }

        /* ===== BOUTON DÉCONNEXION ===== */
        .logout-section {
            margin-top: 4px;
        }

        .btn-logout {
            width: 100%;
            padding: 14px;
            background: rgba(220, 38, 38, 0.12);
            color: #DC2626;
            border: 1px solid rgba(220, 38, 38, 0.15);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-logout:hover {
            background: rgba(220, 38, 38, 0.2);
            transform: scale(1.01);
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: #6B7280;
        }

        .loading-spinner i {
            font-size: 28px;
            margin-right: 12px;
            color: #17A464;
        }

        /* ========================================== */
        /* TOAST                                      */
        /* ========================================== */

        .toast-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: #17A464;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 8px 30px rgba(23, 164, 100, 0.3);
            animation: slideUp 0.3s ease;
            pointer-events: auto;
            max-width: 90%;
            text-align: center;
        }

        .toast.error {
            background: #DC2626;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */

        @media (max-width: 768px) {
            .profil-header {
                padding: 10px 14px;
                gap: 10px;
                border-radius: 0 0 16px 16px;
            }

            .profil-header .back-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

            .profil-header .header-title {
                font-size: 16px;
            }

            .profil-header .save-btn {
                font-size: 12px;
                padding: 6px 14px;
            }

            .profil-main {
                padding: 12px 14px 14px 14px;
            }

            .info-row {
                flex-wrap: wrap;
                gap: 4px;
            }

            .info-row .label {
                width: 80px;
                font-size: 12px;
            }

            .info-row .value {
                font-size: 14px;
            }

            .avatar-wrapper {
                width: 75px;
                height: 75px;
            }
        }

        @media (max-width: 480px) {
            .profil-header {
                padding: 8px 10px;
                gap: 8px;
                border-radius: 0 0 14px 14px;
            }

            .profil-header .back-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }

            .profil-header .header-title {
                font-size: 14px;
            }

            .profil-header .save-btn {
                font-size: 11px;
                padding: 4px 10px;
            }

            .profil-main {
                padding: 8px 10px 10px 10px;
            }

            .profile-card {
                padding: 14px 14px 16px 14px;
                border-radius: 16px;
            }

            .info-row .label {
                width: 70px;
                font-size: 11px;
            }

            .info-row .value {
                font-size: 13px;
            }

            .avatar-wrapper {
                width: 65px;
                height: 65px;
            }

            .avatar-wrapper .avatar-placeholder {
                font-size: 28px;
            }

            .btn-logout {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- HEADER                                     -->
    <!-- ========================================== -->
    <header class="profil-header">
        <button class="back-btn" onclick="window.location.href='/dashboard'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="header-title">👤 Mon profil</span>
        <button class="save-btn" id="saveBtn">
            <i class="fas fa-save"></i> Enregistrer
        </button>
    </header>

    <!-- ========================================== -->
    <!-- MAIN                                       -->
    <!-- ========================================== -->
    <main class="profil-main" id="profilMain">

        <!-- ===== LOADING ===== -->
        <div class="loading-spinner" id="loadingSpinner">
            <i class="fas fa-spinner fa-spin"></i>
            <span>Chargement...</span>
        </div>

        <!-- ===== CONTENU ===== -->
        <div id="profilContent" style="display:none;">

            <!-- AVATAR -->
            <div class="avatar-section">
                <div class="avatar-wrapper" id="avatarWrapper">
                    <div class="avatar-placeholder" id="avatarPlaceholder">
                        <i class="fas fa-user"></i>
                    </div>
                    <img id="avatarImage" style="display:none;" alt="Avatar" />
                </div>
            </div>

            <!-- CARD : INFOS -->
            <div class="profile-card">
                <div class="card-title"><i class="fas fa-id-card"></i> Mes informations</div>

                <div class="info-row">
                    <span class="icon"><i class="fas fa-user-circle"></i></span>
                    <span class="label">Nom</span>
                    <span class="value" id="displayName">-</span>
                </div>

                <div class="info-row">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <span class="label">Email</span>
                    <span class="value" id="displayEmail">-</span>
                </div>

                <div class="info-row">
                    <span class="icon"><i class="fas fa-phone"></i></span>
                    <span class="label">Téléphone</span>
                    <span class="value">
                        <input type="tel" id="editPhone" placeholder="05 03 58 83 36" />
                    </span>
                </div>

                <div class="info-row">
                    <span class="icon"><i class="fas fa-map-pin"></i></span>
                    <span class="label">Localisation</span>
                    <span class="value" id="displayLocation">-</span>
                </div>
            </div>

            <!-- DÉCONNEXION -->
            <div class="logout-section">
                <button class="btn-logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Se déconnecter
                </button>
            </div>

        </div>

    </main>

    <!-- ========================================== -->
    <!-- TOAST                                      -->
    <!-- ========================================== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ Profil vendeur - Version simplifiée');

            // ==========================================
            // RÉFÉRENCES
            // ==========================================

            const loadingSpinner = document.getElementById('loadingSpinner');
            const profilContent = document.getElementById('profilContent');

            const displayName = document.getElementById('displayName');
            const displayEmail = document.getElementById('displayEmail');
            const displayLocation = document.getElementById('displayLocation');
            const editPhone = document.getElementById('editPhone');

            const avatarPlaceholder = document.getElementById('avatarPlaceholder');
            const avatarImage = document.getElementById('avatarImage');

            const saveBtn = document.getElementById('saveBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const toastContainer = document.getElementById('toastContainer');

            let currentSeller = {};

            // ==========================================
            // TOAST
            // ==========================================

            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = 'toast' + (type === 'error' ? ' error' : '');
                toast.textContent = message;
                toastContainer.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-20px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            // ==========================================
            // AUTH
            // ==========================================

            function getToken() {
                return localStorage.getItem('sellerToken');
            }

            function checkAuth() {
                const token = getToken();
                if (!token) {
                    window.location.href = '/login';
                    return false;
                }
                return true;
            }

            // ==========================================
            // CHARGER LE PROFIL
            // ==========================================

            async function loadProfile() {
                const token = getToken();
                if (!token) return;

                try {
                    const res = await fetch('/api/seller/me', {
                        headers: {
                            'Authorization': 'Bearer ' + token
                        }
                    });

                    if (!res.ok) {
                        throw new Error('Erreur chargement profil');
                    }

                    const data = await res.json();

                    if (data.success && data.seller) {
                        currentSeller = data.seller;

                        displayName.textContent = currentSeller.name || '-';
                        displayEmail.textContent = currentSeller.email || '-';
                        editPhone.value = currentSeller.phone || '';

                        // Localisation : flex1 + flex2
                        const loc = [currentSeller.flex1, currentSeller.flex2].filter(Boolean).join(', ');
                        displayLocation.textContent = loc || 'Non renseignée';

                        // Avatar
                        const avatarUrl = currentSeller.flex7 || '';
                        if (avatarUrl && avatarUrl !== 'null') {
                            avatarImage.src = avatarUrl;
                            avatarImage.style.display = 'block';
                            avatarPlaceholder.style.display = 'none';
                        } else {
                            avatarImage.style.display = 'none';
                            avatarPlaceholder.style.display = 'flex';
                        }

                        console.log('✅ Profil chargé:', currentSeller);
                    }

                } catch (error) {
                    console.error('❌ Erreur chargement profil:', error);
                    showToast('❌ Erreur de chargement', 'error');
                } finally {
                    loadingSpinner.style.display = 'none';
                    profilContent.style.display = 'block';
                }
            }

            // ==========================================
            // ENREGISTRER LE TÉLÉPHONE
            // ==========================================

            saveBtn.addEventListener('click', async function() {
                const token = getToken();
                if (!token) return;

                const phone = editPhone.value.trim();

                if (!phone) {
                    showToast('⚠️ Veuillez entrer un numéro de téléphone', 'error');
                    return;
                }

                saveBtn.disabled = true;
                saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enregistrement...';

                try {
                    const res = await fetch('/api/seller/me', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify({
                            phone: phone
                        })
                    });

                    if (!res.ok) {
                        throw new Error('Erreur lors de l\'enregistrement');
                    }

                    const result = await res.json();

                    if (result.success) {
                        showToast('✅ Téléphone mis à jour !');
                        currentSeller.phone = phone;
                        localStorage.setItem('sellerPhone', phone);
                    } else {
                        throw new Error(result.error || 'Erreur');
                    }

                } catch (error) {
                    console.error('❌ Erreur enregistrement:', error);
                    showToast('❌ ' + error.message, 'error');
                }

                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save"></i> Enregistrer';
            });

            // ==========================================
            // DÉCONNEXION
            // ==========================================

            logoutBtn.addEventListener('click', function() {
                if (confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
                    localStorage.clear();
                    window.location.href = '/login';
                }
            });

            // ==========================================
            // INITIALISATION
            // ==========================================

            if (!checkAuth()) return;

            (async function init() {
                await loadProfile();
                console.log('✅ Profil vendeur - Prêt');
            })();

        });
    </script>

</body>
</html>
