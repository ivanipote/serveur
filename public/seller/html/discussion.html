<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discussion | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
        }

        /* ===== HEADER ===== */
        .page-header {
            background: #17A464;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 2px 10px rgba(23, 164, 100, 0.2);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .page-header .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .page-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.05);
        }

        .page-header .header-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .page-header .header-info .shop-name {
            font-size: 15px;
            font-weight: 700;
        }

        .page-header .header-info .user-name {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
        }

        .page-header .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            flex-shrink: 0;
        }

        /* ===== MAIN ===== */
        .page-main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .page-main::-webkit-scrollbar {
            width: 4px;
        }
        .page-main::-webkit-scrollbar-thumb {
            background: #d0d0da;
            border-radius: 10px;
        }

        /* ===== MESSAGES ===== */
        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            align-self: flex-end;
            background: #17A464;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: white;
            color: #1a1a2e;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .message .msg-time {
            font-size: 10px;
            opacity: 0.7;
            display: block;
            margin-top: 4px;
            text-align: right;
        }

        .message.sent .msg-time {
            color: rgba(255, 255, 255, 0.8);
        }

        .message.received .msg-time {
            color: #9CA3AF;
        }

        .message .msg-sender {
            font-size: 11px;
            font-weight: 600;
            display: block;
            margin-bottom: 2px;
        }

        .message.sent .msg-sender {
            color: rgba(255, 255, 255, 0.85);
        }

        .message.received .msg-sender {
            color: #17A464;
        }

        /* ===== CARTE PRODUIT DANS LE MESSAGE ===== */
        .message.product-card-msg {
            align-self: center;
            max-width: 90%;
            background: white;
            border-radius: 20px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f3;
            width: 100%;
            max-width: 320px;
        }

        .message.product-card-msg .product-card-inner {
            display: flex;
            gap: 14px;
            padding: 12px 14px;
            align-items: center;
        }

        .message.product-card-msg .product-card-inner .product-img {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            object-fit: contain;
            background: #f0f2f5;
            flex-shrink: 0;
        }

        .message.product-card-msg .product-card-inner .product-info {
            flex: 1;
            min-width: 0;
        }

        .message.product-card-msg .product-card-inner .product-info .p-name {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a2e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message.product-card-msg .product-card-inner .product-info .p-price {
            font-size: 16px;
            font-weight: 800;
            color: #17A464;
        }

        .message.product-card-msg .product-card-inner .product-info .p-stock {
            font-size: 11px;
            color: #6B7280;
        }

        .message.product-card-msg .product-card-inner .product-info .p-link {
            display: inline-block;
            margin-top: 4px;
            font-size: 12px;
            color: #1a2a6c;
            text-decoration: none;
            font-weight: 600;
        }

        .message.product-card-msg .product-card-inner .product-info .p-link:hover {
            text-decoration: underline;
        }

        .message.product-card-msg .msg-time {
            padding: 4px 14px 10px 14px;
            text-align: right;
            border-top: 1px solid #f5f5f8;
            color: #9CA3AF;
            font-size: 10px;
        }

        /* ===== DATE SEPARATOR ===== */
        .date-separator {
            text-align: center;
            font-size: 11px;
            color: #9CA3AF;
            padding: 8px 0;
            position: relative;
        }

        .date-separator span {
            background: #f0f2f5;
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-block;
        }

        /* ===== SKELETON ===== */
        .skeleton-msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            background: white;
            animation: shimmer 1.5s infinite;
            opacity: 0.6;
        }

        .skeleton-msg.sent-skel {
            align-self: flex-end;
            background: #d4edda;
        }

        .skeleton-msg.received-skel {
            align-self: flex-start;
            background: #e8e8f0;
        }

        @keyframes shimmer {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }

        /* ===== FOOTER ===== */
        .page-footer {
            background: white;
            padding: 10px 16px 14px 16px;
            border-top: 1px solid #f0f2f5;
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .page-footer .btn-attach {
            background: none;
            border: none;
            color: #9CA3AF;
            font-size: 22px;
            cursor: pointer;
            padding: 6px;
            transition: color 0.2s;
            flex-shrink: 0;
        }

        .page-footer .btn-attach:hover {
            color: #17A464;
        }

        .page-footer .message-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e8ecf4;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .page-footer .message-input:focus {
            border-color: #17A464;
        }

        .page-footer .btn-send {
            background: #17A464;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-footer .btn-send:hover {
            background: #0E7A49;
            transform: scale(1.04);
        }

        .page-footer .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */

        @media (max-width: 768px) {
            .page-header {
                padding: 10px 14px;
                gap: 10px;
                border-radius: 0 0 16px 16px;
            }
            .page-header .back-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .page-header .header-info .shop-name {
                font-size: 14px;
            }
            .page-header .header-info .user-name {
                font-size: 11px;
            }
            .page-main {
                padding: 12px;
                gap: 6px;
            }
            .message {
                max-width: 85%;
                font-size: 13px;
                padding: 8px 14px;
            }
            .message.product-card-msg {
                max-width: 95%;
            }
            .message.product-card-msg .product-card-inner {
                padding: 10px 12px;
            }
            .message.product-card-msg .product-card-inner .product-img {
                width: 60px;
                height: 60px;
            }
            .page-footer {
                padding: 8px 12px 12px 12px;
                gap: 6px;
            }
            .page-footer .message-input {
                font-size: 13px;
                padding: 8px 14px;
            }
            .page-footer .btn-send {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }
            .page-footer .btn-attach {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .page-header {
                padding: 8px 10px;
                gap: 8px;
                border-radius: 0 0 14px 14px;
            }
            .page-header .back-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .page-header .header-info .shop-name {
                font-size: 13px;
            }
            .page-header .header-info .user-name {
                font-size: 10px;
            }
            .page-main {
                padding: 8px;
                gap: 4px;
            }
            .message {
                max-width: 90%;
                font-size: 12px;
                padding: 6px 12px;
                border-radius: 12px;
            }
            .message .msg-time {
                font-size: 9px;
            }
            .message.product-card-msg .product-card-inner {
                padding: 8px 10px;
                gap: 10px;
            }
            .message.product-card-msg .product-card-inner .product-img {
                width: 50px;
                height: 50px;
            }
            .message.product-card-msg .product-card-inner .product-info .p-name {
                font-size: 12px;
            }
            .message.product-card-msg .product-card-inner .product-info .p-price {
                font-size: 14px;
            }
            .date-separator {
                font-size: 10px;
            }
            .page-footer {
                padding: 6px 8px 10px 8px;
                gap: 4px;
            }
            .page-footer .message-input {
                font-size: 12px;
                padding: 6px 12px;
            }
            .page-footer .btn-send {
                width: 34px;
                height: 34px;
                font-size: 13px;
            }
            .page-footer .btn-attach {
                font-size: 16px;
                padding: 4px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="page-header">
        <button class="back-btn" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="header-info">
            <span class="shop-name" id="shopName">🛒 Boutique</span>
            <span class="user-name" id="userName">👤 Utilisateur</span>
        </div>
        <span class="status-dot"></span>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="page-main" id="pageMain">

        <!-- DATE SEPARATOR -->
        <div class="date-separator"><span>Aujourd'hui</span></div>

        <!-- Les messages seront injectés par JS -->

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="page-footer">
        <button class="btn-attach" id="attachBtn" title="Joindre un produit">
            <i class="fas fa-paperclip"></i>
        </button>
        <input type="text" class="message-input" id="messageInput" placeholder="Écrire un message..." />
        <button class="btn-send" id="sendBtn">
            <i class="fas fa-paper-plane"></i>
        </button>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ Discussion - Version connectée');

            // ==========================================
            // RÉFÉRENCES
            // ==========================================

            const pageMain = document.getElementById('pageMain');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const attachBtn = document.getElementById('attachBtn');
            const shopNameEl = document.getElementById('shopName');
            const userNameEl = document.getElementById('userName');

            const SELLER_API_URL = 'https://nature-plus-seller.onrender.com';
            const USERNAME_KEY = 'complus_username';

            let shopId = null;
            let username = null;
            let messages = [];
            let syncInterval = null;
            let isSyncing = false;

            // ==========================================
            // RÉCUPÉRER LES PARAMÈTRES
            // ==========================================

            const urlParams = new URLSearchParams(window.location.search);
            shopId = urlParams.get('shop');
            username = urlParams.get('user');

            // Vérifier si un produit a été sélectionné
            const productId = urlParams.get('product');

            if (!shopId || !username) {
                shopNameEl.textContent = '🛒 Discussion';
                userNameEl.textContent = '👤 Utilisateur';
                console.warn('⚠️ Paramètres manquants: shop et user requis');
            } else {
                shopNameEl.textContent = '🛒 Boutique #' + shopId;
                userNameEl.textContent = '👤 ' + username;
            }

            // ==========================================
            // CHARGER LES MESSAGES
            // ==========================================

            async function loadMessages() {
                if (isSyncing) return;
                isSyncing = true;

                try {
                    const res = await fetch(SELLER_API_URL + '/api/seller/messages?shop_id=' + shopId + '&username=' + encodeURIComponent(username));

                    if (!res.ok) {
                        throw new Error('Erreur chargement messages');
                    }

                    const data = await res.json();

                    if (data.success && data.messages) {
                        messages = data.messages;
                        renderMessages();

                        // Si un produit a été sélectionné, afficher la carte
                        if (productId) {
                            displayProductCard(productId);
                        }
                    }

                } catch (error) {
                    console.error('❌ Erreur chargement messages:', error);
                } finally {
                    isSyncing = false;
                }
            }

            // ==========================================
            // AFFICHER LES MESSAGES
            // ==========================================

            function renderMessages() {
                if (messages.length === 0) {
                    // Pas de messages, on garde le date separator
                    return;
                }

                // Supprimer les anciens messages (garder le date separator)
                const separator = pageMain.querySelector('.date-separator');
                pageMain.innerHTML = '';
                if (separator) {
                    pageMain.appendChild(separator);
                } else {
                    const newSep = document.createElement('div');
                    newSep.className = 'date-separator';
                    newSep.innerHTML = '<span>Aujourd\'hui</span>';
                    pageMain.appendChild(newSep);
                }

                messages.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message ' + (msg.is_from_seller ? 'received' : 'sent');

                    const sender = msg.is_from_seller ? '🛒 Vendeur' : '👤 Vous';
                    const time = new Date(msg.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

                    msgDiv.innerHTML = `
                        <span class="msg-sender">${sender}</span>
                        ${msg.message}
                        <span class="msg-time">${time}</span>
                    `;

                    pageMain.appendChild(msgDiv);
                });

                // Scroller en bas
                setTimeout(() => {
                    pageMain.scrollTop = pageMain.scrollHeight;
                }, 100);
            }

            // ==========================================
            // AFFICHER LA CARTE PRODUIT
            // ==========================================

            async function displayProductCard(productId) {
                try {
                    const res = await fetch(SELLER_API_URL + '/api/seller/product/' + productId);
                    const data = await res.json();

                    if (!data.success || !data.product) {
                        console.warn('Produit non trouvé');
                        return;
                    }

                    const p = data.product;

                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'message product-card-msg';

                    const imgSrc = p.image1 || 'https://via.placeholder.com/70/cccccc/ffffff?text=📦';

                    cardDiv.innerHTML = `
                        <div class="product-card-inner">
                            <img src="${imgSrc}" alt="${p.name}" class="product-img" loading="lazy" />
                            <div class="product-info">
                                <div class="p-name">${p.name}</div>
                                <div class="p-price">${p.price.toLocaleString()} FCFA</div>
                                <div class="p-stock">📦 ${p.stock || 0} en stock</div>
                                <a href="/detail-produit.html?id=${p.id}" class="p-link" target="_blank">
                                    Voir le produit →
                                </a>
                            </div>
                        </div>
                        <div class="msg-time">${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</div>
                    `;

                    // Insérer avant le footer (après tous les messages)
                    pageMain.appendChild(cardDiv);
                    pageMain.scrollTop = pageMain.scrollHeight;

                } catch (error) {
                    console.error('❌ Erreur chargement produit:', error);
                }
            }

            // ==========================================
            // ENVOYER UN MESSAGE
            // ==========================================

            async function sendMessage() {
                const text = messageInput.value.trim();
                if (!text || !shopId || !username) return;

                // Ajouter un message en attente (optimiste)
                const tempDiv = document.createElement('div');
                tempDiv.className = 'message sent';
                tempDiv.innerHTML = `
                    <span class="msg-sender">👤 Vous</span>
                    ${text}
                    <span class="msg-time">⏳ Envoi...</span>
                `;
                pageMain.appendChild(tempDiv);
                pageMain.scrollTop = pageMain.scrollHeight;

                messageInput.value = '';
                sendBtn.disabled = true;

                try {
                    const res = await fetch(SELLER_API_URL + '/api/seller/message/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            shop_id: parseInt(shopId),
                            username: username,
                            message: text
                        })
                    });

                    const data = await res.json();

                    if (data.success) {
                        // Recharger les messages
                        await loadMessages();
                    } else {
                        tempDiv.innerHTML = `
                            <span class="msg-sender">👤 Vous</span>
                            ❌ Échec d'envoi: ${data.error || 'Erreur'}
                            <span class="msg-time">⚠️</span>
                        `;
                        tempDiv.style.background = '#f8d7da';
                        tempDiv.style.color = '#721c24';
                    }
                } catch (error) {
                    console.error('❌ Erreur envoi:', error);
                    tempDiv.innerHTML = `
                        <span class="msg-sender">👤 Vous</span>
                        ❌ Erreur de connexion
                        <span class="msg-time">⚠️</span>
                    `;
                    tempDiv.style.background = '#f8d7da';
                    tempDiv.style.color = '#721c24';
                } finally {
                    sendBtn.disabled = false;
                }
            }

            sendBtn.addEventListener('click', sendMessage);

            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // ==========================================
            // BOUTON ATTACHER (trombone)
            // ==========================================

            attachBtn.addEventListener('click', function() {
                if (!shopId) {
                    alert('⚠️ Aucune boutique associée à cette discussion.');
                    return;
                }
                // Rediriger vers shop-user avec paramètre de retour
                window.location.href = SELLER_API_URL + '/shop-user?id=' + shopId + '&from=discussion&return=discussion&user=' + encodeURIComponent(username);
            });

            // ==========================================
            // SYNC EN ARRIÈRE-PLAN
            // ==========================================

            function startSync() {
                if (syncInterval) clearInterval(syncInterval);
                syncInterval = setInterval(() => {
                    if (!isSyncing) {
                        loadMessages();
                    }
                }, 5000);
            }

            // ==========================================
            // INIT
            // ==========================================

            (async function init() {
                // Charger les messages
                await loadMessages();

                // Démarrer la sync
                startSync();

                console.log('✅ Discussion - Prêt');
                console.log('   Shop:', shopId, 'User:', username);

                // Focus sur le champ
                messageInput.focus();
            })();

            // Nettoyer à la fermeture
            window.addEventListener('beforeunload', function() {
                if (syncInterval) clearInterval(syncInterval);
            });

        });
    </script>

</body>
</html>
