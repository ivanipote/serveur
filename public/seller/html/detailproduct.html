<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Détail produit | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/seller/css/detailproduct.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- HEADER                                     -->
    <!-- ========================================== -->
    <header class="detail-header">
        <button class="back-btn" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="detail-title" id="detailTitle">Détail produit</span>
        <button class="edit-btn" id="editBtn">
            <i class="fas fa-pen"></i> Modifier
        </button>
    </header>

    <!-- ========================================== -->
    <!-- MAIN                                       -->
    <!-- ========================================== -->
    <main class="detail-main">

        <!-- ===== IMAGES ===== -->
        <section class="images-section" id="imagesSection">
            <div class="image-carousel" id="imageCarousel">
                <div class="image-slide" id="imageSlide">
                    <!-- Injecté par JS -->
                </div>
                <button class="carousel-nav prev hidden" id="prevImage">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="carousel-nav next hidden" id="nextImage">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </section>

        <!-- ===== SLIDE INFO (fixe) ===== -->
        <div class="info-slide" id="infoSlide">

            <div class="slide-handle"></div>

            <div class="slide-header">
                <h2 id="productName">Nom du produit</h2>
                <span class="price" id="productPrice">0 FCFA</span>
            </div>

            <div class="slide-meta">
                <span class="stock" id="productStock">📦 En stock</span>
                <span id="productCategory">🏷️ Catégorie</span>
            </div>

            <div class="slide-description" id="productDescription">
                Description du produit
            </div>

            <div class="slide-shop">
                <span class="shop-icon">🏪</span>
                <span class="shop-name" id="shopName">Nom de la boutique</span>
                <a href="#" class="shop-link" id="shopLink">Voir la boutique →</a>
            </div>

        </div>

        <!-- ===== SLIDE MODIFICATION ===== -->
        <div class="edit-slide" id="editSlide">
            <div class="edit-handle"></div>
            <h3>✏️ Modifier le produit</h3>

            <div class="form-group">
                <label>Nom du produit</label>
                <input type="text" id="editName" placeholder="Nom du produit" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Prix (FCFA)</label>
                    <input type="number" id="editPrice" placeholder="0" min="1" />
                </div>
                <div class="form-group">
                    <label>Stock</label>
                    <input type="number" id="editStock" placeholder="0" min="0" />
                </div>
            </div>

            <!-- ✅ NOUVEAU : Description modifiable -->
            <div class="form-group">
                <label>Description</label>
                <textarea id="editDescription" placeholder="Description du produit..." rows="3"></textarea>
            </div>

            <div class="edit-actions">
                <button class="btn-cancel" id="editCancel">Annuler</button>
                <button class="btn-confirm" id="editConfirm">✅ Confirmer</button>
            </div>
        </div>

    </main>

    <script src="/seller/js/detailproduct.js"></script>
</body>
</html>
