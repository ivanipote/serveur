<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Détail produit | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/seller/css/detailproduct.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- HEADER                                     -->
    <!-- ========================================== -->
    <header class="detail-header">
        <button class="back-btn" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="detail-title" id="detailTitle">Détail produit</span>
        <button class="edit-btn" id="editBtn">
            <i class="fas fa-pen"></i> Modifier
        </button>
    </header>

    <!-- ========================================== -->
    <!-- MAIN                                       -->
    <!-- ========================================== -->
    <main class="detail-main">

        <!-- ===== IMAGES CARROUSEL ===== -->
        <section class="images-section">
            <div class="image-carousel" id="imageCarousel">
                <div class="image-slide" id="imageSlide">
                    <!-- Injecté par JS -->
                </div>
                <button class="carousel-nav prev" id="prevImage">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="carousel-nav next" id="nextImage">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <div class="image-counter" id="imageCounter">1 / 1</div>
            </div>
        </section>

        <!-- ===== INFOS PRODUIT ===== -->
        <section class="info-section">
            <div class="info-header">
                <h1 id="productName">Nom du produit</h1>
                <span class="product-price" id="productPrice">0 FCFA</span>
            </div>
            <div class="info-meta">
                <span class="product-stock" id="productStock">📦 En stock</span>
                <span class="product-category" id="productCategory">Catégorie</span>
            </div>
            <div class="product-description" id="productDescription">
                Description du produit
            </div>
        </section>

    </main>

    <!-- ========================================== -->
    <!-- FOOTER                                     -->
    <!-- ========================================== -->
    <footer class="detail-footer">
        <span>📦 <strong id="footerStock">0</strong> en stock</span>
        <span>🏷️ <strong id="footerPrice">0 FCFA</strong></span>
    </footer>

    <script src="/seller/js/detailproduct.js"></script>
</body>
</html>
