<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Produits | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/seller/css/shop-user.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="page-header">
        <button class="back-btn" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="shop-title">
            <span class="name" id="shopName">Chargement...</span>
            <span class="sub" id="productCount">0 produits</span>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="page-main" id="pageMain">

        <!-- SKELETON LOADER -->
        <div class="skeleton-loader" id="skeletonLoader">
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
        </div>

        <!-- GRILLE PRODUITS -->
        <div class="products-grid" id="productsGrid" style="display:none;"></div>

        <!-- EMPTY -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <i class="fas fa-box-open"></i>
            <h3>Aucun produit</h3>
            <p>Cette boutique n'a pas encore de produits.</p>
        </div>

    </main>

    <!-- ========================================== -->
    <!-- SLIDE COMMENTAIRES (du bas)                -->
    <!-- ========================================== -->
    <div class="slide-overlay" id="slideOverlay">
        <div class="slide-container">

            <div class="slide-handle"></div>

            <!-- PARTIE HAUTE : IMAGE + HEADER -->
            <div class="slide-top">
                <div class="slide-header">
                    <div class="slide-product">
                        <button class="like-btn" id="likeBtn">
                            <i class="fas fa-heart"></i>
                        </button>
                        <span class="like-count" id="likeCount">0</span>
                        <span class="product-name-slide" id="slideProductName">Produit</span>
                    </div>
                    <div class="slide-actions">
                        <button class="btn-detail" id="detailBtn">
                            <i class="fas fa-eye"></i> Détail
                        </button>
                        <button class="btn-close-slide" id="closeSlideBtn">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div class="slide-image-wrapper">
                    <img id="slideProductImage" src="" alt="Produit" style="display:none;" />
                    <div class="slide-image-placeholder" id="slideImagePlaceholder">
                        <i class="fas fa-image"></i>
                        <span>Image du produit</span>
                    </div>
                </div>
            </div>

            <!-- PARTIE BASSE : COMMENTAIRES -->
            <div class="slide-bottom">
                <div class="slide-body" id="slideBody">
                    <!-- Injecté par JS -->
                </div>

                <!-- FOOTER COMMENTAIRE -->
                <div class="slide-footer">
                    <input type="text" class="comment-input" id="commentInput" placeholder="Écrire un commentaire..." />
                    <button class="btn-send-comment" id="sendCommentBtn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- ========================================== -->
    <!-- OVERLAY USERNAME                           -->
    <!-- ========================================== -->
    <div class="username-overlay" id="usernameOverlay">
        <div class="username-box">
            <div class="username-icon">👤</div>
            <h3>Entrez votre nom</h3>
            <p>Pour commenter et liker les produits</p>
            <input type="text" class="username-input" id="usernameInput" placeholder="Votre nom..." maxlength="30" />
            <button class="username-btn" id="usernameConfirmBtn">
                <i class="fas fa-check"></i> Confirmer
            </button>
            <button class="username-skip" id="usernameSkipBtn">Passer</button>
        </div>
    </div>

    <script src="/seller/js/shop-user.js"></script>
</body>
</html>
