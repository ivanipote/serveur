<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Produits | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ==========================================
           STYLES COMPLETS
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
        }

        /* ===== HEADER ===== */
        .page-header {
            background: #17A464;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 2px 10px rgba(23, 164, 100, 0.2);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .page-header .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .page-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.05);
        }

        .page-header .shop-title {
            flex: 1;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .page-header .shop-title .name {
            font-size: 16px;
            font-weight: 700;
        }

        .page-header .shop-title .sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
        }

        .page-header .btn-whatsapp {
            background: #25D366;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            text-decoration: none;
        }

        .page-header .btn-whatsapp:hover {
            background: #1da851;
            transform: scale(1.02);
        }

        .page-header .btn-whatsapp i {
            font-size: 16px;
        }

        /* ===== MAIN ===== */
        .page-main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
        }

        .page-main::-webkit-scrollbar {
            width: 4px;
        }
        .page-main::-webkit-scrollbar-thumb {
            background: #d0d0da;
            border-radius: 10px;
        }

        /* ==========================================
           GRILLE PRODUITS - 3 CARTES PAR LIGNE
           ========================================== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
        }

        .product-card:nth-child(1) { animation-delay: 0.03s; }
        .product-card:nth-child(2) { animation-delay: 0.06s; }
        .product-card:nth-child(3) { animation-delay: 0.09s; }
        .product-card:nth-child(4) { animation-delay: 0.12s; }
        .product-card:nth-child(5) { animation-delay: 0.15s; }
        .product-card:nth-child(6) { animation-delay: 0.18s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            width: 100%;
            height: 120px;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .product-image .fallback {
            font-size: 36px;
            color: #d0d0da;
        }

        .stock-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .stock-badge.in-stock {
            background: #17A464;
            color: white;
        }

        .stock-badge.low-stock {
            background: #F5A623;
            color: white;
        }

        .stock-badge.out-of-stock {
            background: #E24C4C;
            color: white;
        }

        .product-info {
            padding: 8px 10px 10px 10px;
        }

        .product-name {
            font-size: 12px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .product-price {
            font-size: 14px;
            font-weight: 800;
            color: #17A464;
        }

        .product-stock-qty {
            font-size: 10px;
            color: #9CA3AF;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ==========================================
           SKELETON LOADER
           ========================================== */
        .skeleton-loader {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .skeleton-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            min-height: 180px;
        }

        .skeleton-image {
            width: 100%;
            height: 120px;
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.08) 75%);
            background-size: 200% 100%;
            border-radius: 6px;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-line.short {
            width: 50%;
            height: 12px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ==========================================
           EMPTY STATE
           ========================================== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
        }

        .empty-state i {
            font-size: 48px;
            color: #d0d0da;
            display: block;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 18px;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 14px;
            color: #9CA3AF;
        }

        /* ==========================================
           SLIDE COMMENTAIRES - STYLE TIKTOK
           ========================================== */
        .slide-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: flex-end;
            animation: fadeIn 0.3s ease;
        }

        .slide-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .slide-container {
            background: white;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.12);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .slide-handle {
            width: 40px;
            height: 4px;
            background: #d0d0da;
            border-radius: 4px;
            margin: 10px auto 6px auto;
            flex-shrink: 0;
        }

        /* ===== PARTIE HAUTE : HEADER + IMAGE/DESC ===== */
        .slide-top {
            flex-shrink: 0;
            max-height: 45vh;
        }

        .slide-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 16px 8px 16px;
            border-bottom: 1px solid #f0f2f5;
            flex-shrink: 0;
        }

        .slide-header .slide-product {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .slide-header .slide-product .like-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.2s;
            color: #d0d0da;
            flex-shrink: 0;
        }

        .slide-header .slide-product .like-btn.liked {
            color: #E24C4C;
        }

        .slide-header .slide-product .like-btn:active {
            transform: scale(1.3);
        }

        .slide-header .slide-product .like-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .slide-header .slide-product .like-count {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a2e;
            min-width: 20px;
            flex-shrink: 0;
        }

        .slide-header .slide-product .product-name-slide {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a2e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            flex: 1;
        }

        .slide-header .slide-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .slide-header .slide-actions .btn-detail {
            background: none;
            border: none;
            color: #17A464;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 20px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .slide-header .slide-actions .btn-detail:hover {
            background: #f0fbf5;
        }

        .slide-header .slide-actions .btn-close-slide {
            background: none;
            border: none;
            color: #9CA3AF;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
        }

        /* ===== IMAGE + DESCRIPTION (côte à côte) ===== */
        .slide-content {
            display: flex;
            gap: 14px;
            padding: 10px 16px 12px 16px;
            align-items: center;
            border-bottom: 1px solid #f0f2f5;
        }

        .slide-image-wrapper {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .slide-image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #d0d0da;
            font-size: 12px;
            gap: 2px;
            width: 100%;
            height: 100%;
        }

        .slide-image-placeholder i {
            font-size: 28px;
        }

        .slide-desc {
            flex: 1;
            min-width: 0;
        }

        .slide-desc .desc-text {
            font-size: 13px;
            color: #3a4152;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .slide-desc .desc-label {
            font-size: 10px;
            color: #9CA3AF;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        /* ===== PARTIE BASSE : COMMENTAIRES ===== */
        .slide-bottom {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-top: 1px solid #f0f2f5;
        }

        .slide-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px 4px 16px;
        }

        .slide-body::-webkit-scrollbar {
            width: 3px;
        }
        .slide-body::-webkit-scrollbar-thumb {
            background: #d0d0da;
            border-radius: 10px;
        }

        /* ===== COMMENTAIRES EN BLEU ===== */
        .comment-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 0;
            border-bottom: 1px solid #DBEAFE;
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-item .comment-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .comment-item .comment-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #EAF1FF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .comment-item .comment-user {
            font-size: 12px;
            font-weight: 700;
            color: #1a2a6c;
        }

        .comment-item .comment-text {
            font-size: 13.5px;
            color: #2563EB;
            word-wrap: break-word;
            padding-left: 38px;
        }

        .comment-item .comment-bottom {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-left: 38px;
            margin-top: 2px;
        }

        .comment-item .comment-date {
            font-size: 10px;
            color: #93C5FD;
        }

        .comment-item .comment-like-btn {
            background: none;
            border: none;
            color: #93C5FD;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .comment-item .comment-like-btn:hover {
            color: #2563EB;
        }

        .comment-item .comment-like-btn.liked {
            color: #E24C4C;
        }

        .comment-item .comment-reply-btn {
            background: none;
            border: none;
            color: #93C5FD;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        .comment-item .comment-reply-btn:hover {
            color: #2563EB;
        }

        /* ===== RÉPONSES ===== */
        .comment-item .replies {
            padding-left: 38px;
            margin-top: 4px;
            border-left: 2px solid #DBEAFE;
            padding-left: 20px;
        }

        .comment-item .replies .reply-item {
            padding: 4px 0;
            border-bottom: 1px solid #F0F4FF;
        }

        .comment-item .replies .reply-item:last-child {
            border-bottom: none;
        }

        .comment-item .replies .reply-item .reply-user {
            font-size: 11px;
            font-weight: 700;
            color: #1a2a6c;
        }

        .comment-item .replies .reply-item .reply-text {
            font-size: 12.5px;
            color: #2563EB;
        }

        .comment-item .replies .reply-item .reply-date {
            font-size: 9px;
            color: #93C5FD;
            margin-left: 8px;
        }

        /* ===== INDICATEUR DE RÉPONSE ===== */
        .replying-indicator {
            font-size: 12px;
            color: #1a2a6c;
            padding: 4px 16px 0 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .replying-indicator .cancel-reply {
            background: none;
            border: none;
            color: #E24C4C;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        /* ===== NO COMMENTAIRES ===== */
        .no-comments {
            text-align: center;
            padding: 30px 20px;
            color: #93C5FD;
            font-size: 14px;
        }

        .no-comments i {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            color: #DBEAFE;
        }

        /* ===== SKELETON COMMENTAIRES ===== */
        .comment-skeleton {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 8px 0;
        }

        .comment-skeleton-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px solid #f0f2f5;
        }

        .comment-skeleton-item .skeleton-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(90deg, #e8e8f0 25%, #d5d5e0 50%, #e8e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            flex-shrink: 0;
        }

        .comment-skeleton-item .skeleton-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .comment-skeleton-item .skeleton-content .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #e8e8f0 25%, #d5d5e0 50%, #e8e8f0 75%);
            background-size: 200% 100%;
            border-radius: 6px;
            animation: shimmer 1.5s infinite;
            width: 70%;
        }

        .comment-skeleton-item .skeleton-content .skeleton-line.short {
            width: 40%;
            height: 10px;
        }

        /* ===== FOOTER COMMENTAIRE ===== */
        .slide-footer {
            padding: 8px 16px 14px 16px;
            border-top: 1px solid #f0f2f5;
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            align-items: center;
            background: white;
            border-radius: 0 0 24px 24px;
        }

        .slide-footer .comment-input {
            flex: 1;
            padding: 8px 14px;
            border: 2px solid #DBEAFE;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #FAFBFF;
        }

        .slide-footer .comment-input:focus {
            border-color: #2563EB;
            background: white;
        }

        .slide-footer .comment-input::placeholder {
            color: #93C5FD;
        }

        .slide-footer .btn-send-comment {
            background: #1a2a6c;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-footer .btn-send-comment:hover {
            background: #0d1a4a;
            transform: scale(1.04);
        }

        .slide-footer .btn-send-comment:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ==========================================
           OVERLAY USERNAME
           ========================================== */
        .username-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 300;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .username-overlay.active {
            display: flex;
        }

        .username-box {
            background: white;
            border-radius: 24px;
            padding: 32px 28px 28px 28px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .username-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .username-box h3 {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .username-box p {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 16px;
        }

        .username-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #DBEAFE;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .username-input:focus {
            border-color: #2563EB;
        }

        .username-btn {
            width: 100%;
            padding: 12px;
            background: #1a2a6c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .username-btn:hover {
            background: #0d1a4a;
            transform: scale(1.02);
        }

        .username-skip {
            background: none;
            border: none;
            color: #9CA3AF;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
            padding: 4px 12px;
            transition: color 0.2s;
        }

        .username-skip:hover {
            color: #6B7280;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */

        @media (max-width: 768px) {
            .page-header {
                padding: 10px 14px;
                gap: 10px;
                border-radius: 0 0 16px 16px;
            }
            .page-header .back-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;

    <!-- ========================================== -->

    <!-- ========================================== -->
    <!-- OVERLAY USERNAME                           -->
    <!-- ========================================== -->
    <div class="username-overlay" id="usernameOverlay">
        <div class="username-box">
            <div class="username-icon">👤</div>
            <h3>Entrez votre nom</h3>
            <p>Pour commenter et liker les produits</p>
            <input type="text" class="username-input" id="usernameInput" placeholder="Votre nom..." maxlength="30" />
            <button class="username-btn" id="usernameConfirmBtn">
                <i class="fas fa-check"></i> Confirmer
            </button>
            <button class="username-skip" id="usernameSkipBtn">Passer</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ Shop User - Démo');

            // ==========================================
            // RÉFÉRENCES
            // ==========================================

            const skeletonLoader = document.getElementById('skeletonLoader');
            const productsGrid = document.getElementById('productsGrid');
            const emptyState = document.getElementById('emptyState');
            const shopName = document.getElementById('shopName');
            const productCount = document.getElementById('productCount');

            const slideOverlay = document.getElementById('slideOverlay');
            const closeSlideBtn = document.getElementById('closeSlideBtn');
            const slideProductName = document.getElementById('slideProductName');
            const slideProductImage = document.getElementById('slideProductImage');
            const slideImagePlaceholder = document.getElementById('slideImagePlaceholder');
            const slideDescription = document.getElementById('slideDescription');
            const likeBtn = document.getElementById('likeBtn');
            const likeCount = document.getElementById('likeCount');
            const detailBtn = document.getElementById('detailBtn');
            const slideBody = document.getElementById('slideBody');
            const commentsContainer = document.getElementById('commentsContainer');
            const commentSkeleton = document.getElementById('commentSkeleton');
            const commentInput = document.getElementById('commentInput');
            const sendCommentBtn = document.getElementById('sendCommentBtn');

            const replyingIndicator = document.getElementById('replyingIndicator');
            const replyToText = document.getElementById('replyToText');
            const cancelReplyBtn = document.getElementById('cancelReplyBtn');

            const usernameOverlay = document.getElementById('usernameOverlay');
            const usernameInput = document.getElementById('usernameInput');
            const usernameConfirmBtn = document.getElementById('usernameConfirmBtn');
            const usernameSkipBtn = document.getElementById('usernameSkipBtn');

            let currentProductId = null;
            let isLiked = false;
            let likeCounter = 0;
            let productComments = [];
            let currentUsername = null;
            let syncInterval = null;
            let isSlideOpen = false;
            let replyTarget = null;
            let commentIdCounter = 0;

            // ==========================================
            // GESTION DU USERNAME
            // ==========================================

            const USERNAME_KEY = 'complus_username';

            function getUsername() {
                if (currentUsername) return currentUsername;
                const stored = localStorage.getItem(USERNAME_KEY);
                if (stored) {
                    currentUsername = stored;
                    return currentUsername;
                }
                return null;
            }

            function setUsername(name) {
                currentUsername = name.trim();
                localStorage.setItem(USERNAME_KEY, currentUsername);
            }

            function showUsernameOverlay() {
                usernameInput.value = getUsername() || '';
                usernameOverlay.classList.add('active');
                setTimeout(() => usernameInput.focus(), 300);
            }

            function hideUsernameOverlay() {
                usernameOverlay.classList.remove('active');
            }

            usernameConfirmBtn.addEventListener('click', function() {
                const name = usernameInput.value.trim();
                if (name.length > 0) {
                    setUsername(name);
                    hideUsernameOverlay();
                    if (currentProductId) {
                        loadProductData(currentProductId);
                    }
                } else {
                    usernameInput.style.borderColor = '#E24C4C';
                    setTimeout(() => usernameInput.style.borderColor = '', 1000);
                }
            });

            usernameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    usernameConfirmBtn.click();
                }
            });

            usernameSkipBtn.addEventListener('click', function() {
                hideUsernameOverlay();
            });

            // ==========================================
            // URL
            // ==========================================

            const SELLER_API_URL = 'https://nature-plus-seller.onrender.com';

            const urlParams = new URLSearchParams(window.location.search);
            const shopId = urlParams.get('id') || '5';

            // ==========================================
            // DONNÉES EXEMPLES
            // ==========================================

            const demoShop = {
                id: parseInt(shopId),
                name: 'Boutique Koffi',
                seller_phone: '0503588336',
                products: [
                    { id: 1, name: 'Jus de gingembre', price: 500, stock: 15, image: null,
                        description: 'Jus naturel de gingembre, idéal pour la digestion.' },
                    { id: 2, name: 'Attiéké', price: 300, stock: 8, image: null,
                        description: 'Attiéké traditionnel, accompagnement parfait.' },
                    { id: 3, name: 'Alloco', price: 200, stock: 20, image: null,
                        description: 'Alloco croustillant, fait maison.' }
                ]
            };

            // ==========================================
            // CHARGER LA BOUTIQUE
            // ==========================================

            function loadShop() {
                skeletonLoader.style.display = 'none';

                // Mettre à jour le WhatsApp
                const waBtn = document.getElementById('whatsappBtn');
                if (demoShop.seller_phone) {
                    const cleanPhone = demoShop.seller_phone.replace(/\D/g, '');
                    waBtn.href = 'https://wa.me/225' + cleanPhone;
                }

                shopName.textContent = demoShop.name;
                productCount.textContent = demoShop.products.length + ' produits';

                if (demoShop.products.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                renderProducts(demoShop.products);
                console.log('✅ ' + demoShop.products.length + ' produits chargés');
            }

            // ==========================================
            // AFFICHER LES PRODUITS
            // ==========================================

            function renderProducts(products) {
                productsGrid.style.display = 'grid';

                productsGrid.innerHTML = products.map(p => {
                    const stock = p.stock || 0;
                    let stockLabel = 'En stock';
                    let stockClass = 'in-stock';
                    if (stock === 0) {
                        stockLabel = 'Rupture';
                        stockClass = 'out-of-stock';
                    } else if (stock <= 5) {
                        stockLabel = 'Stock faible';
                        stockClass = 'low-stock';
                    }

                    const imgSrc = p.image || null;
                    const imgHtml = imgSrc ?
                        `<img src="${imgSrc}" alt="${p.name}" loading="lazy" />` :
                        `<div class="fallback">📦</div>`;

                    return `
                        <div class="product-card" data-id="${p.id}">
                            <div class="product-image">
                                ${imgHtml}
                                <span class="stock-badge ${stockClass}">${stockLabel}</span>
                            </div>
                            <div class="product-info">
                                <div class="product-name">${p.name}</div>
                                <div class="product-footer">
                                    <span class="product-price">${p.price.toLocaleString()} FCFA</span>
                                    <span class="product-stock-qty"><i class="fas fa-box"></i> ${stock}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                document.querySelectorAll('.product-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        // Rediriger vers detail-produit.html
                        window.location.href = '/detail-produit.html?id=' + id;
                    });
                });
            }

            // ==========================================
            // OUVERTURE DU SLIDE (pour les commentaires)
            // ==========================================

            window.openSlide = function(productId) {
                const product = demoShop.products.find(p => p.id === productId);
                if (!product) return;

                currentProductId = productId;
                slideProductName.textContent = product.name;
                slideDescription.textContent = product.description || 'Aucune description';

                // Image
                if (product.image) {
                    slideProductImage.src = product.image;
                    slideProductImage.style.display = 'block';
                    slideImagePlaceholder.style.display = 'none';
                } else {
                    slideProductImage.style.display = 'none';
                    slideImagePlaceholder.style.display = 'flex';
                }

                // Réinitialiser la réponse
                replyTarget = null;
                replyingIndicator.style.display = 'none';

                showCommentSkeleton();
                loadProductData(productId);

                slideOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                isSlideOpen = true;

                const username = getUsername();
                if (!username) {
                    setTimeout(() => showUsernameOverlay(), 500);
                }
            };

            // ==========================================
            // CHARGER LES COMMENTAIRES
            // ==========================================

            function loadProductData(productId) {
                // Simuler des commentaires
                productComments = [
                    { id: 1, user: 'Koffi', avatar: '👤', comment: 'super produit !', date: '26/08/2026',
                        likes: 5, replies: [
                            { user: 'Aya', comment: 'merci !', date: '26/08/2026' },
                            { user: 'Jean', comment: 'je confirme', date: '26/08/2026' }
                        ] },
                    { id: 2, user: 'Aya', avatar: '👤', comment: 'combien ça coûte ?', date: '26/08/2026',
                        likes: 2, replies: [] },
                    { id: 3, user: 'Jean', avatar: '👤', comment: 'livraison rapide !', date: '25/08/2026',
                        likes: 3, replies: [
                            { user: 'Koffi', comment: 'oui vraiment', date: '25/08/2026' }
                        ] }
                ];
                likeCounter = 12;
                likeCount.textContent = likeCounter;

                hideCommentSkeleton();
                renderComments(productComments);
            }

            // ==========================================
            // AFFICHER LES COMMENTAIRES (en bleu)
            // ==========================================

            function renderComments(comments) {
                if (!comments || comments.length === 0) {
                    commentsContainer.innerHTML = `
                        <div class="no-comments">
                            <i class="fas fa-comment-slash"></i>
                            <p>Aucun commentaire pour ce produit.<br>Soyez le premier à donner votre avis !</p>
                        </div>
                    `;
                    return;
                }

                const username = getUsername();

                commentsContainer.innerHTML = comments.map(c => {
                    const repliesHtml = c.replies && c.replies.length > 0 ?
                        c.replies.map(r => `
                            <div class="reply-item">
                                <span class="reply-user">${r.user}</span>
                                <span class="reply-text">${r.comment}</span>
                                <span class="reply-date">${r.date || 'Aujourd\'hui'}</span>
                            </div>
                        `).join('') : '';

                    return `
                        <div class="comment-item" data-id="${c.id}">
                            <div class="comment-top">
                                <div class="comment-avatar">${c.avatar || '👤'}</div>
                                <span class="comment-user">${c.user}</span>
                            </div>
                            <div class="comment-text">${c.comment}</div>
                            <div class="comment-bottom">
                                <span class="comment-date">${c.date || 'Aujourd\'hui'}</span>
                                <button class="comment-like-btn" onclick="likeComment(${c.id})">
                                    <i class="fas fa-heart"></i> ${c.likes || 0}
                                </button>
                                <button class="comment-reply-btn" onclick="startReply(${c.id}, '${c.user}')">
                                    Répondre
                                </button>
                            </div>
                            ${repliesHtml ? `<div class="replies">${repliesHtml}</div>` : ''}
                        </div>
                    `;
                }).join('');

                // Mettre à jour les likes
                document.querySelectorAll('.comment-like-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                    });
                });
            }

            // ==========================================
            // SKELETON COMMENTAIRES
            // ==========================================

            function showCommentSkeleton() {
                commentSkeleton.style.display = 'block';
                commentsContainer.style.display = 'none';
                commentsContainer.innerHTML = '';
            }

            function hideCommentSkeleton() {
                commentSkeleton.style.display = 'none';
                commentsContainer.style.display = 'block';
            }

            // ==========================================
            // FERMER LE SLIDE
            // ==========================================

            function closeSlide() {
                slideOverlay.classList.remove('active');
                document.body.style.overflow = '';
                commentInput.value = '';
                isSlideOpen = false;
                replyTarget = null;
                replyingIndicator.style.display = 'none';
            }

            closeSlideBtn.addEventListener('click', closeSlide);
            slideOverlay.addEventListener('click', function(e) {
                if (e.target === slideOverlay) closeSlide();
            });

            // ==========================================
            // LIKE DU PRODUIT
            // ==========================================

            likeBtn.addEventListener('click', function() {
                const username = getUsername();
                if (!username) {
                    showUsernameOverlay();
                    return;
                }

                if (isLiked) {
                    isLiked = false;
                    likeCounter--;
                    this.classList.remove('liked');
                    this.disabled = false;
                } else {
                    isLiked = true;
                    likeCounter++;
                    this.classList.add('liked');
                    this.disabled = true;
                }

                likeCount.textContent = likeCounter;
            });

            // ==========================================
            // DÉTAIL
            // ==========================================

            detailBtn.addEventListener('click', function() {
                if (currentProductId) {
                    window.location.href = '/detail-produit.html?id=' + currentProductId;
                }
            });

            // ==========================================
            // LIKER UN COMMENTAIRE
            // ==========================================

            window.likeComment = function(commentId) {
                const username = getUsername();
                if (!username) {
                    showUsernameOverlay();
                    return;
                }

                const comment = productComments.find(c => c.id === commentId);
                if (comment) {
                    comment.likes = (comment.likes || 0) + 1;
                    renderComments(productComments);
                }
            };

            // ==========================================
            // RÉPONDRE À UN COMMENTAIRE
            // ==========================================

            window.startReply = function(commentId, userName) {
                const username = getUsername();
                if (!username) {
                    showUsernameOverlay();
                    return;
                }

                replyTarget = commentId;
                replyingIndicator.style.display = 'flex';
                replyToText.innerHTML = `Répondre à <strong>@${userName}</strong>`;
                commentInput.focus();
                commentInput.placeholder = `Répondre à ${userName}...`;
            };

            cancelReplyBtn.addEventListener('click', function() {
                replyTarget = null;
                replyingIndicator.style.display = 'none';
                commentInput.placeholder = 'Écrire un commentaire...';
            });

            // ==========================================
            // ENVOYER UN COMMENTAIRE
            // ==========================================

            function sendComment() {
                const username = getUsername();
                if (!username) {
                    showUsernameOverlay();
                    return;
                }

                const text = commentInput.value.trim();
                if (!text || !currentProductId) return;

                if (replyTarget !== null) {
                    // Réponse à un commentaire
                    const parent = productComments.find(c => c.id === replyTarget);
                    if (parent) {
                        if (!parent.replies) parent.replies = [];
                        parent.replies.push({
                            user: username,
                            comment: text,
                            date: new Date().toLocaleDateString('fr-FR')
                        });
                    }
                    replyTarget = null;
                    replyingIndicator.style.display = 'none';
                    commentInput.placeholder = 'Écrire un commentaire...';
                } else {
                    // Nouveau commentaire
                    const newComment = {
                        id: ++commentIdCounter,
                        user: username,
                        avatar: '👤',
                        comment: text,
                        date: new Date().toLocaleDateString('fr-FR'),
                        likes: 0,
                        replies: []
                    };
                    productComments.push(newComment);
                }

                renderComments(productComments);
                commentInput.value = '';

                setTimeout(() => {
                    slideBody.scrollTop = slideBody.scrollHeight;
                }, 100);
            }

            sendCommentBtn.addEventListener('click', sendComment);

            commentInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendComment();
                }
            });

            // ==========================================
            // CHANGER DE NOM
            // ==========================================

            slideProductName.addEventListener('dblclick', function() {
                showUsernameOverlay();
            });

            // ==========================================
            // INIT
            // ==========================================

            const username = getUsername();
            if (username) {
                console.log('👤 Nom d\'utilisateur :', username);
            } else {
                console.log('ℹ️ Aucun nom d\'utilisateur');
            }

            loadShop();

            // Ouvrir le slide sur le premier produit (démo)
            setTimeout(() => {
                if (demoShop.products.length > 0) {
                    window.openSlide(demoShop.products[0].id);
                }
            }, 800);

            console.log('✅ Shop User - Prêt');

        });
    </script>

</body>
