<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Produits | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ==========================================
           STYLES COMPLETS
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
        }

        /* ===== HEADER ===== */
        .page-header {
            background: #17A464;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 2px 10px rgba(23, 164, 100, 0.2);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .page-header .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .page-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.05);
        }

        .page-header .shop-title {
            flex: 1;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .page-header .shop-title .name {
            font-size: 16px;
            font-weight: 700;
        }

        .page-header .shop-title .sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
        }

        .page-header .btn-message {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .page-header .btn-message:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.02);
        }

        /* ===== MAIN ===== */
        .page-main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
        }

        .page-main::-webkit-scrollbar {
            width: 4px;
        }
        .page-main::-webkit-scrollbar-thumb {
            background: #d0d0da;
            border-radius: 10px;
        }

        /* ==========================================
           GRILLE PRODUITS - 3 CARTES PAR LIGNE
           ========================================== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
        }

        .product-card:nth-child(1) { animation-delay: 0.03s; }
        .product-card:nth-child(2) { animation-delay: 0.06s; }
        .product-card:nth-child(3) { animation-delay: 0.09s; }
        .product-card:nth-child(4) { animation-delay: 0.12s; }
        .product-card:nth-child(5) { animation-delay: 0.15s; }
        .product-card:nth-child(6) { animation-delay: 0.18s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            width: 100%;
            height: 120px;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .product-image .fallback {
            font-size: 36px;
            color: #d0d0da;
        }

        .stock-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .stock-badge.in-stock {
            background: #17A464;
            color: white;
        }

        .stock-badge.low-stock {
            background: #F5A623;
            color: white;
        }

        .stock-badge.out-of-stock {
            background: #E24C4C;
            color: white;
        }

        .product-info {
            padding: 8px 10px 10px 10px;
        }

        .product-name {
            font-size: 12px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .product-price {
            font-size: 14px;
            font-weight: 800;
            color: #17A464;
        }

        .product-stock-qty {
            font-size: 10px;
            color: #9CA3AF;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ==========================================
           SKELETON LOADER
           ========================================== */
        .skeleton-loader {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .skeleton-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            min-height: 180px;
        }

        .skeleton-image {
            width: 100%;
            height: 120px;
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.08) 75%);
            background-size: 200% 100%;
            border-radius: 6px;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-line.short {
            width: 50%;
            height: 12px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ==========================================
           EMPTY STATE
           ========================================== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6B7280;
        }

        .empty-state i {
            font-size: 48px;
            color: #d0d0da;
            display: block;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 18px;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 14px;
            color: #9CA3AF;
        }

        /* ==========================================
           SLIDE COMMENTAIRES (du bas)
           ========================================== */
        .slide-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: flex-end;
            animation: fadeIn 0.3s ease;
        }

        .slide-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .slide-container {
            background: white;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.12);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .slide-handle {
            width: 40px;
            height: 4px;
            background: #d0d0da;
            border-radius: 4px;
            margin: 12px auto 8px auto;
        }

        .slide-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px 12px 20px;
            border-bottom: 1px solid #f0f2f5;
            flex-shrink: 0;
        }

        .slide-header .slide-product {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slide-header .slide-product .like-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.2s;
            color: #d0d0da;
        }

        .slide-header .slide-product .like-btn.liked {
            color: #E24C4C;
        }

        .slide-header .slide-product .like-btn:active {
            transform: scale(1.3);
        }

        .slide-header .slide-product .like-count {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a2e;
            min-width: 20px;
        }

        .slide-header .slide-product .product-name-slide {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .slide-header .slide-actions {
            display: flex;
            gap: 8px;
        }

        .slide-header .slide-actions .btn-detail {
            background: none;
            border: none;
            color: #17A464;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .slide-header .slide-actions .btn-detail:hover {
            background: #f0fbf5;
        }

        .slide-header .slide-actions .btn-close-slide {
            background: none;
            border: none;
            color: #9CA3AF;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .slide-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px 8px 20px;
        }

        .slide-body::-webkit-scrollbar {
            width: 3px;
        }
        .slide-body::-webkit-scrollbar-thumb {
            background: #d0d0da;
            border-radius: 10px;
        }

        .comment-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f8;
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-item .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f0fbf5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .comment-item .comment-content {
            flex: 1;
            min-width: 0;
        }

        .comment-item .comment-content .comment-user {
            font-size: 12px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .comment-item .comment-content .comment-text {
            font-size: 14px;
            color: #3a4152;
            word-wrap: break-word;
            margin-top: 1px;
        }

        .comment-item .comment-content .comment-date {
            font-size: 10px;
            color: #9CA3AF;
            margin-top: 2px;
        }

        .no-comments {
            text-align: center;
            padding: 30px 20px;
            color: #9CA3AF;
            font-size: 14px;
        }

        .no-comments i {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
            color: #d0d0da;
        }

        .slide-footer {
            padding: 12px 20px 20px 20px;
            border-top: 1px solid #f0f2f5;
            flex-shrink: 0;
            display: flex;
            gap: 10px;
            align-items: center;
            background: white;
            border-radius: 0 0 24px 24px;
        }

        .slide-footer .comment-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e8ecf4;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .slide-footer .comment-input:focus {
            border-color: #17A464;
        }

        .slide-footer .comment-input::placeholder {
            color: #b0b8c8;
        }

        .slide-footer .btn-send-comment {
            background: #17A464;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-footer .btn-send-comment:hover {
            background: #0E7A49;
            transform: scale(1.04);
        }

        .slide-footer .btn-send-comment:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */

        @media (max-width: 768px) {
            .page-header {
                padding: 10px 14px;
                gap: 10px;
                border-radius: 0 0 16px 16px;
            }
            .page-header .back-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .page-header .shop-title .name {
                font-size: 14px;
            }
            .page-header .shop-title .sub {
                font-size: 11px;
            }
            .page-header .btn-message {
                font-size: 12px;
                padding: 6px 12px;
            }
            .page-main {
                padding: 12px;
            }
            .products-grid {
                gap: 10px;
            }
            .product-image {
                height: 100px;
            }
            .product-name {
                font-size: 11px;
            }
            .product-price {
                font-size: 13px;
            }
            .slide-container {
                max-height: 75vh;
            }
            .slide-header .slide-product .product-name-slide {
                max-width: 100px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .page-header {
                padding: 8px 10px;
                gap: 8px;
                border-radius: 0 0 14px 14px;
            }
            .page-header .back-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .page-header .shop-title .name {
                font-size: 13px;
            }
            .page-header .shop-title .sub {
                font-size: 10px;
            }
            .page-header .btn-message {
                font-size: 10px;
                padding: 4px 10px;
            }
            .page-header .btn-message i {
                font-size: 12px;
            }
            .page-main {
                padding: 8px;
            }
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .product-card {
                border-radius: 12px;
            }
            .product-image {
                height: 80px;
            }
            .stock-badge {
                font-size: 7px;
                padding: 2px 6px;
                top: 4px;
                right: 4px;
            }
            .product-info {
                padding: 6px 6px 8px 6px;
            }
            .product-name {
                font-size: 10px;
            }
            .product-price {
                font-size: 11px;
            }
            .product-stock-qty {
                font-size: 8px;
            }
            .product-stock-qty i {
                font-size: 7px;
            }
            .slide-container {
                max-height: 80vh;
                border-radius: 20px 20px 0 0;
            }
            .slide-header {
                padding: 6px 14px 10px 14px;
            }
            .slide-header .slide-product .product-name-slide {
                max-width: 70px;
                font-size: 13px;
            }
            .slide-header .slide-product .like-btn {
                font-size: 18px;
            }
            .slide-header .slide-actions .btn-detail {
                font-size: 12px;
                padding: 4px 8px;
            }
            .slide-body {
                padding: 8px 14px 4px 14px;
            }
            .comment-item .comment-content .comment-text {
                font-size: 13px;
            }
            .slide-footer {
                padding: 8px 14px 14px 14px;
                gap: 8px;
            }
            .slide-footer .comment-input {
                font-size: 13px;
                padding: 8px 14px;
            }
            .slide-footer .btn-send-comment {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }
        }

        @media (max-width: 360px) {
            .products-grid {
                gap: 6px;
            }
            .product-image {
                height: 65px;
            }
            .product-name {
                font-size: 9px;
            }
            .product-price {
                font-size: 10px;
            }
            .product-stock-qty {
                font-size: 7px;
            }
            .slide-header .slide-product .product-name-slide {
                max-width: 55px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="page-header">
        <button class="back-btn" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="shop-title">
            <span class="name" id="shopName">Chargement...</span>
            <span class="sub" id="productCount">0 produits</span>
        </div>
        <button class="btn-message" id="messageBtn">
            <i class="fas fa-comment-dots"></i> Message
        </button>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="page-main" id="pageMain">

        <!-- SKELETON LOADER -->
        <div class="skeleton-loader" id="skeletonLoader">
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
        </div>

        <!-- GRILLE PRODUITS -->
        <div class="products-grid" id="productsGrid" style="display:none;"></div>

        <!-- EMPTY -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <i class="fas fa-box-open"></i>
            <h3>Aucun produit</h3>
            <p>Cette boutique n'a pas encore de produits.</p>
        </div>

    </main>

    <!-- ========================================== -->
    <!-- SLIDE COMMENTAIRES (du bas)                -->
    <!-- ========================================== -->
    <div class="slide-overlay" id="slideOverlay">
        <div class="slide-container">

            <div class="slide-handle"></div>

            <!-- HEADER -->
            <div class="slide-header">
                <div class="slide-product">
                    <button class="like-btn" id="likeBtn">
                        <i class="fas fa-heart"></i>
                    </button>
                    <span class="like-count" id="likeCount">0</span>
                    <span class="product-name-slide" id="slideProductName">Produit</span>
                </div>
                <div class="slide-actions">
                    <button class="btn-detail" id="detailBtn">
                        <i class="fas fa-eye"></i> Détail
                    </button>
                    <button class="btn-close-slide" id="closeSlideBtn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- BODY (commentaires) -->
            <div class="slide-body" id="slideBody">
                <!-- Injecté par JS -->
            </div>

            <!-- FOOTER (envoi commentaire) -->
            <div class="slide-footer">
                <input type="text" class="comment-input" id="commentInput" placeholder="Écrire un commentaire..." />
                <button class="btn-send-comment" id="sendCommentBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ Shop User - Version complète');

            // ==========================================
            // RÉFÉRENCES
            // ==========================================

            const skeletonLoader = document.getElementById('skeletonLoader');
            const productsGrid = document.getElementById('productsGrid');
            const emptyState = document.getElementById('emptyState');
            const shopName = document.getElementById('shopName');
            const productCount = document.getElementById('productCount');

            const slideOverlay = document.getElementById('slideOverlay');
            const closeSlideBtn = document.getElementById('closeSlideBtn');
            const slideProductName = document.getElementById('slideProductName');
            const likeBtn = document.getElementById('likeBtn');
            const likeCount = document.getElementById('likeCount');
            const detailBtn = document.getElementById('detailBtn');
            const slideBody = document.getElementById('slideBody');
            const commentInput = document.getElementById('commentInput');
            const sendCommentBtn = document.getElementById('sendCommentBtn');
            const messageBtn = document.getElementById('messageBtn');

            let currentProduct = null;
            let currentProductId = null;
            let isLiked = false;
            let likeCounter = 0;

            // ==========================================
            // RÉCUPÉRER L'ID DE LA BOUTIQUE
            // ==========================================

            const urlParams = new URLSearchParams(window.location.search);
            const shopId = urlParams.get('id');

            if (!shopId) {
                shopName.textContent = 'Boutique non trouvée';
                skeletonLoader.style.display = 'none';
                emptyState.style.display = 'block';
                emptyState.querySelector('p').textContent = 'ID de boutique manquant.';
                return;
            }

            // ==========================================
            // CHARGER LA BOUTIQUE ET SES PRODUITS
            // ==========================================

            async function loadShop() {
                try {
                    // ✅ Incrémenter les vues de la boutique
                    await fetch('/api/seller/shop/' + shopId + '/view', {
                        method: 'POST'
                    }).catch(err => console.warn('Erreur incrément vue boutique:', err));

                    // ✅ Récupérer les infos de la boutique
                    const res = await fetch('/api/seller/shop/' + shopId);
                    const data = await res.json();

                    if (!res.ok || !data.success) {
                        throw new Error(data.error || 'Erreur chargement');
                    }

                    const shop = data.shop;
                    const products = data.products || [];

                    skeletonLoader.style.display = 'none';

                    shopName.textContent = shop.name || 'Boutique';
                    productCount.textContent = products.length + ' produits';

                    if (products.length === 0) {
                        emptyState.style.display = 'block';
                        return;
                    }

                    // ✅ Incrémenter les vues pour tous les produits (page ouverte)
                    products.forEach(p => {
                        incrementProductViews(p.id);
                    });

                    renderProducts(products);

                    console.log('✅ ' + products.length + ' produits chargés');

                } catch (error) {
                    console.error('❌ Erreur:', error);
                    skeletonLoader.style.display = 'none';
                    emptyState.style.display = 'block';
                    emptyState.querySelector('p').textContent = error.message || 'Erreur de chargement.';
                }
            }

            // ==========================================
            // INCRÉMENTER LES VUES D'UN PRODUIT
            // ==========================================

            async function incrementProductViews(productId) {
                try {
                    await fetch('/api/seller/product/' + productId + '/view', {
                        method: 'POST'
                    });
                } catch (err) {
                    console.warn('Erreur incrément vue produit:', err);
                }
            }

            // ==========================================
            // AFFICHER LES PRODUITS
            // ==========================================

            function renderProducts(products) {
                productsGrid.style.display = 'grid';

                productsGrid.innerHTML = products.map(p => {
                    const stock = p.stock || 0;
                    let stockLabel = 'En stock';
                    let stockClass = 'in-stock';
                    if (stock === 0) {
                        stockLabel = 'Rupture';
                        stockClass = 'out-of-stock';
                    } else if (stock <= 5) {
                        stockLabel = 'Stock faible';
                        stockClass = 'low-stock';
                    }

                    const imgSrc = p.image1 || null;
                    const imgHtml = imgSrc ?
                        `<img src="${imgSrc}" alt="${p.name}" loading="lazy" />` :
                        `<div class="fallback">📦</div>`;

                    return `
                        <div class="product-card" data-id="${p.id}">
                            <div class="product-image">
                                ${imgHtml}
                                <span class="stock-badge ${stockClass}">${stockLabel}</span>
                            </div>
                            <div class="product-info">
                                <div class="product-name">${p.name}</div>
                                <div class="product-footer">
                                    <span class="product-price">${p.price.toLocaleString()} FCFA</span>
                                    <span class="product-stock-qty"><i class="fas fa-box"></i> ${stock}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                // Clic sur une carte → ouvrir slide + incrémenter vue
                document.querySelectorAll('.product-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        // ✅ Incrémenter la vue du produit (clic)
                        incrementProductViews(id);
                        openSlide(id);
                    });
                });
            }

            // ==========================================
            // OUVERTURE DU SLIDE
            // ==========================================

            function openSlide(productId) {
                // Récupérer le produit depuis la grille
                const productCard = document.querySelector(`.product-card[data-id="${productId}"]`);
                if (!productCard) return;

                const productName = productCard.querySelector('.product-name').textContent;
                const productPrice = productCard.querySelector('.product-price').textContent;

                // Construire l'objet produit
                const product = {
                    id: productId,
                    name: productName,
                    price: parseInt(productPrice.replace(/\D/g, '')),
                    likes: 0,
                    comments: []
                };

                // Charger les commentaires depuis l'API si besoin
                loadProductComments(productId, product);

                currentProduct = product;
                currentProductId = productId;

                slideProductName.textContent = product.name;
                likeCounter = product.likes || 0;
                isLiked = false;
                likeCount.textContent = likeCounter;
                likeBtn.classList.remove('liked');

                slideOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';

                setTimeout(() => {
                    commentInput.focus();
                }, 500);
            }

            // ==========================================
            // CHARGER LES COMMENTAIRES D'UN PRODUIT
            // ==========================================

            async function loadProductComments(productId, product) {
                try {
                    // Récupérer les commentaires depuis flex1 via API
                    const res = await fetch('/api/seller/product/' + productId);
                    const data = await res.json();

                    if (data.success && data.product) {
                        const comments = data.product.flex1 ? JSON.parse(data.product.flex1) : [];
                        product.comments = comments;
                        product.likes = parseInt(data.product.flex2) || 0;
                        renderComments(comments);
                        likeCounter = product.likes;
                        likeCount.textContent = likeCounter;
                    }
                } catch (err) {
                    console.warn('Erreur chargement commentaires:', err);
                    renderComments([]);
                }
            }

            // ==========================================
            // AFFICHER LES COMMENTAIRES
            // ==========================================

            function renderComments(comments) {
                if (!comments || comments.length === 0) {
                    slideBody.innerHTML = `
                        <div class="no-comments">
                            <i class="fas fa-comment-slash"></i>
                            <p>Aucun commentaire pour ce produit.<br>Soyez le premier à donner votre avis !</p>
                        </div>
                    `;
                    return;
                }

                slideBody.innerHTML = comments.map(c => `
                    <div class="comment-item">
                        <div class="comment-avatar">${c.avatar || '👤'}</div>
                        <div class="comment-content">
                            <div class="comment-user">${c.user}</div>
                            <div class="comment-text">${c.comment}</div>
                            <div class="comment-date">${c.date || 'Aujourd\'hui'}</div>
                        </div>
                    </div>
                `).join('');
            }

            // ==========================================
            // FERMER LE SLIDE
            // ==========================================

            function closeSlide() {
                slideOverlay.classList.remove('active');
                document.body.style.overflow = '';
                commentInput.value = '';
            }

            closeSlideBtn.addEventListener('click', closeSlide);
            slideOverlay.addEventListener('click', function(e) {
                if (e.target === slideOverlay) closeSlide();
            });

            // ==========================================
            // LIKE
            // ==========================================

            likeBtn.addEventListener('click', function() {
                if (isLiked) {
                    isLiked = false;
                    likeCounter--;
                    this.classList.remove('liked');
                } else {
                    isLiked = true;
                    likeCounter++;
                    this.classList.add('liked');
                }
                likeCount.textContent = likeCounter;

                // Mettre à jour le like dans la base
                if (currentProduct) {
                    currentProduct.likes = likeCounter;
                    updateProductLikes(currentProduct.id, likeCounter);
                }
            });

            async function updateProductLikes(productId, likes) {
                try {
                    await fetch('/api/seller/product/' + productId + '/like', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ likes: likes })
                    });
                } catch (err) {
                    console.warn('Erreur mise à jour likes:', err);
                }
            }

            // ==========================================
            // DÉTAIL → +1 vue + redirection
            // ==========================================

            detailBtn.addEventListener('click', function() {
                if (currentProduct) {
                    // ✅ Incrémenter la vue du produit (détail)
                    incrementProductViews(currentProduct.id);
                    window.location.href = '/detail-produit.html?id=' + currentProduct.id;
                }
            });

            // ==========================================
            // ENVOYER UN COMMENTAIRE
            // ==========================================

            function sendComment() {
                const text = commentInput.value.trim();
                if (!text || !currentProduct) return;

                const newComment = {
                    user: 'Moi',
                    avatar: '👤',
                    comment: text,
                    date: new Date().toLocaleDateString('fr-FR')
                };

                if (!currentProduct.comments) {
                    currentProduct.comments = [];
                }
                currentProduct.comments.push(newComment);

                // ✅ Sauvegarder les commentaires dans flex1
                saveComments(currentProduct.id, currentProduct.comments);

                renderComments(currentProduct.comments);
                commentInput.value = '';
                commentInput.focus();

                setTimeout(() => {
                    slideBody.scrollTop = slideBody.scrollHeight;
                }, 100);
            }

            async function saveComments(productId, comments) {
                try {
                    await fetch('/api/seller/product/' + productId + '/comments', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ comments: comments })
                    });
                } catch (err) {
                    console.warn('Erreur sauvegarde commentaires:', err);
                }
            }

            sendCommentBtn.addEventListener('click', sendComment);

            commentInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendComment();
                }
            });

            // ==========================================
            // BOUTON MESSAGE
            // ==========================================

            messageBtn.addEventListener('click', function() {
                window.location.href = '/chat-seller?id=' + shopId;
            });

            // ==========================================
            // INIT
            // ==========================================

            loadShop();
            console.log('✅ Shop User - Prêt');

        });
    </script>

</body>
</html>
