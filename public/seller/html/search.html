<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rechercher un produit | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/seller/css/search.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- HEADER                                     -->
    <!-- ========================================== -->
    <header class="search-header">
        <button class="back-btn" onclick="window.location.href='/dashboard'">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Rechercher un produit..." autofocus />
        </div>
        <button class="clear-btn" id="clearBtn" style="display:none;">
            <i class="fas fa-times-circle"></i>
        </button>
    </header>

    <!-- ========================================== -->
    <!-- MAIN                                       -->
    <!-- ========================================== -->
    <main class="search-main">

        <!-- ===== RÉSULTATS ===== -->
        <div class="results-container" id="resultsContainer">

            <!-- État initial -->
            <div class="initial-state" id="initialState">
                <i class="fas fa-search"></i>
                <h3>Rechercher un produit</h3>
                <p>Tapez un mot-clé pour trouver un produit dans vos boutiques</p>
            </div>

            <!-- Résultats -->
            <div class="results-grid" id="resultsGrid" style="display:none;">
                <!-- Injecté par JS -->
            </div>

            <!-- Aucun résultat -->
            <div class="no-results" id="noResults" style="display:none;">
                <i class="fas fa-search-minus"></i>
                <h3>Aucun résultat</h3>
                <p id="noResultsMessage">Aucun produit ne correspond à votre recherche</p>
            </div>

            <!-- Chargement -->
            <div class="loading-state" id="loadingState" style="display:none;">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Recherche en cours...</p>
            </div>

        </div>

    </main>

    <script src="/seller/js/search.js"></script>
</body>
</html>
