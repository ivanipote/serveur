<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boutiques | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/seller/css/boutiques.css">
</head>
<body>

    <header class="page-header">
        <button class="back-btn" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Rechercher une boutique..." />
        </div>
        <button class="clear-btn" id="clearBtn" style="display:none;">
            <i class="fas fa-times-circle"></i>
        </button>
    </header>

    <main class="page-main" id="pageMain">

        <!-- SKELETON -->
        <div class="skeleton-loader" id="skeletonLoader">
            <div class="skeleton-row"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div><div class="skeleton-stats"></div></div>
            <div class="skeleton-row"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div><div class="skeleton-stats"></div></div>
            <div class="skeleton-row"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div><div class="skeleton-stats"></div></div>
            <div class="skeleton-row"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div><div class="skeleton-stats"></div></div>
            <div class="skeleton-row"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div><div class="skeleton-stats"></div></div>
        </div>

        <!-- LISTE -->
        <div id="shopsList" style="display:none;"></div>

        <!-- EMPTY -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <i class="fas fa-store"></i>
            <h3>Aucune boutique</h3>
            <p>Revenez plus tard.</p>
        </div>

        <!-- NO RESULTS -->
        <div class="empty-state" id="noResults" style="display:none;">
            <i class="fas fa-search"></i>
            <h3>Aucun résultat</h3>
            <p id="noResultsMessage">Aucune boutique ne correspond.</p>
        </div>

    </main>

    <script src="/seller/js/boutiques.js"></script>
</body>
</html>
