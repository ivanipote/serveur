<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Détail produit | ComPlus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ==========================================
           STYLES COMPLETS
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
        }

        /* ===== HEADER ===== */
        .detail-header {
            background: #17A464;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 2px 10px rgba(23, 164, 100, 0.2);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .detail-header .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .detail-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.05);
        }

        .detail-header .detail-title {
            flex: 1;
            font-size: 18px;
            font-weight: 700;
            color: white;
            text-align: center;
        }

        /* ===== MAIN ===== */
        .detail-main {
            flex: 1;
            overflow: hidden;
            position: relative;
            padding: 10px 10px 0 10px;
            display: flex;
            flex-direction: column;
        }

        /* ===== IMAGES ===== */
        .images-section {
            width: 100%;
            flex: 1;
            background: #f0f2f5;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            border: 10px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(2px);
            min-height: 0;
        }

        .image-carousel {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        .image-slide {
            width: 100%;
            height: 100%;
            display: flex;
            transition: transform 0.4s ease;
        }

        .image-slide img {
            min-width: 100%;
            height: 100%;
            object-fit: contain;
            background: white;
        }

        .image-slide .no-image {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f2f5;
            color: #d0d0da;
            font-size: 48px;
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s;
            z-index: 5;
        }

        .carousel-nav:hover {
            background: rgba(0, 0, 0, 0.7);
            transform: translateY(-50%) scale(1.05);
        }

        .carousel-nav.prev {
            left: 10px;
        }

        .carousel-nav.next {
            right: 10px;
        }

        .carousel-nav.hidden {
            display: none;
        }

        /* ==========================================
           SLIDE INFO (fixe en bas)
           ========================================== */
        .info-slide {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px 30px 0 0;
            padding: 18px 22px 24px 22px;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.08);
            max-height: 45%;
            overflow-y: auto;
            flex-shrink: 0;
            margin-top: 10px;
            width: 100%;
            animation: slideUp 0.4s ease-out;
        }

        .info-slide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: var(--slide-bg-image, none);
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.6);
            z-index: -1;
            border-radius: 30px 30px 0 0;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0.6;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .info-slide::-webkit-scrollbar {
            width: 3px;
        }
        .info-slide::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .info-slide .slide-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            margin: 0 auto 12px auto;
        }

        .info-slide .slide-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 4px;
        }

        .info-slide .slide-header h2 {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            flex: 1;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .info-slide .slide-header .price {
            font-size: 22px;
            font-weight: 800;
            color: #4ade80;
            white-space: nowrap;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .info-slide .slide-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .info-slide .slide-meta span {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.2);
        }

        .info-slide .slide-meta .stock.low {
            color: #fbbf24;
        }

        .info-slide .slide-meta .stock.out {
            color: #f87171;
        }

        .info-slide .slide-description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.5;
            margin-bottom: 10px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.2);
        }

        .info-slide .slide-shop {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 2px;
        }

        .info-slide .slide-shop .shop-icon {
            font-size: 18px;
            color: #4ade80;
        }

        .info-slide .slide-shop .shop-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.2);
        }

        .info-slide .slide-shop .shop-link {
            font-size: 13px;
            color: #93c5fd;
            text-decoration: none;
            font-weight: 500;
            margin-left: auto;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.2);
        }

        .info-slide .slide-shop .shop-link:hover {
            text-decoration: underline;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */

        @media (max-width: 768px) {
            .detail-header {
                padding: 10px 14px;
                gap: 10px;
                border-radius: 0 0 16px 16px;
            }
            .detail-header .back-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .detail-header .detail-title {
                font-size: 16px;
            }
            .detail-main {
                padding: 8px 8px 0 8px;
            }
            .images-section {
                border-width: 8px;
                border-radius: 16px;
            }
            .info-slide {
                padding: 14px 16px 20px 16px;
                border-radius: 24px 24px 0 0;
                max-height: 45%;
                margin-top: 8px;
            }
            .info-slide .slide-header h2 {
                font-size: 19px;
            }
            .info-slide .slide-header .price {
                font-size: 19px;
            }
            .info-slide .slide-description {
                font-size: 13px;
            }
            .carousel-nav {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .detail-header {
                padding: 8px 10px;
                gap: 8px;
                border-radius: 0 0 14px 14px;
            }
            .detail-header .back-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .detail-header .detail-title {
                font-size: 14px;
            }
            .detail-main {
                padding: 6px 6px 0 6px;
            }
            .images-section {
                border-width: 6px;
                border-radius: 14px;
            }
            .info-slide {
                padding: 12px 12px 16px 12px;
                border-radius: 20px 20px 0 0;
                max-height: 50%;
                margin-top: 6px;
            }
            .info-slide .slide-header h2 {
                font-size: 17px;
            }
            .info-slide .slide-header .price {
                font-size: 17px;
            }
            .info-slide .slide-meta span {
                font-size: 12px;
            }
            .info-slide .slide-description {
                font-size: 13px;
            }
            .info-slide .slide-shop .shop-name {
                font-size: 13px;
            }
            .info-slide .slide-shop .shop-link {
                font-size: 12px;
            }
            .carousel-nav {
                width: 28px;
                height: 28px;
                font-size: 12px;
            }
            .carousel-nav.prev {
                left: 6px;
            }
            .carousel-nav.next {
                right: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="detail-header">
        <button class="back-btn" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="detail-title" id="detailTitle">Détail produit</span>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="detail-main">

        <!-- ===== IMAGES ===== -->
        <section class="images-section" id="imagesSection">
            <div class="image-carousel" id="imageCarousel">
                <div class="image-slide" id="imageSlide">
                    <div class="no-image">
                        <i class="fas fa-image"></i>
                    </div>
                </div>
                <button class="carousel-nav prev hidden" id="prevImage">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="carousel-nav next hidden" id="nextImage">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </section>

        <!-- ===== SLIDE INFO ===== -->
        <div class="info-slide" id="infoSlide">

            <div class="slide-handle"></div>

            <div class="slide-header">
                <h2 id="productName">Nom du produit</h2>
                <span class="price" id="productPrice">0 FCFA</span>
            </div>

            <div class="slide-meta">
                <span class="stock" id="productStock">📦 En stock</span>
                <span id="productCategory">🏷️ Catégorie</span>
            </div>

            <div class="slide-description" id="productDescription">
                Description du produit
            </div>

            <div class="slide-shop">
                <span class="shop-icon">🏪</span>
                <span class="shop-name" id="shopName">Nom de la boutique</span>
                <a href="#" class="shop-link" id="shopLink">Voir la boutique →</a>
            </div>

        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            console.log('✅ Détail produit - Version client');

            // ==========================================
            // RÉFÉRENCES
            // ==========================================

            const imageSlide = document.getElementById('imageSlide');
            const prevBtn = document.getElementById('prevImage');
            const nextBtn = document.getElementById('nextImage');
            const infoSlide = document.getElementById('infoSlide');

            const productName = document.getElementById('productName');
            const productPrice = document.getElementById('productPrice');
            const productStock = document.getElementById('productStock');
            const productCategory = document.getElementById('productCategory');
            const productDescription = document.getElementById('productDescription');
            const shopName = document.getElementById('shopName');
            const shopLink = document.getElementById('shopLink');

            let currentImageIndex = 0;
            let images = [];
            let productId = null;
            let shopId = null;

            // ==========================================
            // URL
            // ==========================================

            const SELLER_API_URL = 'https://nature-plus-seller.onrender.com';

            // ==========================================
            // RÉCUPÉRER L'ID DU PRODUIT
            // ==========================================

            const urlParams = new URLSearchParams(window.location.search);
            productId = urlParams.get('id');

            if (!productId) {
                showError('ID de produit manquant');
                return;
            }

            // ==========================================
            // CHARGER LE PRODUIT
            // ==========================================

            async function loadProduct() {
                try {
                    const res = await fetch(SELLER_API_URL + '/api/seller/product/' + productId);
                    const data = await res.json();

                    if (!data.success || !data.product) {
                        throw new Error('Produit non trouvé');
                    }

                    const product = data.product;

                    // Récupérer la boutique pour avoir le nom
                    const shopRes = await fetch(SELLER_API_URL + '/api/seller/shop/' + product.shop_id);
                    const shopData = await shopRes.json();

                    renderProduct(product, shopData.shop || null);

                } catch (error) {
                    console.error('❌ Erreur:', error);
                    showError(error.message || 'Erreur de chargement');
                }
            }

            // ==========================================
            // AFFICHER LE PRODUIT
            // ==========================================

            function renderProduct(product, shop) {
                productName.textContent = product.name;
                productPrice.textContent = product.price.toLocaleString() + ' FCFA';
                productCategory.textContent = '🏷️ ' + (product.category || 'Non catégorisé');
                productDescription.textContent = product.description || 'Aucune description';

                const stock = product.stock || 0;
                let stockLabel = '📦 ' + stock + ' en stock';
                let stockClass = '';
                if (stock === 0) {
                    stockClass = 'out';
                    stockLabel = '🚫 Rupture de stock';
                } else if (stock <= 5) {
                    stockClass = 'low';
                    stockLabel = '⚠️ ' + stock + ' restant(s)';
                }
                productStock.textContent = stockLabel;
                productStock.className = 'stock ' + stockClass;

                if (shop) {
                    shopName.textContent = shop.name;
                    shopLink.href = '/shop-user?id=' + shop.id;
                } else {
                    shopName.textContent = 'Boutique non trouvée';
                    shopLink.style.display = 'none';
                }

                // Images
                images = [];
                if (product.image1) images.push(product.image1);
                if (product.image2) images.push(product.image2);
                if (product.image3) images.push(product.image3);

                renderImages();

                // Image de fond pour l'info slide
                if (images.length > 0) {
                    infoSlide.style.setProperty('--slide-bg-image', `url(${images[0]})`);
                }
            }

            // ==========================================
            // AFFICHER LES IMAGES
            // ==========================================

            function renderImages() {
                if (!images || images.length === 0) {
                    imageSlide.innerHTML = `
                        <div class="no-image">
                            <i class="fas fa-image"></i>
                        </div>
                    `;
                    prevBtn.classList.add('hidden');
                    nextBtn.classList.add('hidden');
                    return;
                }

                const total = images.length;

                imageSlide.innerHTML = images.map(img => `
                    <img src="${img}" alt="Image produit" loading="lazy" />
                `).join('');

                currentImageIndex = 0;
                updateCarousel();
            }

            function updateCarousel() {
                const total = images.length;

                if (total === 0) {
                    prevBtn.classList.add('hidden');
                    nextBtn.classList.add('hidden');
                    return;
                }

                const offset = -currentImageIndex * 100;
                imageSlide.style.transform = `translateX(${offset}%)`;

                prevBtn.classList.toggle('hidden', currentImageIndex === 0);
                nextBtn.classList.toggle('hidden', currentImageIndex === total - 1);
            }

            function nextImage() {
                const total = images.length;
                if (currentImageIndex < total - 1) {
                    currentImageIndex++;
                    updateCarousel();
                }
            }

            function prevImage() {
                if (currentImageIndex > 0) {
                    currentImageIndex--;
                    updateCarousel();
                }
            }

            prevBtn.addEventListener('click', prevImage);
            nextBtn.addEventListener('click', nextImage);

            // ==========================================
            // ERREUR
            // ==========================================

            function showError(message) {
                productName.textContent = 'Erreur';
                productPrice.textContent = '0 FCFA';
                productStock.textContent = '⚠️ ' + message;
                productDescription.textContent = 'Impossible de charger le produit.';
                shopName.textContent = '-';
                shopLink.style.display = 'none';
                imageSlide.innerHTML = `
                    <div class="no-image">
                        <i class="fas fa-exclamation-circle"></i>
                    </div>
                `;
            }

            // ==========================================
            // INIT
            // ==========================================

            loadProduct();
            console.log('✅ Détail produit - Prêt');

        });
    </script>

</body>
</html>
