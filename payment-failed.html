<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement annulé | Nature+</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8d7da;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
        }
        .icon { font-size: 72px; margin-bottom: 8px; }
        h1 { color: #721c24; font-size: 28px; margin-bottom: 8px; }
        p { color: #666; font-size: 16px; margin-bottom: 6px; }
        .sub { font-size: 14px; color: #888; margin-top: 4px; }
        .spinner { 
            width: 40px; 
            height: 40px; 
            border: 4px solid #e8e8f0;
            border-top-color: #dc3545;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 16px auto;
        }
        .btn-retry {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 32px;
            background: #2d7d46;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }
        .btn-retry:hover { background: #1a5a33; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 22px; }
            .icon { font-size: 48px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">❌</div>
        <h1>Paiement annulé</h1>
        <p>Vous n'avez pas finalisé le paiement.</p>
        <p class="sub">Vérification de votre session...</p>
        <div class="spinner"></div>
        <a href="/mescommandes" class="btn-retry">↩️ Retourner</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const commandeId = urlParams.get('commande_id');

        async function handlePaymentFailed() {
            try {
                // 1. VÉRIFIER L'AUTHENTIFICATION
                const authRes = await fetch('/api/client/me');
                const authData = await authRes.json();

                if (!authData.success) {
                    console.warn('❌ Non authentifié, redirection vers login');
                    window.location.href = '/login';
                    return;
                }

                console.log('✅ Utilisateur authentifié:', authData.user);

                // 2. METTRE À JOUR LE STATUT
                if (commandeId) {
                    const updateRes = await fetch('/api/payment/update-status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            commandeId: commandeId,
                            status: 'annulee',
                            cause: 'Paiement non finalisé par le client'
                        })
                    });

                    const updateData = await updateRes.json();
                    console.log('✅ Statut mis à jour:', updateData);
                }

                // 3. REDIRIGER VERS MESCOMMANDES
                setTimeout(() => {
                    window.location.href = '/mescommandes';
                }, 1500);

            } catch (error) {
                console.error('❌ Erreur:', error);
                window.location.href = '/mescommandes';
            }
        }

        handlePaymentFailed();
    </script>
</body>
</html>
