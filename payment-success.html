<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement réussi | Nature+</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #d4edda;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
        }
        .checkmark {
            width: 80px;
            height: 80px;
            background: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 40px;
            color: white;
        }
        h1 { color: #155724; font-size: 28px; margin-bottom: 8px; }
        p { color: #666; font-size: 16px; margin-bottom: 6px; }
        .sub { font-size: 14px; color: #888; margin-top: 4px; }
        .spinner { 
            width: 40px; 
            height: 40px; 
            border: 4px solid #e8e8f0;
            border-top-color: #28a745;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 16px auto;
        }
        .error-box {
            background: #f8d7da;
            color: #721c24;
            padding: 16px;
            border-radius: 12px;
            margin: 16px 0;
            border: 1px solid #f5c6cb;
        }
        .btn-retry {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 32px;
            background: #2d7d46;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }
        .btn-retry:hover { background: #1a5a33; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 22px; }
            .checkmark { width: 60px; height: 60px; font-size: 30px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✓</div>
        <h1>✅ Paiement réussi !</h1>
        <p>Votre commande est en cours de préparation.</p>
        <p class="sub" id="statusMessage">Vérification de votre session...</p>
        <div class="spinner" id="loadingSpinner"></div>
        <div id="errorContainer" style="display:none;"></div>
        <div id="successActions" style="display:none;">
            <p style="color:#155724;font-weight:600;margin-top:8px;">✅ Mise à jour effectuée !</p>
            <a href="/mescommandes" class="btn-retry">↩️ Voir mes commandes</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const commandeId = urlParams.get('commande_id');

        const statusMessage = document.getElementById('statusMessage');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorContainer = document.getElementById('errorContainer');
        const successActions = document.getElementById('successActions');

        async function handlePaymentSuccess() {
            try {
                // 1. VÉRIFIER L'AUTHENTIFICATION
                statusMessage.textContent = '🔍 Vérification de votre session...';
                
                const authRes = await fetch('/api/client/me');
                const authData = await authRes.json();

                // 2. SI PAS DE SESSION → AFFICHER ERREUR SANS REDIRIGER
                if (!authData.success) {
                    statusMessage.textContent = '⚠️ Session non trouvée';
                    loadingSpinner.style.display = 'none';
                    
                    errorContainer.style.display = 'block';
                    errorContainer.innerHTML = `
                        <div class="error-box">
                            <strong>⚠️ Problème de session</strong>
                            <p style="margin-top:8px;font-size:14px;">
                                Votre session a expiré ou n'a pas été trouvée.<br>
                                La commande a bien été payée, mais nous ne pouvons pas mettre à jour votre statut.
                            </p>
                            <p style="margin-top:8px;font-size:13px;color:#888;">
                                Commande #${commandeId || 'inconnue'}
                            </p>
                            <a href="/mescommandes" class="btn-retry" style="margin-top:8px;">↩️ Voir mes commandes</a>
                            <br>
                            <a href="/login" class="btn-retry" style="margin-top:8px;background:#6C63FF;">🔑 Se reconnecter</a>
                        </div>
                    `;
                    return;
                }

                console.log('✅ Utilisateur authentifié:', authData.user);

                // 3. METTRE À JOUR LE STATUT
                statusMessage.textContent = '⏳ Mise à jour du statut...';

                if (commandeId) {
                    const updateRes = await fetch('/api/payment/update-status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            commandeId: commandeId,
                            status: 'payee'
                        })
                    });

                    const updateData = await updateRes.json();
                    console.log('✅ Statut mis à jour:', updateData);

                    if (updateRes.ok) {
                        statusMessage.textContent = '✅ Succès !';
                        loadingSpinner.style.display = 'none';
                        successActions.style.display = 'block';
                    } else {
                        throw new Error(updateData.error || 'Erreur mise à jour');
                    }
                } else {
                    statusMessage.textContent = '⚠️ Aucun ID de commande';
                    loadingSpinner.style.display = 'none';
                    errorContainer.style.display = 'block';
                    errorContainer.innerHTML = `
                        <div class="error-box">
                            <strong>⚠️ Commande non identifiée</strong>
                            <p style="margin-top:8px;font-size:14px;">
                                Aucun ID de commande n'a été fourni.
                            </p>
                            <a href="/mescommandes" class="btn-retry" style="margin-top:8px;">↩️ Voir mes commandes</a>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('❌ Erreur:', error);
                statusMessage.textContent = '❌ Erreur';
                loadingSpinner.style.display = 'none';
                
                errorContainer.style.display = 'block';
                errorContainer.innerHTML = `
                    <div class="error-box">
                        <strong>❌ Une erreur est survenue</strong>
                        <p style="margin-top:8px;font-size:14px;">
                            ${error.message || 'Erreur inconnue'}
                        </p>
                        <a href="/mescommandes" class="btn-retry" style="margin-top:8px;">↩️ Voir mes commandes</a>
                    </div>
                `;
            }
        }

        handlePaymentSuccess();
    </script>
</body>
</html>
